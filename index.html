<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICT Game World</title>
<meta name="description" content="ICT games for grades 6 to 9, in Sinhala and English.">
<meta name="theme-color" content="#007e74">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-grade="6">

<a class="skip" href="#main">Skip to content</a>

<header class="topbar" id="topbar">
  <button class="chip" id="homeBtn" type="button">
    <span class="chip-full" data-i18n="appName">ICT Game World</span>
    <span class="chip-short" id="chipGrade">6</span>
  </button>
  <div class="topbar-right">
    <span class="xp" id="xp" hidden><span class="xp-star">★</span><span id="xpValue">0</span></span>
    <div class="langswitch" role="group" aria-label="Language">
      <button type="button" data-lang="si" lang="si">සිං</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<footer class="credit">
  <span data-i18n="madeBy">Made by Ishini Premachandra &amp; Dilini Wijesooriya</span>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
