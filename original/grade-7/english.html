<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 7 ICT Game | Ruwanpura NCoE</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f172a;--bg2:#1e293b;--card:#ffffff;--ink:#1f2d3d;--muted:#64748b;
    --line:#e2e8f0;
    --teal:#14b8a6;--teal-d:#0f766e;--teal-l:#ccfbf1;
    --amber:#fbbf24;--amber-d:#d97706;--amber-l:#fef3c7;
    --coral:#fb7185;--coral-d:#e11d48;--coral-l:#ffe4e6;
    --indigo:#818cf8;--indigo-d:#4338ca;--indigo-l:#e0e7ff;
    --green:#22c55e;--green-d:#15803d;--green-l:#dcfce7;
    --pink:#f472b6;--pink-d:#be185d;--pink-l:#fce7f3;
    --purple:#a855f7;--purple-d:#7e22ce;--purple-l:#f3e8ff;
    --cyan:#22d3ee;--cyan-d:#0891b2;
    --red:#ef4444;--red-d:#b91c1c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:linear-gradient(160deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);
    color:var(--ink);font-family:'Nunito',system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  }

  /* Animated starry background */
  .stars-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .star{
    position:absolute;background:#fff;border-radius:50%;
    animation:twinkleStar 3s ease-in-out infinite;
  }
  @keyframes twinkleStar{
    0%,100%{opacity:.15;transform:scale(1);}
    50%{opacity:.9;transform:scale(1.4);}
  }
  .floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .floater{
    position:absolute;font-size:32px;opacity:.18;
    animation:floatAround 16s ease-in-out infinite;
  }
  @keyframes floatAround{
    0%,100%{transform:translate(0,0) rotate(-8deg) scale(1);}
    25%{transform:translate(25px,-35px) rotate(8deg) scale(1.1);}
    50%{transform:translate(-20px,-15px) rotate(-5deg) scale(.95);}
    75%{transform:translate(18px,25px) rotate(12deg) scale(1.05);}
  }

  /* ============ HUD TOP BAR ============ */
  .hud{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px;background:rgba(15,23,42,.85);
    border-bottom:3px solid var(--cyan);backdrop-filter:blur(10px);
    flex-wrap:wrap;position:sticky;top:0;z-index:100;
    box-shadow:0 4px 20px rgba(34,211,238,.15);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-chip{
    background:linear-gradient(135deg,var(--cyan),var(--purple));
    color:#fff;font-weight:900;font-size:15px;padding:8px 16px;border-radius:12px;
    box-shadow:0 0 20px rgba(34,211,238,.5);letter-spacing:1px;
    font-family:'Fredoka',sans-serif;
  }
  .brand-text{font-weight:800;font-size:14px;color:#e2e8f0;}
  .hud-stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .hud-chip{
    background:rgba(255,255,255,.1);color:#fff;font-weight:900;font-size:13px;
    padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:6px;
    border:2px solid rgba(255,255,255,.15);
  }
  .hud-chip.xp{border-color:var(--amber);color:var(--amber);}
  .hud-chip.combo{border-color:var(--coral);color:var(--coral);}
  .hud-chip.combo.hot{animation:comboPulse .6s infinite alternate;}
  @keyframes comboPulse{from{transform:scale(1);box-shadow:0 0 0 rgba(251,113,133,.6);}to{transform:scale(1.1);box-shadow:0 0 20px rgba(251,113,133,.8);}}
  .music-btn{
    border:none;background:var(--cyan);color:#0f172a;font-family:inherit;
    font-weight:900;font-size:13.5px;padding:10px 16px;border-radius:999px;
    cursor:pointer;box-shadow:0 3px 0 var(--cyan-d);transition:all .15s;
  }
  .music-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cyan-d);}
  .music-btn.on{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d);}

  /* XP bar */
  .xp-bar-wrap{
    position:fixed;top:0;left:0;right:0;height:5px;background:rgba(15,23,42,.4);z-index:200;
  }
  .xp-bar{
    height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--coral));
    transition:width .6s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 12px rgba(168,85,247,.7);
  }

  main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:20px;position:relative;z-index:1;}
  .screen{display:none;animation:slideIn .4s;}
  .screen.active{display:block;}
  @keyframes slideIn{from{opacity:0;transform:translateY(20px) scale(.98);}to{opacity:1;transform:none;}}

  h1{font-size:30px;margin:0 0 8px;text-align:center;color:#fff;font-family:'Fredoka',sans-serif;font-weight:700;
    text-shadow:0 0 20px rgba(34,211,238,.4);}
  h2{font-size:20px;margin:0 0 14px;text-align:center;color:var(--cyan);font-weight:800;}
  .sub{text-align:center;color:#94a3b8;font-size:15px;margin:0 0 22px;line-height:1.7;font-weight:600;}

  /* ============ BUTTONS ============ */
  .btn{
    border:none;font-family:inherit;font-weight:900;font-size:16px;
    padding:14px 26px;border-radius:16px;cursor:pointer;color:#fff;
    background:var(--cyan);box-shadow:0 5px 0 var(--cyan-d), 0 0 20px rgba(34,211,238,.3);
    transition:all .12s;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cyan-d);}
  .btn.amber{background:var(--amber);color:#422006;box-shadow:0 5px 0 var(--amber-d),0 0 20px rgba(251,191,36,.3);}
  .btn.amber:active{box-shadow:0 1px 0 var(--amber-d);}
  .btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-d),0 0 20px rgba(251,113,133,.3);}
  .btn.coral:active{box-shadow:0 1px 0 var(--coral-d);}
  .btn.purple{background:var(--purple);box-shadow:0 5px 0 var(--purple-d),0 0 20px rgba(168,85,247,.3);}
  .btn.purple:active{box-shadow:0 1px 0 var(--purple-d);}
  .btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.2);}
  .btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.3);}
  .btn.small{padding:10px 18px;font-size:14px;border-radius:12px;}
  .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;}

  /* ============ HOME ============ */
  .hero{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:20px;}
  .hero-svg{width:170px;height:170px;animation:bob 3s ease-in-out infinite;
    filter:drop-shadow(0 0 30px rgba(34,211,238,.6));}
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-16px) rotate(3deg);}
  }
  .hero-bubble{
    background:rgba(255,255,255,.95);border:3px dashed var(--cyan);border-radius:22px;
    padding:14px 24px;font-weight:800;font-size:16px;color:var(--teal-d);
    text-align:center;max-width:600px;line-height:1.7;
    animation:pulseBubble 3s ease-in-out infinite;
  }
  @keyframes pulseBubble{0%,100%{transform:scale(1);}50%{transform:scale(1.02);}}

  /* ============ LESSON GRID ============ */
  .lesson-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;margin-top:22px;
  }
  .lesson-card{
    background:var(--card);border-radius:24px;padding:22px 16px 18px;cursor:pointer;
    border:4px solid transparent;
    box-shadow:0 8px 0 rgba(0,0,0,.3), 0 0 30px rgba(34,211,238,.15);
    transition:transform .2s, box-shadow .2s, border-color .2s;
    display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
    position:relative;overflow:hidden;
  }
  .lesson-card::before{
    content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;
    border-radius:50%;opacity:.4;
  }
  .lesson-card.l1::before{background:var(--cyan);}
  .lesson-card.l2::before{background:var(--coral);}
  .lesson-card.l3::before{background:var(--red);}
  .lesson-card.l4::before{background:var(--purple);}
  .lesson-card.l5::before{background:var(--green);}
  .lesson-card.l6::before{background:var(--amber);}
  .lesson-card.l7::before{background:var(--pink);}
  .lesson-card:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .lesson-card:hover{transform:translateY(-4px) scale(1.02);border-color:var(--cyan);box-shadow:0 12px 0 rgba(0,0,0,.3),0 0 40px rgba(34,211,238,.4);}
  .lesson-icon{
    width:80px;height:80px;border-radius:24px;
    display:flex;align-items:center;justify-content:center;
    font-size:42px;position:relative;z-index:1;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.15);
  }
  .lesson-card.l1 .lesson-icon{background:var(--cyan);}
  .lesson-card.l2 .lesson-icon{background:var(--coral);}
  .lesson-card.l3 .lesson-icon{background:var(--red);}
  .lesson-card.l4 .lesson-icon{background:var(--purple);}
  .lesson-card.l5 .lesson-icon{background:var(--green);}
  .lesson-card.l6 .lesson-icon{background:var(--amber);}
  .lesson-card.l7 .lesson-icon{background:var(--pink);}
  .lesson-num{
    position:absolute;top:12px;left:14px;font-size:11.5px;font-weight:900;
    color:var(--teal-d);background:var(--teal-l);padding:4px 12px;border-radius:999px;
    z-index:1;letter-spacing:1px;
  }
  .lesson-title{font-weight:900;font-size:16px;line-height:1.4;position:relative;z-index:1;color:var(--ink);}
  .lesson-progress{
    font-size:13px;font-weight:800;color:var(--muted);
    background:var(--bg);padding:5px 14px;border-radius:999px;position:relative;z-index:1;
    display:flex;align-items:center;gap:6px;
  }
  .prog-dots{display:flex;gap:3px;}
  .prog-dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;}
  .prog-dot.done{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,.6);}

  /* ============ ACTIVITY LIST ============ */
  .act-list{display:grid;gap:12px;max-width:720px;margin:0 auto;}
  .act-item{
    background:#fff;border:3px solid var(--line);border-radius:18px;
    padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;
    box-shadow:0 5px 0 var(--line);transition:all .15s;
  }
  .act-item:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line);}
  .act-item:hover{transform:translateX(4px);border-color:var(--cyan);}
  .act-item.done{border-color:var(--green);background:var(--green-l);}
  .act-item.done .act-num{background:var(--green);color:#fff;}
  .act-num{
    width:46px;height:46px;border-radius:14px;background:var(--amber-l);
    color:var(--amber-d);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:18px;flex-shrink:0;
  }
  .act-name{flex:1;font-weight:800;font-size:15px;line-height:1.45;color:var(--ink);}
  .act-type{
    font-size:11.5px;color:var(--muted);font-weight:800;
    background:var(--bg);padding:5px 12px;border-radius:999px;flex-shrink:0;letter-spacing:.5px;
  }

  /* ============ ACTIVITY VIEW ============ */
  .act-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .score-pill{
    background:#fff;border:3px solid var(--line);border-radius:999px;
    padding:8px 18px;font-weight:900;font-size:15px;color:var(--teal-d);
    margin-left:auto;
  }
  .act-body{background:#fff;border-radius:22px;padding:22px;border:3px solid var(--line);
    box-shadow:0 10px 40px rgba(0,0,0,.2);}
  .act-instruction{
    background:linear-gradient(135deg,var(--teal-l),#a7f3d0);color:var(--teal-d);
    border-radius:16px;padding:14px 18px;font-weight:800;font-size:15px;line-height:1.7;
    margin-bottom:20px;display:flex;gap:10px;align-items:flex-start;
    border-left:6px solid var(--teal);
  }
  .act-instruction::before{content:'💡';font-size:22px;flex-shrink:0;}

  /* MCQ */
  .q-text{font-size:19px;font-weight:800;line-height:1.6;margin:6px 0 18px;color:var(--ink);}
  .q-counter{font-size:13px;color:var(--muted);font-weight:900;margin-bottom:6px;letter-spacing:1px;}
  .options{display:grid;gap:11px;}
  .opt{
    border:3px solid var(--line);background:#fff;border-radius:15px;
    padding:15px 18px;font-family:inherit;font-size:16px;font-weight:700;
    cursor:pointer;color:var(--ink);text-align:left;transition:all .13s;
    box-shadow:0 4px 0 var(--line);position:relative;overflow:hidden;
  }
  .opt:hover{border-color:var(--cyan);transform:translateX(4px);}
  .opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .opt.correct{background:var(--green-l);border-color:var(--green);color:var(--green-d);
    animation:correctPulse .5s;}
  @keyframes correctPulse{0%{transform:scale(1);}50%{transform:scale(1.03);}100%{transform:scale(1);}}
  .opt.wrong{background:var(--coral-l);border-color:var(--coral);color:var(--coral-d);
    animation:wrongShake .4s;}
  @keyframes wrongShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:16px;font-weight:900;font-size:17px;min-height:26px;text-align:center;}

  /* MATCH */
  .match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .match-col{display:grid;gap:11px;align-content:start;}
  .match-item{
    background:#fff;border:3px solid var(--line);border-radius:15px;
    padding:14px 16px;font-weight:700;font-size:15px;line-height:1.5;
    cursor:pointer;transition:all .13s;text-align:center;
    box-shadow:0 4px 0 var(--line);
    display:flex;align-items:center;justify-content:center;gap:8px;
    min-height:66px;
  }
  .match-item:hover{border-color:var(--cyan);}
  .match-item:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .match-item.selected{border-color:var(--purple);background:var(--purple-l);color:var(--purple-d);
    box-shadow:0 4px 0 var(--purple), 0 0 20px rgba(168,85,247,.4);}
  .match-item.matched{
    border-color:var(--green);background:var(--green-l);color:var(--green-d);
    pointer-events:none;opacity:.9;animation:correctPulse .5s;
  }
  .match-item.shake{animation:wrongShake .4s;}
  .match-icon{font-size:28px;flex-shrink:0;}

  /* SYM MATCH */
  .sym-match-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .sym-col-header{font-size:12px;color:var(--muted);font-weight:900;text-align:center;
    margin-bottom:4px;letter-spacing:1px;}
  .sym-card{
    background:#fff;border:3px solid var(--line);border-radius:15px;
    padding:12px 8px;font-weight:700;font-size:14px;line-height:1.4;
    cursor:pointer;transition:all .13s;text-align:center;
    box-shadow:0 4px 0 var(--line);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    min-height:118px;justify-content:center;
  }
  .sym-card:hover{border-color:var(--cyan);}
  .sym-card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .sym-card.selected{border-color:var(--purple);background:var(--purple-l);
    box-shadow:0 4px 0 var(--purple),0 0 20px rgba(168,85,247,.4);}
  .sym-card.matched{
    border-color:var(--green);background:var(--green-l);color:var(--green-d);
    pointer-events:none;opacity:.9;animation:correctPulse .5s;
  }
  .sym-card.shake{animation:wrongShake .4s;}
  .sym-card svg{width:80px;height:50px;}

  /* ORDER */
  .order-list{display:grid;gap:10px;}
  .order-item{
    background:#fff;border:3px solid var(--line);border-radius:15px;
    padding:13px 16px;font-weight:700;font-size:15px;line-height:1.55;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 4px 0 var(--line);
    transition:all .13s;
  }
  .order-item:hover{border-color:var(--cyan);}
  .order-item .num{
    width:36px;height:36px;border-radius:11px;background:var(--amber-l);
    color:var(--amber-d);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:16px;flex-shrink:0;
  }
  .order-item .txt{flex:1;display:flex;align-items:center;gap:8px;}
  .order-item .movers{display:flex;gap:5px;flex-direction:column;}
  .mover{
    border:none;background:var(--teal-l);color:var(--teal-d);
    width:36px;height:26px;border-radius:8px;font-weight:900;
    cursor:pointer;font-size:13px;line-height:1;transition:all .1s;
  }
  .mover:hover{background:var(--teal);color:#fff;}
  .mover:disabled{opacity:.3;cursor:default;}
  .order-item.correct{border-color:var(--green);background:var(--green-l);}
  .order-item.correct .num{background:var(--green);color:#fff;}

  /* BUCKET */
  .bucket-items{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px;min-height:60px;}
  .b-item{
    background:#fff;border:3px solid var(--line);border-radius:13px;
    padding:11px 16px;font-weight:800;font-size:14.5px;cursor:pointer;
    transition:all .13s;box-shadow:0 4px 0 var(--line);
    display:flex;align-items:center;gap:6px;
  }
  .b-item:hover{border-color:var(--cyan);transform:translateY(-2px);}
  .b-item:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .b-item.selected{border-color:var(--purple);background:var(--purple-l);color:var(--purple-d);
    box-shadow:0 4px 0 var(--purple),0 0 15px rgba(168,85,247,.4);}
  .b-item.placed{opacity:.2;pointer-events:none;}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .bucket{
    background:var(--bg);border:3px dashed var(--line);border-radius:18px;
    padding:14px;min-height:150px;cursor:pointer;transition:all .15s;
  }
  .bucket:hover{border-color:var(--cyan);border-style:solid;}
  .bucket.active{background:var(--teal-l);border-color:var(--teal);border-style:solid;
    transform:scale(1.02);}
  .bucket-title{
    font-weight:900;font-size:14.5px;color:var(--teal-d);
    text-align:center;margin-bottom:10px;padding-bottom:9px;
    border-bottom:2px solid var(--line);
  }
  .bucket-contents{display:flex;flex-wrap:wrap;gap:6px;}
  .b-chip{
    background:var(--green-l);color:var(--green-d);font-weight:800;
    font-size:12.5px;padding:6px 12px;border-radius:10px;animation:chipIn .3s;
  }
  @keyframes chipIn{from{transform:scale(0);}to{transform:scale(1);}}

  /* PICK */
  .pick-list{display:grid;gap:10px;}
  .pick-item{
    background:#fff;border:3px solid var(--line);border-radius:15px;
    padding:14px 16px;font-weight:700;font-size:15px;line-height:1.55;
    cursor:pointer;transition:all .13s;display:flex;align-items:center;gap:12px;
    box-shadow:0 4px 0 var(--line);
  }
  .pick-item:hover{border-color:var(--cyan);transform:translateX(4px);}
  .pick-item:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .pick-box{
    width:28px;height:28px;border-radius:9px;border:3px solid var(--line);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:900;transition:all .15s;
  }
  .pick-item.picked{border-color:var(--purple);background:var(--purple-l);}
  .pick-item.picked .pick-box{border-color:var(--purple);background:var(--purple);color:#fff;}
  .pick-item.correct{border-color:var(--green);background:var(--green-l);}
  .pick-item.correct .pick-box{border-color:var(--green);background:var(--green);color:#fff;}
  .pick-item.wrong{border-color:var(--coral);background:var(--coral-l);}
  .pick-item.wrong .pick-box{border-color:var(--coral);background:var(--coral);color:#fff;}
  .pick-icon{font-size:24px;flex-shrink:0;}

  /* RESULT */
  .result-box{
    background:#fff;border-radius:26px;padding:32px 22px;text-align:center;
    border:3px solid var(--line);position:relative;overflow:hidden;
  }
  .result-box::before{
    content:'';position:absolute;inset:-50%;
    background:radial-gradient(circle,rgba(34,211,238,.15),transparent 60%);
    animation:rotateGlow 8s linear infinite;
  }
  @keyframes rotateGlow{to{transform:rotate(360deg);}}

  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();

    catch(e){return;}}
  if(actx.state==='suspended')actx.resume();
}
function playMelody(){
  if(!musicOn||!actx)return;
  const m=MELODIES[currentMelody]||MELODIES.home;
  const beat=m.tempo;let t=actx.currentTime+.05;
  m.notes.forEach(([f,d])=>{
    if(f>0){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=m.wave;o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(1,t+.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d*beat*.9);
      o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d*beat);
    }
    t+=d*beat;
  });
  const total=m.notes.reduce((a,n)=>a+n[1],0)*beat;
  const bass=m.bass||[];
  bass.forEach((bf,i)=>{
    const bt=actx.currentTime+.05+(total/bass.length)*i;
    const bo=actx.createOscillator(),bg=actx.createGain();
    bo.type='sine';bo.frequency.value=bf;
    bg.gain.setValueAtTime(0.0001,bt);
    bg.gain.exponentialRampToValueAtTime(.6,bt+.03);
    bg.gain.exponentialRampToValueAtTime(0.0001,bt+beat*2);
    bo.connect(bg);bg.connect(musicGain);bo.start(bt);bo.stop(bt+beat*2+.05);
  });
  musicTimer=setTimeout(playMelody,total*1000+400);
}

}

function blip(f,d=.08,type='sine',v=.13,delay=0){
  if(!actx)return;const t=actx.currentTime+delay;

  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.03);
}

/* ============================================================
   GAME STATE (XP, combo)
   ============================================================ */
const state={currentLesson:null,currentActivity:null,completed:{},
  xp:0,combo:0,comboMax:0,highestCombo:0};

function addXP(amount){
  state.xp+=amount;
  document.getElementById('xpVal').textContent=state.xp;
  const bar=document.getElementById('xpBar');
  const pct=Math.min(100,(state.xp%200)/2);
  bar.style.width=pct+'%';
  const color=state.xp<200?'linear-gradient(90deg,#22d3ee,#a855f7)':
    state.xp<500?'linear-gradient(90deg,#a855f7,#fb7185)':'linear-gradient(90deg,#fbbf24,#fb7185)';
  bar.style.background=color;
}
function addCombo(){
  state.combo++;
  state.comboMax=Math.max(state.comboMax,state.combo);
  document.getElementById('comboVal').textContent=state.combo;
  const chip=document.getElementById('comboChip');
  if(state.combo>=3){chip.classList.add('hot');sfx.combo();
    showFloatScore('+'+(state.combo*5)+' combo!','#fb7185');
  }else chip.classList.remove('hot');
}
function resetCombo(){state.combo=0;document.getElementById('comboVal').textContent=0;
  document.getElementById('comboChip').classList.remove('hot');}
function showFloatScore(text,color){
  const d=document.createElement('div');
  d.className='float-score';d.textContent=text;d.style.color=color;
  d.style.left=(window.innerWidth/2-40)+'px';
  d.style.top=(window.innerHeight/2)+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1000);
}
function flashScreen(){
  const f=document.createElement('div');f.className='flash';
  document.body.appendChild(f);setTimeout(()=>f.remove(),300);
}
function confettiBurst(count){
  const colors=['#22d3ee','#fbbf24','#fb7185','#a855f7','#22c55e','#ef4444'];
  for(let i=0;i<count;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration=(1.8+Math.random()*1.8)+'s';
    c.style.animationDelay=(Math.random()*.5)+'s';
    if(Math.random()>.6)c.style.borderRadius='50%';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4200);
  }
}

function buildBackground(){
  const s=document.getElementById('starsBg');
  for(let i=0;i<50;i++){
    const st=document.createElement('div');st.className='star';
    const sz=1+Math.random()*2.5;
    st.style.width=sz+'px';st.style.height=sz+'px';
    st.style.left=Math.random()*100+'%';st.style.top=Math.random()*100+'%';
    st.style.animationDelay=(Math.random()*3)+'s';
    s.appendChild(st);
  }
  const fl=document.getElementById('floaters');
  const emojis=['💻','🖱️','⌨️','💾','🖥️','📱','⭐','🎮','📁','🔍','🌐','📀','🖨️','📸','🎵','✏️','🧠','🛡️','📊','🧩'];
  const positions=[{top:'8%',left:'3%'},{top:'18%',right:'5%'},{top:'32%',left:'2%'},
    {top:'48%',right:'3%'},{top:'62%',left:'4%'},{top:'78%',right:'4%'},
    {top:'88%',left:'8%'},{top:'12%',right:'12%'},{top:'55%',left:'8%'},{top:'72%',right:'10%'}];

    const d=document.createElement('div');d.className='floater';

}

/* ============================================================
   MCQ
   ============================================================ */
function renderMCQ(c,a){
  let idx=0,score=0;const total=a.questions.length;
  function draw(){
    if(idx>=total)return finish();
    const q=a.questions[idx];
    c.innerHTML=`
      <div class="act-instruction">${a.instruction}</div>
      <div class="q-counter">QUESTION ${idx+1} / ${total}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts"></div>
      <div class="feedback" id="fb"></div>`;
    const o=document.getElementById('opts');
    q.opts.forEach((t,i)=>{
      const b=document.createElement('button');b.className='opt';b.textContent=t;
      b.onclick=()=>pick(i,b);o.appendChild(b);
    });
    document.getElementById('scorePill').textContent=`Score: ${score} / ${total}`;
  }
  function pick(i,btn){
    const q=a.questions[idx];const all=document.querySelectorAll('.opt');
    all.forEach(x=>x.disabled=true);
    if(i===q.ans){
      btn.classList.add('correct');score++;addCombo();
      sfx.correct();flashScreen();
      showFloatScore('+'+(10+state.combo*2)+' XP','#22c55e');
      addXP(10+state.combo*2);
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct! 🎉</span>';
    }else{
      btn.classList.add('wrong');all[q.ans].classList.add('correct');
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Wrong. Green = correct answer.</span>';
    }
    document.getElementById('scorePill').textContent=`Score: ${score} / ${total}`;
    setTimeout(()=>{idx++;draw();},1500);
  }
  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;sfx.win();
    const stars=score===total?3:score>=total*.6?2:1;
    let starHTML='';
    for(let i=0;i<3;i++){
      if(i<stars)starHTML+=`<span class="star-fill" style="animation-delay:${i*.2}s">⭐</span>`;
      else starHTML+=`<span class="star-empty">☆</span>`;
    }
    if(stars===3)confettiBurst(50);
    c.innerHTML=`
      <div class="result-box">
        <div class="result-emoji">${stars===3?'🏆':stars===2?'🎯':'💪'}</div>
        <h2 style="color:var(--teal-d);">LEVEL COMPLETE!</h2>
        <div class="stars">${starHTML}</div>
        <div class="result-score">${score} / ${total}</div>
        <p class="result-msg">Highest Combo: <b>${state.comboMax}</b> 🔥</p>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Level</button>
          <button class="btn ghost" onclick="goHome()">🏠 Home</button>
        </div>
      </div>`;
  }
  draw();
}

/* ============================================================
   MATCH
   ============================================================ */
function renderMatch(c,a){
  const pairs=a.pairs;
  const left=pairs.map((p,i)=>({text:p.l,key:i,icon:p.li}));
  const right=shuffle(pairs.map((p,i)=>({text:p.r,key:i,icon:p.ri})));
  let sel=null,matched=0,wrongAttempts=0;const total=pairs.length;
  function updatePill(){document.getElementById('scorePill').textContent=`Matched: ${matched} / ${total}`;}
  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div class="match-wrap"><div class="match-col" id="lc"></div><div class="match-col" id="rc"></div></div>
    <div class="feedback" id="fb"></div>`;
  const lc=document.getElementById('lc'),rc=document.getElementById('rc');
  left.forEach(it=>{
    const d=document.createElement('div');d.className='match-item';
    d.innerHTML=`<span class="match-icon">${it.icon||''}</span><span>${it.text}</span>`;
    d.dataset.key=it.key;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#lc .match-item').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');sel={el:d,it};};
    lc.appendChild(d);
  });
  right.forEach(it=>{
    const d=document.createElement('div');d.className='match-item';
    d.innerHTML=`<span class="match-icon">${it.icon||''}</span><span>${it.text}</span>`;
    d.dataset.key=it.key;
    d.onclick=()=>{
      if(d.classList.contains('matched'))return;
      if(!sel){document.getElementById('fb').textContent='Select an item from the left first.';return;}
      if(sel.it.key===it.key){
        sel.el.classList.remove('selected');sel.el.classList.add('matched');d.classList.add('matched');
        matched++;addCombo();sfx.correct();
        showFloatScore('+'+(8+state.combo*2)+' XP','#22c55e');
        addXP(8+state.combo*2);
        document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Perfect match! 👏</span>';
        sel=null;updatePill();
        if(matched===total)finish();
      }else{
        d.classList.add('shake');const sl=sel.el;sl.classList.add('shake');
        setTimeout(()=>{d.classList.remove('shake');sl.classList.remove('shake');},450);
        sfx.wrong();wrongAttempts++;resetCombo();
        document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Not a match. Try again.</span>';
        sl.classList.remove('selected');sel=null;
      }
    };
    rc.appendChild(d);
  });
  updatePill();
  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();
      const stars=wrongAttempts===0?3:wrongAttempts<=2?2:1;
      let starHTML='';
      for(let i=0;i<3;i++){
        if(i<stars)starHTML+=`<span class="star-fill" style="animation-delay:${i*.2}s">⭐</span>`;
        else starHTML+=`<span class="star-empty">☆</span>`;
      }
      if(stars===3)confettiBurst(50);
      c.innerHTML=`
        <div class="result-box">
          <div class="result-emoji">${stars===3?'🌟':stars===2?'🎯':'💪'}</div>
          <h2 style="color:var(--teal-d);">ALL MATCHED!</h2>
          <div class="stars">${starHTML}</div>
          <p class="result-msg">Wrong attempts: <b>${wrongAttempts}</b></p>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Level</button>
            <button class="btn ghost" onclick="goHome()">🏠 Home</button>
          </div>
        </div>`;
    },900);
  }
}

/* ============================================================
   SYMBOL MATCH
   ============================================================ */
function renderSymMatch(c,a){
  const triples=a.triples;
  const symOrder=shuffle(triples.map((t,i)=>({...t,key:i})));
  const nameOrder=shuffle(triples.map((t,i)=>({...t,key:i})));
  const meanOrder=shuffle(triples.map((t,i)=>({...t,key:i})));
  let selSym=null,selName=null,selMean=null,matchedCount=0;
  const total=triples.length;
  function updatePill(){document.getElementById('scorePill').textContent=`Matched: ${matchedCount} / ${total}`;}
  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div class="sym-match-wrap">
      <div><div class="sym-col-header">SYMBOL</div><div id="symCol" style="display:grid;gap:11px;"></div></div>
      <div><div class="sym-col-header">NAME</div><div id="nameCol" style="display:grid;gap:11px;"></div></div>
      <div><div class="sym-col-header">MEANING</div><div id="meanCol" style="display:grid;gap:11px;"></div></div>
    </div>
    <div class="feedback" id="fb"></div>`;
  const symCol=document.getElementById('symCol'),nameCol=document.getElementById('nameCol'),meanCol=document.getElementById('meanCol');
  symOrder.forEach(t=>{
    const d=document.createElement('div');d.className='sym-card';d.dataset.key=t.key;
    d.innerHTML=`<div style="display:flex;justify-content:center;">${SYMBOLS[t.symbol]}</div>`;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#symCol .sym-card').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selSym={el:d,key:t.key};checkTriple();};
    symCol.appendChild(d);
  });
  nameOrder.forEach(t=>{
    const d=document.createElement('div');d.className='sym-card';d.dataset.key=t.key;
    d.innerHTML=`<span style="font-size:14px;font-weight:800;">${t.name}</span>`;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#nameCol .sym-card').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selName={el:d,key:t.key};checkTriple();};
    nameCol.appendChild(d);
  });
  meanOrder.forEach(t=>{
    const d=document.createElement('div');d.className='sym-card';d.dataset.key=t.key;
    d.innerHTML=`<span style="font-size:14px;font-weight:800;">${t.meaning}</span>`;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#meanCol .sym-card').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selMean={el:d,key:t.key};checkTriple();};
    meanCol.appendChild(d);
  });
  updatePill();
  function checkTriple(){
    if(selSym&&selName&&selMean){
      const k1=selSym.key,k2=selName.key,k3=selMean.key;
      if(k1===k2&&k2===k3){
        [selSym.el,selName.el,selMean.el].forEach(el=>{el.classList.remove('selected');el.classList.add('matched');});
        matchedCount++;addCombo();sfx.correct();
        showFloatScore('+'+(15+state.combo*3)+' XP','#22c55e');addXP(15+state.combo*3);
        document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Perfect triple! 🎉</span>';
        selSym=selName=selMean=null;updatePill();
        if(matchedCount===total)finish();
      }else{
        [selSym.el,selName.el,selMean.el].forEach(el=>{
          el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),450);
        });
        sfx.wrong();resetCombo();
        document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Not a correct triple. Try again.</span>';
        setTimeout(()=>{
          [selSym.el,selName.el,selMean.el].forEach(el=>el.classList.remove('selected'));
          selSym=selName=selMean=null;
        },500);
      }
    }
  }
  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();confettiBurst(60);
      c.innerHTML=`
        <div class="result-box">
          <div class="result-emoji">🏆</div>
          <h2 style="color:var(--teal-d);">ALL SYMBOLS MATCHED!</h2>
          <div class="stars">
            <span class="star-fill">⭐</span><span class="star-fill" style="animation-delay:.2s">⭐</span><span class="star-fill" style="animation-delay:.4s">⭐</span>
          </div>
          <p class="result-msg">You know your flow chart symbols perfectly!</p>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Level</button>
            <button class="btn ghost" onclick="goHome()">🏠 Home</button>
          </div>
        </div>`;
    },900);
  }
}

/* ============================================================
   ORDER
   ============================================================ */
function renderOrder(c,a){
  const correct=a.correctOrder.map(x=>typeof x==='string'?x:x.text);
  let current=shuffle(a.correctOrder.map((x,i)=>({text:typeof x==='string'?x:x.text,icon:typeof x==='string'?null:x.icon,orig:i})));
  function draw(){
    c.innerHTML=`
      <div class="act-instruction">${a.instruction}</div>
      <div class="order-list" id="ol"></div>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn purple" id="ck">✔ Check Order</button>
      </div>
      <div class="feedback" id="fb"></div>`;
    const list=document.getElementById('ol');
    current.forEach((it,i)=>{
      const d=document.createElement('div');d.className='order-item';
      d.innerHTML=`
        <div class="num">${i+1}</div>
        <div class="txt">${it.icon?`<span style="font-size:22px;">${it.icon}</span>`:''}<span>${it.text}</span></div>
        <div class="movers">
          <button class="mover" ${i===0?'disabled':''} data-dir="up">▲</button>
          <button class="mover" ${i===current.length-1?'disabled':''} data-dir="down">▼</button>
        </div>`;
      list.appendChild(d);
      d.querySelector('[data-dir="up"]').onclick=()=>swap(i,i-1);
      d.querySelector('[data-dir="down"]').onclick=()=>swap(i,i+1);
    });
    document.getElementById('ck').onclick=check;
  }
  function swap(i,j){
    if(j<0||j>=current.length)return;sfx.click();
    [current[i],current[j]]=[current[j],current[i]];draw();
  }
  function check(){
    let allCorrect=true;
    document.querySelectorAll('.order-item').forEach((el,i)=>{
      if(current[i].text===correct[i])el.classList.add('correct');
      else allCorrect=false;
    });
    if(allCorrect){
      sfx.correct();flashScreen();
      showFloatScore('+'+(20+state.combo*3)+' XP','#22c55e');addXP(20+state.combo*3);addCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Perfect order! 🎉</span>';
      state.completed[state.currentLesson.id+'-'+a.id]=true;
      setTimeout(()=>{
        sfx.win();confettiBurst(60);
        c.innerHTML=`
          <div class="result-box">
            <div class="result-emoji">✅</div>
            <h2 style="color:var(--teal-d);">WELL DONE!</h2>
            <div class="stars">
              <span class="star-fill">⭐</span><span class="star-fill" style="animation-delay:.2s">⭐</span><span class="star-fill" style="animation-delay:.4s">⭐</span>
            </div>
            <div class="btn-row">
              <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Level</button>
              <button class="btn ghost" onclick="goHome()">🏠 Home</button>
            </div>
          </div>`;
      },1400);
    }else{
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Some steps are wrong. Try again.</span>';
      setTimeout(()=>{document.querySelectorAll('.order-item.correct').forEach(el=>el.classList.remove('correct'));},1400);
    }
  }
  draw();
}

/* ============================================================
   BUCKET
   ============================================================ */
function renderBucket(c,a){
  const allItems=[];a.buckets.forEach((b,bi)=>b.items.forEach(t=>allItems.push({text:t,bucket:bi})));
  const pool=shuffle(allItems.slice());let selected=null,placed=0;const total=allItems.length;
  function updatePill(){document.getElementById('scorePill').textContent=`Score: ${placed} / ${total}`;}
  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div class="bucket-items" id="pool"></div>
    <div class="buckets" id="bks"></div>
    <div class="feedback" id="fb"></div>`;
  const poolEl=document.getElementById('pool');
  pool.forEach((it,i)=>{
    const d=document.createElement('div');d.className='b-item';d.textContent=it.text;
    d.onclick=()=>{
      if(d.classList.contains('placed'))return;sfx.click();
      document.querySelectorAll('.b-item').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selected={el:d,item:it};
    };
    poolEl.appendChild(d);
  });
  const bksEl=document.getElementById('bks');
  a.buckets.forEach((b,bi)=>{
    const d=document.createElement('div');d.className='bucket';d.dataset.bi=bi;
    d.innerHTML=`<div class="bucket-title">${b.name}</div><div class="bucket-contents"></div>`;
    d.onclick=()=>drop(bi,d);bksEl.appendChild(d);
  });
  updatePill();
  function drop(bi,el){
    if(!selected)return;const it=selected.item;
    if(it.bucket===bi){
      el.classList.add('active');setTimeout(()=>el.classList.remove('active'),500);
      const chip=document.createElement('div');chip.className='b-chip';chip.textContent=it.text;
      el.querySelector('.bucket-contents').appendChild(chip);
      selected.el.classList.remove('selected');selected.el.classList.add('placed');
      selected=null;placed++;addCombo();sfx.correct();
      showFloatScore('+'+(6+state.combo*2)+' XP','#22c55e');addXP(6+state.combo*2);
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct bucket!</span>';
      updatePill();
      if(placed===total)finish();
    }else{
      el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),450);sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Wrong bucket. Try again.</span>';
    }
  }
  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();confettiBurst(50);
      c.innerHTML=`
        <div class="result-box">
          <div class="result-emoji">🗂️</div>
          <h2 style="color:var(--teal-d);">ALL SORTED!</h2>
          <div class="stars">
            <span class="star-fill">⭐</span><span class="star-fill" style="animation-delay:.2s">⭐</span><span class="star-fill" style="animation-delay:.4s">⭐</span>
          </div>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Level</button>
            <button class="btn ghost" onclick="goHome()">🏠 Home</button>
          </div>
        </div>`;
    },900);
  }
}

/* ============================================================
   PICK
   ============================================================ */
function renderPick(c,a){
  const items=shuffle(a.items.slice());const picked=new Set();
  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div class="pick-list" id="pl"></div>
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn purple" id="ck">✔ Check Answers</button>
    </div>
    <div class="feedback" id="fb"></div>`;
  const list=document.getElementById('pl');
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='pick-item';
    d.innerHTML=`<div class="pick-box"></div>${it.icon?`<span class="pick-icon">${it.icon}</span>`:''}<div style="flex:1;">${it.text}</div>`;
    d.onclick=()=>{
      sfx.click();
      if(picked.has(i)){picked.delete(i);d.classList.remove('picked');d.querySelector('.pick-box').textContent='';}
      else{picked.add(i);d.classList.add('picked');d.querySelector('.pick-box').textContent='✓';}
    };
    list.appendChild(d);
  });
  document.getElementById('ck').onclick=()=>{
    let correct=true;
    document.querySelectorAll('.pick-item').forEach((el,i)=>{
      const it=items[i];const wasPicked=picked.has(i);
      if(it.correct&&wasPicked){el.classList.remove('picked');el.classList.add('correct');el.querySelector('.pick-box').textContent='✓';}
      else if(it.correct&&!wasPicked){el.classList.add('correct');el.querySelector('.pick-box').textContent='✓';correct=false;}
      else if(!it.correct&&wasPicked){el.classList.remove('picked');el.classList.add('wrong');el.querySelector('.pick-box').textContent='✘';correct=false;}
    });
    if(correct){
      sfx.correct();flashScreen();addCombo();
      showFloatScore('+'+(20+state.combo*3)+' XP','#22c55e');addXP(20+state.combo*3);
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Perfect! All correct! 🎉</span>';
      state.completed[state.currentLesson.id+'-'+a.id]=true;
      setTimeout(()=>{
        sfx.win();confettiBurst(60);
        c.innerHTML=`
          <div class="result-box">
            <div class="result-emoji">🌟</div>
            <h2 style="color:var(--teal-d);">EXCELLENT!</h2>
            <div class="stars">
              <span class="star-fill">⭐</span><span class="star-fill" style="animation-delay:.2s">⭐</span><span class="star-fill" style="animation-delay:.4s">⭐</span>
            </div>
            <div class="btn-row">
              <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Level</button>
              <button class="btn ghost" onclick="goHome()">🏠 Home</button>
            </div>
          </div>`;
      },1500);
    }else{
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Some are wrong. Check the red/green marks.</span>';
    }
  };
}

/* ============================================================
   UTIL + INIT
   ============================================================ */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
