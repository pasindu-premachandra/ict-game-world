<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6 ශ්‍රේණිය ICT ක්‍රීඩාව | Ruwanpura NCoE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef7f4;
    --ink:#1f2d3d;
    --muted:#5b6b7c;
    --line:#d9e6e2;
    --teal:#14b8a6;--teal-d:#0f766e;--teal-l:#ccfbf1;
    --amber:#fbbf24;--amber-d:#d97706;--amber-l:#fef3c7;
    --coral:#fb7185;--coral-d:#e11d48;--coral-l:#ffe4e6;
    --indigo:#818cf8;--indigo-d:#4338ca;--indigo-l:#e0e7ff;
    --green:#22c55e;--green-d:#15803d;--green-l:#dcfce7;
    --pink:#f472b6;--pink-d:#be185d;--pink-l:#fce7f3;
    --blue:#60a5fa;--blue-d:#1d4ed8;--blue-l:#dbeafe;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Noto Sans Sinhala',system-ui,sans-serif;
    font-size:18px;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  }

  /* Floating decorations */
  .floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .floater{
    position:absolute;font-size:34px;opacity:.28;
    animation:floatAround 14s ease-in-out infinite;
  }
  @keyframes floatAround{
    0%,100%{transform:translate(0,0) rotate(-8deg) scale(1);}
    25%{transform:translate(20px,-30px) rotate(6deg) scale(1.08);}
    50%{transform:translate(-15px,-15px) rotate(-4deg) scale(.96);}
    75%{transform:translate(15px,20px) rotate(10deg) scale(1.05);}
  }

  /* Header */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 20px;background:#fff;border-bottom:5px solid var(--teal);
    flex-wrap:wrap;position:sticky;top:0;z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-chip{
    background:linear-gradient(135deg,var(--teal),var(--indigo-d));
    color:#fff;font-weight:900;font-size:18px;padding:9px 18px;border-radius:14px;
    letter-spacing:.5px;box-shadow:0 3px 8px rgba(20,184,166,.35);
  }
  .brand-text{font-weight:800;font-size:17px;color:var(--teal-d);}
  .music-btn{
    border:none;background:var(--amber);color:#5a3b00;font-family:inherit;
    font-weight:900;font-size:16px;padding:12px 22px;border-radius:999px;
    cursor:pointer;box-shadow:0 4px 0 var(--amber-d);transition:all .15s;
  }
  .music-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--amber-d);}
  .music-btn.on{background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d);}

  main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:20px;position:relative;z-index:1;}
  .screen{display:none;animation:fade .35s;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  h1{font-size:32px;margin:0 0 10px;text-align:center;color:var(--teal-d);line-height:1.35;font-weight:900;}
  h2{font-size:24px;margin:0 0 16px;text-align:center;color:var(--indigo-d);font-weight:800;}
  .sub{text-align:center;color:var(--muted);font-size:17px;margin:0 0 22px;line-height:1.7;font-weight:600;}

  /* Buttons */
  .btn{
    border:none;font-family:inherit;font-weight:900;font-size:18px;
    padding:16px 30px;border-radius:18px;cursor:pointer;color:#fff;
    background:var(--teal);box-shadow:0 6px 0 var(--teal-d);
    transition:all .12s;display:inline-flex;align-items:center;gap:10px;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal-d);}
  .btn.amber{background:var(--amber);color:#5a3b00;box-shadow:0 6px 0 var(--amber-d);}
  .btn.amber:active{box-shadow:0 2px 0 var(--amber-d);}
  .btn.indigo{background:var(--indigo);box-shadow:0 6px 0 var(--indigo-d);}
  .btn.indigo:active{box-shadow:0 2px 0 var(--indigo-d);}
  .btn.coral{background:var(--coral);box-shadow:0 6px 0 var(--coral-d);}
  .btn.coral:active{box-shadow:0 2px 0 var(--coral-d);}
  .btn.ghost{background:#fff;color:var(--teal-d);box-shadow:0 6px 0 var(--line);}
  .btn.ghost:active{box-shadow:0 2px 0 var(--line);}
  .btn.small{padding:12px 22px;font-size:16px;border-radius:13px;}
  .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}

  /* Home */
  .hero{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:14px;}
  .hero-svg{width:180px;height:180px;animation:bob 2.8s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(20,184,166,.3));}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-14px) rotate(2deg);}}
  .hero-bubble{
    background:#fff;border:4px dashed var(--teal);border-radius:22px;
    padding:14px 26px;font-weight:800;font-size:18px;color:var(--teal-d);
    text-align:center;max-width:640px;line-height:1.7;
  }

  /* Lesson grid */
  .lesson-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;margin-top:22px;
  }
  .lesson-card{
    background:#fff;border-radius:26px;padding:24px 18px 20px;cursor:pointer;
    border:4px solid var(--line);box-shadow:0 8px 0 var(--line);
    transition:transform .14s, box-shadow .14s, border-color .2s;
    display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
    position:relative;overflow:hidden;
  }
  .lesson-card::before{
    content:'';position:absolute;top:-30px;right:-30px;width:110px;height:110px;
    border-radius:50%;opacity:.35;
  }
  .lesson-card.l1::before{background:var(--teal-l);}
  .lesson-card.l2::before{background:var(--coral-l);}
  .lesson-card.l3::before{background:var(--amber-l);}
  .lesson-card.l4::before{background:var(--indigo-l);}
  .lesson-card.l5::before{background:var(--green-l);}
  .lesson-card.l6::before{background:var(--pink-l);}
  .lesson-card:active{transform:translateY(5px);box-shadow:0 3px 0 var(--line);}
  .lesson-card:hover{border-color:var(--teal);}
  .lesson-icon{
    width:88px;height:88px;border-radius:26px;
    display:flex;align-items:center;justify-content:center;
    font-size:46px;background:var(--teal-l);position:relative;z-index:1;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.06);
  }
  .lesson-card.l1 .lesson-icon{background:var(--teal-l);}
  .lesson-card.l2 .lesson-icon{background:var(--coral-l);}
  .lesson-card.l3 .lesson-icon{background:var(--amber-l);}
  .lesson-card.l4 .lesson-icon{background:var(--indigo-l);}
  .lesson-card.l5 .lesson-icon{background:var(--green-l);}
  .lesson-card.l6 .lesson-icon{background:var(--pink-l);}
  .lesson-num{
    position:absolute;top:14px;left:16px;font-size:14px;font-weight:900;
    color:var(--teal-d);background:var(--teal-l);padding:5px 14px;border-radius:999px;
    z-index:1;
  }
  .lesson-title{font-weight:900;font-size:19px;line-height:1.5;position:relative;z-index:1;}
  .lesson-progress{
    font-size:15px;font-weight:800;color:var(--muted);
    background:var(--bg);padding:6px 16px;border-radius:999px;position:relative;z-index:1;
  }

  /* Activity list */
  .act-list{display:grid;gap:14px;max-width:760px;margin:0 auto;}
  .act-item{
    background:#fff;border:4px solid var(--line);border-radius:20px;
    padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;
    box-shadow:0 6px 0 var(--line);transition:all .14s;
  }
  .act-item:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line);}
  .act-item.done{border-color:var(--green);background:#f0fdf4;}
  .act-item.done .act-num{background:var(--green);color:#fff;}
  .act-num{
    width:52px;height:52px;border-radius:16px;background:var(--amber-l);
    color:var(--amber-d);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:20px;flex-shrink:0;
  }
  .act-name{flex:1;font-weight:800;font-size:17px;line-height:1.55;}
  .act-type{
    font-size:14px;color:var(--muted);font-weight:800;
    background:var(--bg);padding:6px 14px;border-radius:999px;flex-shrink:0;
  }

  /* Activity view */
  .act-header{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .score-pill{
    background:#fff;border:3px solid var(--line);border-radius:999px;
    padding:9px 22px;font-weight:900;font-size:17px;color:var(--teal-d);
    margin-left:auto;
  }
  .act-body{background:#fff;border-radius:26px;padding:26px;border:4px solid var(--line);}
  .act-instruction{
    background:var(--teal-l);color:var(--teal-d);border-radius:20px;
    padding:18px 22px;font-weight:800;font-size:18px;line-height:1.75;
    margin-bottom:22px;display:flex;gap:12px;align-items:flex-start;
  }
  .act-instruction::before{content:'💡';font-size:26px;flex-shrink:0;}

  /* MCQ */
  .q-text{font-size:21px;font-weight:800;line-height:1.7;margin:8px 0 20px;}
  .options{display:grid;gap:13px;}
  .opt{
    border:4px solid var(--line);background:#fff;border-radius:18px;
    padding:17px 20px;font-family:inherit;font-size:18px;font-weight:700;
    cursor:pointer;color:var(--ink);text-align:left;transition:all .13s;
    box-shadow:0 5px 0 var(--line);
  }
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line);}
  .opt.correct{background:var(--green-l);border-color:var(--green);color:var(--green-d);}
  .opt.wrong{background:var(--coral-l);border-color:var(--coral);color:var(--coral-d);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:18px;font-weight:800;font-size:19px;min-height:28px;text-align:center;}

  /* Match */
  .match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .match-col{display:grid;gap:12px;align-content:start;}
  .match-item{
    background:#fff;border:4px solid var(--line);border-radius:18px;
    padding:16px 18px;font-weight:700;font-size:17px;line-height:1.6;
    cursor:pointer;transition:all .13s;text-align:center;
    box-shadow:0 5px 0 var(--line);
    display:flex;align-items:center;justify-content:center;gap:10px;
    min-height:74px;
  }
  .match-item:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line);}
  .match-item.selected{border-color:var(--indigo);background:var(--indigo-l);color:var(--indigo-d);}
  .match-item.matched{
    border-color:var(--green);background:var(--green-l);color:var(--green-d);
    pointer-events:none;opacity:.9;
  }
  .match-item.shake{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }
  .match-icon{font-size:32px;flex-shrink:0;}

  /* Symbol match */
  .sym-match-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .sym-card{
    background:#fff;border:4px solid var(--line);border-radius:18px;
    padding:14px 10px;font-weight:700;font-size:16px;line-height:1.45;
    cursor:pointer;transition:all .13s;text-align:center;
    box-shadow:0 5px 0 var(--line);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    min-height:130px;justify-content:center;
  }
  .sym-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line);}
  .sym-card.selected{border-color:var(--indigo);background:var(--indigo-l);color:var(--indigo-d);}
  .sym-card.matched{
    border-color:var(--green);background:var(--green-l);color:var(--green-d);
    pointer-events:none;opacity:.9;
  }
  .sym-card.shake{animation:shake .4s;}
  .sym-card svg{width:88px;height:54px;}

  /* Order */
  .order-list{display:grid;gap:12px;}
  .order-item{
    background:#fff;border:4px solid var(--line);border-radius:18px;
    padding:15px 18px;font-weight:700;font-size:17px;line-height:1.6;
    display:flex;align-items:center;gap:14px;
    box-shadow:0 5px 0 var(--line);
  }
  .order-item .num{
    width:40px;height:40px;border-radius:12px;background:var(--amber-l);
    color:var(--amber-d);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:17px;flex-shrink:0;
  }
  .order-item .txt{flex:1;display:flex;align-items:center;gap:10px;}
  .order-item .movers{display:flex;gap:6px;flex-direction:column;}
  .mover{
    border:none;background:var(--teal-l);color:var(--teal-d);
    width:40px;height:30px;border-radius:10px;font-weight:900;
    cursor:pointer;font-size:15px;line-height:1;
  }
  .mover:disabled{opacity:.35;cursor:default;}
  .order-item.correct{border-color:var(--green);background:var(--green-l);}
  .order-item.correct .num{background:var(--green);color:#fff;}

  /* Bucket */
  .bucket-items{display:flex;flex-wrap:wrap;gap:11px;margin-bottom:20px;min-height:70px;}
  .b-item{
    background:#fff;border:4px solid var(--line);border-radius:15px;
    padding:12px 18px;font-weight:800;font-size:16px;cursor:pointer;
    transition:all .13s;box-shadow:0 5px 0 var(--line);
    display:flex;align-items:center;gap:8px;
  }
  .b-item:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line);}
  .b-item.selected{border-color:var(--indigo);background:var(--indigo-l);color:var(--indigo-d);}
  .b-item.placed{opacity:.25;pointer-events:none;}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .bucket{
    background:var(--bg);border:4px dashed var(--line);border-radius:22px;
    padding:16px;min-height:160px;cursor:pointer;transition:all .15s;
  }
  .bucket:hover{border-color:var(--teal);}
  .bucket.active{background:var(--teal-l);border-color:var(--teal);border-style:solid;}
  .bucket-title{
    font-weight:900;font-size:17px;color:var(--teal-d);
    text-align:center;margin-bottom:12px;padding-bottom:11px;
    border-bottom:3px solid var(--line);
  }
  .bucket-contents{display:flex;flex-wrap:wrap;gap:8px;}
  .b-chip{
    background:var(--green-l);color:var(--green-d);font-weight:800;
    font-size:15px;padding:8px 14px;border-radius:12px;
  }

  /* Pick */
  .pick-list{display:grid;gap:12px;}
  .pick-item{
    background:#fff;border:4px solid var(--line);border-radius:18px;
    padding:16px 18px;font-weight:700;font-size:17px;line-height:1.6;
    cursor:pointer;transition:all .13s;display:flex;align-items:center;gap:14px;
    box-shadow:0 5px 0 var(--line);
  }
  .pick-item:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line);}
  .pick-box{
    width:32px;height:32px;border-radius:10px;border:4px solid var(--line);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:900;
  }
  .pick-item.picked{border-color:var(--indigo);background:var(--indigo-l);}
  .pick-item.picked .pick-box{border-color:var(--indigo);background:var(--indigo);color:#fff;}
  .pick-item.correct{border-color:var(--green);background:var(--green-l);}
  .pick-item.correct .pick-box{border-color:var(--green);background:var(--green);color:#fff;}
  .pick-item.wrong{border-color:var(--coral);background:var(--coral-l);}
  .pick-item.wrong .pick-box{border-color:var(--coral);background:var(--coral);color:#fff;}
  .pick-icon{font-size:28px;flex-shrink:0;}

  /* Result */
  .result-box{
    background:#fff;border-radius:28px;padding:36px 24px;text-align:center;
    border:4px solid var(--line);
  }
  .result-emoji{font-size:76px;line-height:1;margin-bottom:10px;animation:pop .5s;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
  .stars{font-size:56px;letter-spacing:8px;margin:18px 0;}
  .result-msg{font-size:19px;font-weight:700;color:var(--muted);line-height:1.8;}

  /* Footer */
  .footer{
    padding:40px 16px 50px;text-align:center;position:relative;z-index:1;
  }
  .footer-badge{
    display:inline-flex;flex-direction:column;align-items:center;gap:8px;
    padding:34px 66px;border-radius:42px;position:relative;
    background:linear-gradient(135deg,#0f766e 0%,#14b8a6 25%,#6366f1 55%,#fb7185 80%,#fbbf24 100%);
    background-size:280% 280%;
    animation:gradientShift 8s ease infinite, badgePulse 3s ease-in-out infinite;
    box-shadow:
      0 0 0 7px rgba(255,255,255,.95),
      0 0 0 14px rgba(20,184,166,.35),
      0 24px 70px rgba(99,102,241,.45),
      0 12px 36px rgba(251,113,133,.35);
    transform:rotate(-1deg);
  }
  @keyframes gradientShift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  @keyframes badgePulse{
    0%,100%{transform:rotate(-1deg) scale(1);}
    50%{transform:rotate(1deg) scale(1.035);}
  }
  .badge-stars{
    font-size:26px;letter-spacing:10px;
    animation:twinkle 1.8s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.7;transform:scale(.95);}to{opacity:1;transform:scale(1.1);}}
  .badge-years{
    font-size:30px;font-weight:900;letter-spacing:5px;
    color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3);
  }
  .badge-name{
    font-size:48px;font-weight:900;letter-spacing:2px;
    color:#fff;line-height:1.05;
    text-shadow:0 4px 16px rgba(0,0,0,.4), 0 0 24px rgba(255,255,255,.3);
  }
  .badge-sub{
    font-size:17px;font-weight:800;letter-spacing:5px;
    color:rgba(255,255,255,.95);text-transform:uppercase;margin-top:4px;
  }
  .badge-emoji{
    position:absolute;font-size:36px;animation:floatAround 5s ease-in-out infinite;
  }
  .badge-emoji.e1{top:-22px;left:-18px;animation-delay:.2s;}
  .badge-emoji.e2{top:-22px;right:-18px;animation-delay:.8s;}
  .badge-emoji.e3{bottom:-20px;left:15%;animation-delay:1.4s;}
  .badge-emoji.e4{bottom:-20px;right:15%;animation-delay:.5s;}

  /* Confetti */
  .confetti{
    position:fixed;top:-20px;width:13px;height:13px;border-radius:3px;
    animation:fall linear forwards;z-index:9998;pointer-events:none;
  }
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.15;}}

  @media (max-width:640px){
    h1{font-size:24px;}
    h2{font-size:20px;}
    body{font-size:16px;}
    .hero-svg{width:130px;height:130px;}
    .hero-bubble{font-size:16px;padding:12px 18px;}
    .match-wrap{grid-template-columns:1fr;}
    .sym-match-wrap{grid-template-columns:1fr;}
    .buckets{grid-template-columns:1fr;}
    .footer-badge{padding:24px 32px;}
    .badge-name{font-size:30px;}
    .badge-years{font-size:20px;}
    .lesson-title{font-size:17px;}
    .act-name{font-size:15px;}
    .q-text{font-size:18px;}
    .opt{font-size:16px;padding:14px 16px;}
  }
</style>
</head>
<body>

<div class="floaters" id="floaters"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-chip">ICT</span>
    <span class="brand-text">6 ශ්‍රේණිය • තොරතුරු හා සන්නිවේදන තාක්ෂණය</span>
  </div>
  <button id="musicBtn" class="music-btn">🔇 සංගීතය</button>
</header>

<main id="app"></main>

<footer class="footer">
  <div class="footer-badge">
    <div class="badge-emoji e1">💻</div>
    <div class="badge-emoji e2">🖱️</div>
    <div class="badge-emoji e3">⭐</div>
    <div class="badge-emoji e4">🎓</div>
    <div class="badge-stars">⭐ ✦ ⭐</div>

    }catch(e){return;}
  }
  if(actx.state==='suspended')actx.resume();
}

function playMelody(){
  if(!musicOn||!actx)return;
  const m=MELODIES[currentMelody]||MELODIES.home;
  const beat=m.tempo;let t=actx.currentTime+.05;

  m.notes.forEach(([f,d])=>{
    if(f>0){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=m.wave;o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(1,t+.025);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d*beat*.9);
      o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d*beat);
    }
    t+=d*beat;
  });

  const totalMelodyTime=m.notes.reduce((a,n)=>a+n[1],0)*beat;
  const bassNotes=m.bass||[];
  bassNotes.forEach((bf,i)=>{
    const bt=actx.currentTime+.05+(totalMelodyTime/bassNotes.length)*i;
    const bo=actx.createOscillator(),bg=actx.createGain();
    bo.type='sine';bo.frequency.value=bf;
    bg.gain.setValueAtTime(0.0001,bt);
    bg.gain.exponentialRampToValueAtTime(.55,bt+.04);
    bg.gain.exponentialRampToValueAtTime(0.0001,bt+beat*2);
    bo.connect(bg);bg.connect(musicGain);bo.start(bt);bo.stop(bt+beat*2+.05);
  });

  musicTimer=setTimeout(playMelody,totalMelodyTime*1000+400);
}

function switchMusic(key){
  currentMelody=key;
  if(!musicOn)return;
  clearTimeout(musicTimer);
  playMelody();
}

function toggleMusic(){
  ensureAudio();musicOn=!musicOn;

  }
}
document.getElementById('musicBtn').onclick=toggleMusic;

function blip(f,d=.1,type='sine',v=.13,delay=0){
  if(!actx)return;const t=actx.currentTime+delay;

}

const FLOAT_EMOJIS=['💻','🖱️','⌨️','📀','🖥️','📱','⭐','🎮','📁','🔍','🌐','💾','🖨️','📸','🎵','✏️'];
function buildFloaters(){
  const c=document.getElementById('floaters');
  const positions=[
    {top:'8%',left:'3%'},{top:'16%',right:'5%'},{top:'32%',left:'2%'},
    {top:'48%',right:'3%'},{top:'62%',left:'4%'},{top:'78%',right:'4%'},
    {top:'88%',left:'8%'},{top:'12%',right:'12%'},{top:'55%',left:'8%'},
    {top:'72%',right:'10%'}
  ];
  positions.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='floater';
    d.textContent=FLOAT_EMOJIS[i%FLOAT_EMOJIS.length];
    Object.assign(d.style,p);
    d.style.animationDelay=(i*.7)+'s';
    d.style.animationDuration=(11+Math.random()*8)+'s';
    c.appendChild(d);
  });
}

const state={currentLesson:null,currentActivity:null,completed:{}};
function render(html){document.getElementById('app').innerHTML=html;}
function goHome(){sfx.click();state.currentLesson=null;state.currentActivity=null;switchMusic('home');renderHome();}
function goLesson(id){sfx.click();state.currentLesson=LESSONS.find(l=>l.id===id);renderLesson();}
function goActivity(lid,aid){
  sfx.click();
  state.currentLesson=LESSONS.find(l=>l.id===lid);
  state.currentActivity=state.currentLesson.activities.find(a=>a.id===aid);
  switchMusic(state.currentActivity.type);
  renderActivity();
}

function renderLesson(){
  const l=state.currentLesson;if(!l)return goHome();
  let items='';
  l.activities.forEach((a,i)=>{
    const done=state.completed[l.id+'-'+a.id];
    items+=`
      <div class="act-item ${done?'done':''}" onclick="goActivity(${l.id},'${a.id}')">
        <div class="act-num">${done?'✓':i+1}</div>
        <div class="act-name">${a.name}</div>
        <div class="act-type">${typeLabel(a.type)}</div>
      </div>`;
  });
  render(`
    <section class="screen active">
      <div class="act-header"><button class="btn ghost small" onclick="goHome()">← මුල් පිටුව</button></div>

/* ================================================================
   MCQ
   ================================================================ */
function renderMCQ(c,a){
  let idx=0,score=0;const total=a.questions.length;
  function draw(){
    if(idx>=total)return finish();
    const q=a.questions[idx];
    c.innerHTML=`
      <div class="act-instruction">${a.instruction}</div>
      <div style="font-size:15px;color:var(--muted);font-weight:900;margin-bottom:8px;">
        ප්‍රශ්නය ${idx+1} / ${total}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts"></div>
      <div class="feedback" id="fb"></div>`;
    const o=document.getElementById('opts');
    q.opts.forEach((t,i)=>{
      const b=document.createElement('button');
      b.className='opt';b.textContent=t;
      b.onclick=()=>pick(i,b);o.appendChild(b);
    });
    document.getElementById('scorePill').textContent=`ලකුණු: ${score} / ${total}`;
  }
  function pick(i,btn){
    const q=a.questions[idx];const all=document.querySelectorAll('.opt');
    all.forEach(x=>x.disabled=true);
    if(i===q.ans){btn.classList.add('correct');score++;sfx.correct();
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ නිවැරදියි! 🎉</span>';}
    else{btn.classList.add('wrong');all[q.ans].classList.add('correct');sfx.wrong();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ වැරදියි. කොළ පැහැය නිවැරදි පිළිතුරයි.</span>';}
    document.getElementById('scorePill').textContent=`ලකුණු: ${score} / ${total}`;
    setTimeout(()=>{idx++;draw();},1600);
  }
  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;sfx.win();
    const stars=score===total?3:score>=total*.6?2:1;
    c.innerHTML=`
      <div class="result-box">
        <div class="result-emoji">${stars===3?'🏆':stars===2?'👏':'💪'}</div>
        <h2 style="color:var(--teal-d);">සම්පූර්ණයි!</h2>
        <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
        <p class="result-msg">ඔබ ලකුණු <b>${score} / ${total}</b></p>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.currentLesson.id})">← පාඩමට</button>
          <button class="btn ghost" onclick="goHome()">🏠 මුල් පිටුව</button>
        </div>
      </div>`;
  }
  draw();
}

/* ================================================================
   MATCH
   ================================================================ */
function renderMatch(c,a){
  const pairs=a.pairs;
  const left=pairs.map((p,i)=>({text:p.l,key:i,icon:p.li}));
  const right=shuffle(pairs.map((p,i)=>({text:p.r,key:i,icon:p.ri})));
  let sel=null,matched=0,wrongAttempts=0;const total=pairs.length;
  function updatePill(){document.getElementById('scorePill').textContent=`ගැලපීම්: ${matched} / ${total}`;}
  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div class="match-wrap"><div class="match-col" id="lc"></div><div class="match-col" id="rc"></div></div>
    <div class="feedback" id="fb"></div>`;
  const lc=document.getElementById('lc'),rc=document.getElementById('rc');
  left.forEach(it=>{
    const d=document.createElement('div');d.className='match-item';
    d.innerHTML=`<span class="match-icon">${it.icon||''}</span><span>${it.text}</span>`;
    d.dataset.key=it.key;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#lc .match-item').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');sel={el:d,it};};
    lc.appendChild(d);
  });
  right.forEach(it=>{
    const d=document.createElement('div');d.className='match-item';
    d.innerHTML=`<span class="match-icon">${it.icon||''}</span><span>${it.text}</span>`;
    d.dataset.key=it.key;
    d.onclick=()=>{
      if(d.classList.contains('matched'))return;
      if(!sel){document.getElementById('fb').textContent='මුලින්ම වම් පසින් එකක් තෝරන්න.';return;}
      if(sel.it.key===it.key){
        sel.el.classList.remove('selected');sel.el.classList.add('matched');d.classList.add('matched');
        matched++;sfx.correct();updatePill();
        document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ නිවැරදි ගැලපීම! 👏</span>';
        sel=null;if(matched===total)finish();
      }else{
        d.classList.add('shake');const sl=sel.el;sl.classList.add('shake');
        setTimeout(()=>{d.classList.remove('shake');sl.classList.remove('shake');},450);
        sfx.wrong();wrongAttempts++;
        document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ ගැලපෙන්නේ නැත. නැවත උත්සාහ කරන්න.</span>';
        sl.classList.remove('selected');sel=null;
      }
    };
    rc.appendChild(d);
  });
  updatePill();
  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();
      const stars=wrongAttempts===0?3:wrongAttempts<=2?2:1;
      c.innerHTML=`
        <div class="result-box">
          <div class="result-emoji">${stars===3?'🌟':stars===2?'👏':'💪'}</div>
          <h2 style="color:var(--teal-d);">සියල්ල ගැලපුවා!</h2>
          <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
          <p class="result-msg">වැරදි උත්සාහ: <b>${wrongAttempts}</b></p>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.currentLesson.id})">← පාඩමට</button>
            <button class="btn ghost" onclick="goHome()">🏠 මුල් පිටුව</button>
          </div>
        </div>`;
    },900);
  }
}

/* ================================================================
   SYMBOL MATCH
   ================================================================ */
function renderSymMatch(c,a){
  const triples=a.triples;
  const symbolOrder=shuffle(triples.map((t,i)=>({...t,key:i})));
  const nameOrder=shuffle(triples.map((t,i)=>({...t,key:i})));
  const meaningOrder=shuffle(triples.map((t,i)=>({...t,key:i})));

  let selSym=null,selName=null,selMean=null;
  let matchedCount=0;
  const total=triples.length;

  function updatePill(){
    document.getElementById('scorePill').textContent=`ගැලපීම්: ${matchedCount} / ${total}`;
  }

  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-weight:900;font-size:14px;color:var(--muted);text-align:center;margin-bottom:10px;">
      <div>සංකේතය</div><div>නම</div><div>අර්ථය</div>
    </div>
    <div class="sym-match-wrap">
      <div id="symCol" style="display:grid;gap:12px;"></div>
      <div id="nameCol" style="display:grid;gap:12px;"></div>
      <div id="meanCol" style="display:grid;gap:12px;"></div>
    </div>
    <div class="feedback" id="fb"></div>
  `;

  const symCol=document.getElementById('symCol');
  const nameCol=document.getElementById('nameCol');
  const meanCol=document.getElementById('meanCol');

  symbolOrder.forEach(t=>{
    const d=document.createElement('div');d.className='sym-card';d.dataset.key=t.key;
    d.innerHTML=`<div style="display:flex;justify-content:center;">${SYMBOLS[t.symbol]}</div>`;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#symCol .sym-card').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selSym={el:d,key:t.key};checkTriple();};
    symCol.appendChild(d);
  });

  nameOrder.forEach(t=>{
    const d=document.createElement('div');d.className='sym-card';d.dataset.key=t.key;
    d.innerHTML=`<span style="font-size:15px;">${t.name}</span>`;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#nameCol .sym-card').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selName={el:d,key:t.key};checkTriple();};
    nameCol.appendChild(d);
  });

  meaningOrder.forEach(t=>{
    const d=document.createElement('div');d.className='sym-card';d.dataset.key=t.key;
    d.innerHTML=`<span style="font-size:15px;">${t.meaning}</span>`;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#meanCol .sym-card').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selMean={el:d,key:t.key};checkTriple();};
    meanCol.appendChild(d);
  });

  updatePill();

  function checkTriple(){
    if(selSym&&selName&&selMean){
      const k1=selSym.key,k2=selName.key,k3=selMean.key;
      if(k1===k2 && k2===k3){
        [selSym.el,selName.el,selMean.el].forEach(el=>{
          el.classList.remove('selected');el.classList.add('matched');
        });
        matchedCount++;sfx.correct();
        document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ නිවැරදි ත්‍රිත්වය! 🎉</span>';
        selSym=selName=selMean=null;
        updatePill();
        if(matchedCount===total)finish();
      }else{
        [selSym.el,selName.el,selMean.el].forEach(el=>{
          el.classList.add('shake');
          setTimeout(()=>el.classList.remove('shake'),450);
        });
        sfx.wrong();
        document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ නිවැරදි ත්‍රිත්වය නොවේ. නැවත උත්සාහ කරන්න.</span>';
        setTimeout(()=>{
          [selSym.el,selName.el,selMean.el].forEach(el=>el.classList.remove('selected'));
          selSym=selName=selMean=null;
        },500);
      }
    }
  }

  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();
      c.innerHTML=`
        <div class="result-box">
          <div class="result-emoji">🏆</div>
          <h2 style="color:var(--teal-d);">සියලු ගැලීම් සටහන් සංකේත ගැලපුවා!</h2>
          <div class="stars">⭐⭐⭐</div>
          <p class="result-msg">නියමයි! ඔබ ගැලීම් සටහන් සංකේත හොඳින් දන්නවා.</p>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.currentLesson.id})">← පාඩමට</button>
            <button class="btn ghost" onclick="goHome()">🏠 මුල් පිටුව</button>
          </div>
        </div>`;
    },900);
  }
}

/* ================================================================
   ORDER
   ================================================================ */
function renderOrder(c,a){
  const correct=a.correctOrder.map(x=>typeof x==='string'?x:x.text);
  let current=shuffle(a.correctOrder.map((x,i)=>({text:typeof x==='string'?x:x.text,icon:typeof x==='string'?null:x.icon,orig:i})));

  function draw(){
    c.innerHTML=`
      <div class="act-instruction">${a.instruction}</div>
      <div class="order-list" id="ol"></div>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn indigo" id="ck">✔ පරීක්ෂා කරන්න</button>
      </div>
      <div class="feedback" id="fb"></div>`;
    const list=document.getElementById('ol');
    current.forEach((it,i)=>{
      const d=document.createElement('div');d.className='order-item';
      d.innerHTML=`
        <div class="num">${i+1}</div>
        <div class="txt">${it.icon?`<span style="font-size:24px;">${it.icon}</span>`:''}<span>${it.text}</span></div>
        <div class="movers">
          <button class="mover" ${i===0?'disabled':''} data-dir="up">▲</button>
          <button class="mover" ${i===current.length-1?'disabled':''} data-dir="down">▼</button>
        </div>`;
      list.appendChild(d);
      d.querySelector('[data-dir="up"]').onclick=()=>swap(i,i-1);
      d.querySelector('[data-dir="down"]').onclick=()=>swap(i,i+1);
    });
    document.getElementById('ck').onclick=check;
  }
  function swap(i,j){
    if(j<0||j>=current.length)return;sfx.click();
    [current[i],current[j]]=[current[j],current[i]];draw();
  }
  function check(){
    let allCorrect=true;
    document.querySelectorAll('.order-item').forEach((el,i)=>{
      if(current[i].text===correct[i])el.classList.add('correct');
      else allCorrect=false;
    });
    if(allCorrect){
      sfx.correct();
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ නිවැරදි අනුපිළිවෙල! 🎉</span>';
      state.completed[state.currentLesson.id+'-'+a.id]=true;
      setTimeout(()=>{
        sfx.win();
        c.innerHTML=`
          <div class="result-box">
            <div class="result-emoji">✅</div>
            <h2 style="color:var(--teal-d);">හොඳින් කළා!</h2>
            <div class="stars">⭐⭐⭐</div>
            <div class="btn-row">
              <button class="btn" onclick="goLesson(${state.currentLesson.id})">← පාඩමට</button>
              <button class="btn ghost" onclick="goHome()">🏠 මුල් පිටුව</button>
            </div>
          </div>`;
      },1400);
    }else{
      sfx.wrong();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ සමහර පියවර වැරදියි. නැවත උත්සාහ කරන්න.</span>';
      setTimeout(()=>{document.querySelectorAll('.order-item.correct').forEach(el=>el.classList.remove('correct'));},1400);
    }
  }
  draw();
}

/* ================================================================
   BUCKET
   ================================================================ */
function renderBucket(c,a){
  const allItems=[];a.buckets.forEach((b,bi)=>b.items.forEach(t=>allItems.push({text:t,bucket:bi})));
  const pool=shuffle(allItems.slice());let selected=null,placed=0;const total=allItems.length;
  function updatePill(){document.getElementById('scorePill').textContent=`ලකුණු: ${placed} / ${total}`;}
  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div class="bucket-items" id="pool"></div>
    <div class="buckets" id="bks"></div>
    <div class="feedback" id="fb"></div>`;
  const poolEl=document.getElementById('pool');
  pool.forEach((it,i)=>{
    const d=document.createElement('div');d.className='b-item';d.textContent=it.text;
    d.onclick=()=>{
      if(d.classList.contains('placed'))return;sfx.click();
      document.querySelectorAll('.b-item').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selected={el:d,item:it};
    };
    poolEl.appendChild(d);
  });
  const bksEl=document.getElementById('bks');
  a.buckets.forEach((b,bi)=>{
    const d=document.createElement('div');d.className='bucket';d.dataset.bi=bi;
    d.innerHTML=`<div class="bucket-title">${b.name}</div><div class="bucket-contents"></div>`;
    d.onclick=()=>drop(bi,d);bksEl.appendChild(d);
  });
  updatePill();
  function drop(bi,el){
    if(!selected)return;const it=selected.item;
    if(it.bucket===bi){
      el.classList.add('active');setTimeout(()=>el.classList.remove('active'),500);
      const chip=document.createElement('div');chip.className='b-chip';chip.textContent=it.text;
      el.querySelector('.bucket-contents').appendChild(chip);
      selected.el.classList.remove('selected');selected.el.classList.add('placed');
      selected=null;placed++;sfx.correct();
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ නිවැරදි කාණ්ඩය!</span>';
      updatePill();
      if(placed===total)finish();
    }else{
      el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),450);sfx.wrong();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ වැරදි කාණ්ඩය. නැවත උත්සාහ කරන්න.</span>';
    }
  }
  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();
      c.innerHTML=`
        <div class="result-box">
          <div class="result-emoji">🗂️</div>
          <h2 style="color:var(--teal-d);">සියල්ල වර්ග කළා!</h2>
          <div class="stars">⭐⭐⭐</div>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.currentLesson.id})">← පාඩමට</button>
            <button class="btn ghost" onclick="goHome()">🏠 මුල් පිටුව</button>
          </div>
        </div>`;
    },900);
  }
}

/* ================================================================
   PICK
   ================================================================ */
function renderPick(c,a){
  const items=shuffle(a.items.slice());const picked=new Set();
  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div class="pick-list" id="pl"></div>
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn indigo" id="ck">✔ පරීක්ෂා කරන්න</button>
    </div>
    <div class="feedback" id="fb"></div>`;
  const list=document.getElementById('pl');
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='pick-item';
    d.innerHTML=`<div class="pick-box"></div>${it.icon?`<span class="pick-icon">${it.icon}</span>`:''}<div style="flex:1;">${it.text}</div>`;
    d.onclick=()=>{
      sfx.click();
      if(picked.has(i)){picked.delete(i);d.classList.remove('picked');d.querySelector('.pick-box').textContent='';}
      else{picked.add(i);d.classList.add('picked');d.querySelector('.pick-box').textContent='✓';}
    };
    list.appendChild(d);
  });
  document.getElementById('ck').onclick=()=>{
    let correct=true;
    document.querySelectorAll('.pick-item').forEach((el,i)=>{
      const it=items[i];const wasPicked=picked.has(i);
      if(it.correct&&wasPicked){el.classList.remove('picked');el.classList.add('correct');el.querySelector('.pick-box').textContent='✓';}
      else if(it.correct&&!wasPicked){el.classList.add('correct');el.querySelector('.pick-box').textContent='✓';correct=false;}
      else if(!it.correct&&wasPicked){el.classList.remove('picked');el.classList.add('wrong');el.querySelector('.pick-box').textContent='✘';correct=false;}
    });
    if(correct){
      sfx.correct();
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ නියමයි! සියල්ල නිවැරදි! 🎉</span>';
      state.completed[state.currentLesson.id+'-'+a.id]=true;
      setTimeout(()=>{
        sfx.win();
        c.innerHTML=`
          <div class="result-box">
            <div class="result-emoji">🌟</div>
            <h2 style="color:var(--teal-d);">නියමයි!</h2>
            <div class="stars">⭐⭐⭐</div>
            <div class="btn-row">
              <button class="btn" onclick="goLesson(${state.currentLesson.id})">← පාඩමට</button>
              <button class="btn ghost" onclick="goHome()">🏠 මුල් පිටුව</button>
            </div>
          </div>`;
      },1500);
    }else{
      sfx.wrong();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ සමහරක් වැරදියි. රතු/කොළ වර්ණ බලන්න.</span>';
    }
  };
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
