<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 6 ICT Game | Ruwanpura NCoE</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef7f4;
    --ink:#1f2d3d;
    --muted:#5b6b7c;
    --line:#d9e6e2;
    --teal:#14b8a6;--teal-d:#0f766e;--teal-l:#ccfbf1;
    --amber:#fbbf24;--amber-d:#d97706;--amber-l:#fef3c7;
    --coral:#fb7185;--coral-d:#e11d48;--coral-l:#ffe4e6;
    --indigo:#818cf8;--indigo-d:#4338ca;--indigo-l:#e0e7ff;
    --green:#22c55e;--green-d:#15803d;--green-l:#dcfce7;
    --pink:#f472b6;--pink-d:#be185d;--pink-l:#fce7f3;
    --blue:#60a5fa;--blue-d:#1d4ed8;--blue-l:#dbeafe;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Nunito','Fredoka',system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  }

  /* Floating decorations */
  .floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .floater{
    position:absolute;font-size:30px;opacity:.3;
    animation:floatAround 14s ease-in-out infinite;
  }
  @keyframes floatAround{
    0%,100%{transform:translate(0,0) rotate(-8deg) scale(1);}
    25%{transform:translate(20px,-30px) rotate(6deg) scale(1.08);}
    50%{transform:translate(-15px,-15px) rotate(-4deg) scale(.96);}
    75%{transform:translate(15px,20px) rotate(10deg) scale(1.05);}
  }

  /* Header */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 16px;background:#fff;border-bottom:4px solid var(--teal);
    flex-wrap:wrap;position:sticky;top:0;z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-chip{
    background:linear-gradient(135deg,var(--teal),var(--indigo-d));
    color:#fff;font-weight:900;font-size:14px;padding:7px 14px;border-radius:12px;
    letter-spacing:.5px;box-shadow:0 3px 8px rgba(20,184,166,.35);
  }
  .brand-text{font-weight:800;font-size:14.5px;color:var(--teal-d);}
  .music-btn{
    border:none;background:var(--amber);color:#5a3b00;font-family:inherit;
    font-weight:800;font-size:13.5px;padding:10px 18px;border-radius:999px;
    cursor:pointer;box-shadow:0 3px 0 var(--amber-d);transition:all .15s;
  }
  .music-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--amber-d);}
  .music-btn.on{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d);}

  main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:16px;position:relative;z-index:1;}
  .screen{display:none;animation:fade .35s;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  h1{font-size:23px;margin:0 0 6px;text-align:center;color:var(--teal-d);line-height:1.4;font-family:'Fredoka',sans-serif;}
  h2{font-size:19px;margin:0 0 14px;text-align:center;color:var(--indigo-d);}
  .sub{text-align:center;color:var(--muted);font-size:14.5px;margin:0 0 18px;line-height:1.6;}

  /* Buttons */
  .btn{
    border:none;font-family:inherit;font-weight:800;font-size:15px;
    padding:13px 24px;border-radius:15px;cursor:pointer;color:#fff;
    background:var(--teal);box-shadow:0 5px 0 var(--teal-d);
    transition:all .12s;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--teal-d);}
  .btn.amber{background:var(--amber);color:#5a3b00;box-shadow:0 5px 0 var(--amber-d);}
  .btn.amber:active{box-shadow:0 2px 0 var(--amber-d);}
  .btn.indigo{background:var(--indigo);box-shadow:0 5px 0 var(--indigo-d);}
  .btn.indigo:active{box-shadow:0 2px 0 var(--indigo-d);}
  .btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-d);}
  .btn.coral:active{box-shadow:0 2px 0 var(--coral-d);}
  .btn.ghost{background:#fff;color:var(--teal-d);box-shadow:0 5px 0 var(--line);}
  .btn.ghost:active{box-shadow:0 2px 0 var(--line);}
  .btn.small{padding:9px 16px;font-size:13px;border-radius:11px;}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}

  /* Home */
  .hero{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:10px;}
  .hero-svg{width:150px;height:150px;animation:bob 2.8s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(20,184,166,.3));}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-12px) rotate(2deg);}}
  .hero-bubble{
    background:#fff;border:3px dashed var(--teal);border-radius:18px;
    padding:10px 20px;font-weight:700;font-size:14.5px;color:var(--teal-d);
    text-align:center;max-width:560px;line-height:1.6;
  }

  /* Lesson grid */
  .lesson-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:14px;margin-top:18px;
  }
  .lesson-card{
    background:#fff;border-radius:22px;padding:20px 14px 16px;cursor:pointer;
    border:3px solid var(--line);box-shadow:0 6px 0 var(--line);
    transition:transform .14s, box-shadow .14s, border-color .2s;
    display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
    position:relative;overflow:hidden;
  }
  .lesson-card::before{
    content:'';position:absolute;top:-30px;right:-30px;width:90px;height:90px;
    border-radius:50%;opacity:.35;
  }
  .lesson-card.l1::before{background:var(--teal-l);}
  .lesson-card.l2::before{background:var(--coral-l);}
  .lesson-card.l3::before{background:var(--amber-l);}
  .lesson-card.l4::before{background:var(--indigo-l);}
  .lesson-card.l5::before{background:var(--green-l);}
  .lesson-card.l6::before{background:var(--pink-l);}
  .lesson-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line);}
  .lesson-card:hover{border-color:var(--teal);}
  .lesson-icon{
    width:72px;height:72px;border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    font-size:38px;background:var(--teal-l);position:relative;z-index:1;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.06);
  }
  .lesson-card.l1 .lesson-icon{background:var(--teal-l);}
  .lesson-card.l2 .lesson-icon{background:var(--coral-l);}
  .lesson-card.l3 .lesson-icon{background:var(--amber-l);}
  .lesson-card.l4 .lesson-icon{background:var(--indigo-l);}
  .lesson-card.l5 .lesson-icon{background:var(--green-l);}
  .lesson-card.l6 .lesson-icon{background:var(--pink-l);}
  .lesson-num{
    position:absolute;top:12px;left:14px;font-size:11.5px;font-weight:900;
    color:var(--teal-d);background:var(--teal-l);padding:4px 12px;border-radius:999px;
    z-index:1;
  }
  .lesson-title{font-weight:800;font-size:15px;line-height:1.5;position:relative;z-index:1;}
  .lesson-progress{
    font-size:12px;font-weight:800;color:var(--muted);
    background:var(--bg);padding:4px 12px;border-radius:999px;position:relative;z-index:1;
  }

  /* Activity list */
  .act-list{display:grid;gap:12px;max-width:660px;margin:0 auto;}
  .act-item{
    background:#fff;border:3px solid var(--line);border-radius:18px;
    padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;
    box-shadow:0 5px 0 var(--line);transition:all .14s;
  }
  .act-item:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line);}
  .act-item.done{border-color:var(--green);background:#f0fdf4;}
  .act-item.done .act-num{background:var(--green);color:#fff;}
  .act-num{
    width:42px;height:42px;border-radius:13px;background:var(--amber-l);
    color:var(--amber-d);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:17px;flex-shrink:0;
  }
  .act-name{flex:1;font-weight:800;font-size:14.5px;line-height:1.5;}
  .act-type{
    font-size:11.5px;color:var(--muted);font-weight:800;
    background:var(--bg);padding:4px 11px;border-radius:999px;flex-shrink:0;
  }

  /* Activity view */
  .act-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .score-pill{
    background:#fff;border:2px solid var(--line);border-radius:999px;
    padding:7px 18px;font-weight:900;font-size:14px;color:var(--teal-d);
    margin-left:auto;
  }
  .act-body{background:#fff;border-radius:22px;padding:20px;border:3px solid var(--line);}
  .act-instruction{
    background:var(--teal-l);color:var(--teal-d);border-radius:16px;
    padding:13px 18px;font-weight:800;font-size:14.5px;line-height:1.7;
    margin-bottom:18px;display:flex;gap:10px;align-items:flex-start;
  }
  .act-instruction::before{content:'💡';font-size:20px;flex-shrink:0;}

  /* MCQ */
  .q-text{font-size:16.5px;font-weight:800;line-height:1.65;margin:6px 0 16px;}
  .options{display:grid;gap:11px;}
  .opt{
    border:3px solid var(--line);background:#fff;border-radius:15px;
    padding:14px 16px;font-family:inherit;font-size:14.5px;font-weight:700;
    cursor:pointer;color:var(--ink);text-align:left;transition:all .13s;
    box-shadow:0 4px 0 var(--line);
  }
  .opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .opt.correct{background:var(--green-l);border-color:var(--green);color:var(--green-d);}
  .opt.wrong{background:var(--coral-l);border-color:var(--coral);color:var(--coral-d);}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:14px;font-weight:800;font-size:15px;min-height:24px;text-align:center;}

  /* Match */
  .match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .match-col{display:grid;gap:10px;align-content:start;}
  .match-item{
    background:#fff;border:3px solid var(--line);border-radius:15px;
    padding:13px 14px;font-weight:700;font-size:14px;line-height:1.5;
    cursor:pointer;transition:all .13s;text-align:center;
    box-shadow:0 4px 0 var(--line);
    display:flex;align-items:center;justify-content:center;gap:8px;
    min-height:60px;
  }
  .match-item:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .match-item.selected{border-color:var(--indigo);background:var(--indigo-l);color:var(--indigo-d);}
  .match-item.matched{
    border-color:var(--green);background:var(--green-l);color:var(--green-d);
    pointer-events:none;opacity:.9;
  }
  .match-item.shake{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }
  .match-icon{font-size:26px;flex-shrink:0;}

  /* Symbol match special */
  .sym-match-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .sym-card{
    background:#fff;border:3px solid var(--line);border-radius:15px;
    padding:12px 8px;font-weight:700;font-size:13px;line-height:1.4;
    cursor:pointer;transition:all .13s;text-align:center;
    box-shadow:0 4px 0 var(--line);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    min-height:120px;justify-content:center;
  }
  .sym-card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .sym-card.selected{border-color:var(--indigo);background:var(--indigo-l);color:var(--indigo-d);}
  .sym-card.matched{
    border-color:var(--green);background:var(--green-l);color:var(--green-d);
    pointer-events:none;opacity:.9;
  }
  .sym-card.shake{animation:shake .4s;}
  .sym-card svg{width:70px;height:44px;}

  /* Order */
  .order-list{display:grid;gap:10px;}
  .order-item{
    background:#fff;border:3px solid var(--line);border-radius:15px;
    padding:12px 14px;font-weight:700;font-size:14px;line-height:1.55;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 4px 0 var(--line);
  }
  .order-item .num{
    width:32px;height:32px;border-radius:10px;background:var(--amber-l);
    color:var(--amber-d);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:14px;flex-shrink:0;
  }
  .order-item .txt{flex:1;display:flex;align-items:center;gap:8px;}
  .order-item .movers{display:flex;gap:5px;flex-direction:column;}
  .mover{
    border:none;background:var(--teal-l);color:var(--teal-d);
    width:34px;height:26px;border-radius:8px;font-weight:900;
    cursor:pointer;font-size:13px;line-height:1;
  }
  .mover:disabled{opacity:.35;cursor:default;}
  .order-item.correct{border-color:var(--green);background:var(--green-l);}
  .order-item.correct .num{background:var(--green);color:#fff;}

  /* Bucket */
  .bucket-items{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px;min-height:60px;}
  .b-item{
    background:#fff;border:3px solid var(--line);border-radius:13px;
    padding:10px 15px;font-weight:800;font-size:13.5px;cursor:pointer;
    transition:all .13s;box-shadow:0 4px 0 var(--line);
    display:flex;align-items:center;gap:6px;
  }
  .b-item:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .b-item.selected{border-color:var(--indigo);background:var(--indigo-l);color:var(--indigo-d);}
  .b-item.placed{opacity:.25;pointer-events:none;}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .bucket{
    background:var(--bg);border:3px dashed var(--line);border-radius:18px;
    padding:12px;min-height:140px;cursor:pointer;transition:all .15s;
  }
  .bucket:hover{border-color:var(--teal);}
  .bucket.active{background:var(--teal-l);border-color:var(--teal);border-style:solid;}
  .bucket-title{
    font-weight:900;font-size:14px;color:var(--teal-d);
    text-align:center;margin-bottom:10px;padding-bottom:9px;
    border-bottom:2px solid var(--line);
  }
  .bucket-contents{display:flex;flex-wrap:wrap;gap:6px;}
  .b-chip{
    background:var(--green-l);color:var(--green-d);font-weight:800;
    font-size:12.5px;padding:6px 12px;border-radius:10px;
  }

  /* Pick */
  .pick-list{display:grid;gap:10px;}
  .pick-item{
    background:#fff;border:3px solid var(--line);border-radius:15px;
    padding:13px 15px;font-weight:700;font-size:14px;line-height:1.55;
    cursor:pointer;transition:all .13s;display:flex;align-items:center;gap:12px;
    box-shadow:0 4px 0 var(--line);
  }
  .pick-item:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line);}
  .pick-box{
    width:26px;height:26px;border-radius:8px;border:3px solid var(--line);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:900;
  }
  .pick-item.picked{border-color:var(--indigo);background:var(--indigo-l);}
  .pick-item.picked .pick-box{border-color:var(--indigo);background:var(--indigo);color:#fff;}
  .pick-item.correct{border-color:var(--green);background:var(--green-l);}
  .pick-item.correct .pick-box{border-color:var(--green);background:var(--green);color:#fff;}
  .pick-item.wrong{border-color:var(--coral);background:var(--coral-l);}
  .pick-item.wrong .pick-box{border-color:var(--coral);background:var(--coral);color:#fff;}
  .pick-icon{font-size:22px;flex-shrink:0;}

  /* Result */
  .result-box{
    background:#fff;border-radius:24px;padding:30px 20px;text-align:center;
    border:3px solid var(--line);
  }
  .result-emoji{font-size:64px;line-height:1;margin-bottom:8px;animation:pop .5s;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
  .stars{font-size:46px;letter-spacing:6px;margin:14px 0;}
  .result-msg{font-size:16px;font-weight:700;color:var(--muted);line-height:1.7;}

  /* Footer */
  .footer{
    padding:34px 16px 44px;text-align:center;position:relative;z-index:1;
  }
  .footer-badge{
    display:inline-flex;flex-direction:column;align-items:center;gap:6px;
    padding:28px 56px;border-radius:36px;position:relative;
    background:linear-gradient(135deg,#0f766e 0%,#14b8a6 25%,#6366f1 55%,#fb7185 80%,#fbbf24 100%);
    background-size:280% 280%;
    animation:gradientShift 8s ease infinite, badgePulse 3s ease-in-out infinite;
    box-shadow:
      0 0 0 6px rgba(255,255,255,.95),
      0 0 0 12px rgba(20,184,166,.35),
      0 22px 60px rgba(99,102,241,.45),
      0 10px 30px rgba(251,113,133,.35);
    transform:rotate(-1deg);
  }
  @keyframes gradientShift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  @keyframes badgePulse{
    0%,100%{transform:rotate(-1deg) scale(1);}
    50%{transform:rotate(1deg) scale(1.035);}
  }
  .badge-stars{
    font-size:22px;letter-spacing:8px;
    animation:twinkle 1.8s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.7;transform:scale(.95);}to{opacity:1;transform:scale(1.1);}}
  .badge-years{
    font-size:24px;font-weight:900;letter-spacing:4px;
    color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3);
    font-family:'Fredoka',sans-serif;
  }
  .badge-name{
    font-size:38px;font-weight:900;letter-spacing:1.5px;
    color:#fff;line-height:1.1;
    text-shadow:0 3px 12px rgba(0,0,0,.35), 0 0 20px rgba(255,255,255,.3);
    font-family:'Fredoka',sans-serif;
  }
  .badge-sub{
    font-size:13px;font-weight:800;letter-spacing:4px;
    color:rgba(255,255,255,.9);text-transform:uppercase;margin-top:2px;
  }
  .badge-emoji{
    position:absolute;font-size:30px;animation:floatAround 5s ease-in-out infinite;
  }
  .badge-emoji.e1{top:-18px;left:-14px;animation-delay:.2s;}
  .badge-emoji.e2{top:-18px;right:-14px;animation-delay:.8s;}
  .badge-emoji.e3{bottom:-16px;left:15%;animation-delay:1.4s;}
  .badge-emoji.e4{bottom:-16px;right:15%;animation-delay:.5s;}

  /* Confetti */
  .confetti{
    position:fixed;top:-20px;width:12px;height:12px;border-radius:3px;
    animation:fall linear forwards;z-index:9998;pointer-events:none;
  }
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.15;}}

  @media (max-width:640px){
    h1{font-size:19px;}
    .hero-svg{width:120px;height:120px;}
    .match-wrap{grid-template-columns:1fr;}
    .sym-match-wrap{grid-template-columns:1fr;}
    .buckets{grid-template-columns:1fr;}
    .footer-badge{padding:22px 30px;}
    .badge-name{font-size:26px;}
    .badge-years{font-size:18px;}
  }
</style>
</head>
<body>

<div class="floaters" id="floaters"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-chip">ICT</span>
    <span class="brand-text">Grade 6 • Information &amp; Communication Technology</span>
  </div>
  <button id="musicBtn" class="music-btn">🔇 Music</button>
</header>

<main id="app"></main>

<footer class="footer">
  <div class="footer-badge">
    <div class="badge-emoji e1">💻</div>
    <div class="badge-emoji e2">🖱️</div>
    <div class="badge-emoji e3">⭐</div>
    <div class="badge-emoji e4">🎓</div>
    <div class="badge-stars">⭐ ✦ ⭐</div>
    <div class="badge-years">2022 – 2024</div>
    <div class="badge-name">Ruwanpura NCoE</div>
    <div class="badge-sub">✦ Batch ✦</div>
  </div>
</footer>

<script>
/* ================================================================
   AUDIO ENGINE — Different melody per activity
   ================================================================ */
let actx=null,musicOn=false,musicTimer=null,musicGain=null,currentMelody='home';

const MELODIES={
  home:{
    notes:[[329.63,1],[392,1],[440,1],[392,1],[329.63,1],[293.66,2],
           [329.63,1],[392,1],[440,1],[493.88,1],[440,1],[392,2]],
    wave:'triangle',tempo:.30,bass:[164.81,220,164.81,196]
  },

function ensureAudio(){
  if(!actx){
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      musicGain=actx.createGain();musicGain.gain.value=.045;
      musicGain.connect(actx.destination);
    }catch(e){return;}
  }
  if(actx.state==='suspended')actx.resume();
}

function playMelody(){
  if(!musicOn||!actx)return;
  const m=MELODIES[currentMelody]||MELODIES.home;
  const beat=m.tempo;let t=actx.currentTime+.05;

  m.notes.forEach(([f,d])=>{
    if(f>0){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=m.wave;o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(1,t+.025);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d*beat*.9);
      o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d*beat);
    }
    t+=d*beat;
  });

  const totalMelodyTime=m.notes.reduce((a,n)=>a+n[1],0)*beat;
  const bassNotes=m.bass||[];
  bassNotes.forEach((bf,i)=>{
    const bt=actx.currentTime+.05+(totalMelodyTime/bassNotes.length)*i;
    const bo=actx.createOscillator(),bg=actx.createGain();
    bo.type='sine';bo.frequency.value=bf;
    bg.gain.setValueAtTime(0.0001,bt);
    bg.gain.exponentialRampToValueAtTime(.55,bt+.04);
    bg.gain.exponentialRampToValueAtTime(0.0001,bt+beat*2);
    bo.connect(bg);bg.connect(musicGain);bo.start(bt);bo.stop(bt+beat*2+.05);
  });

  musicTimer=setTimeout(playMelody,totalMelodyTime*1000+400);
}

function switchMusic(key){
  currentMelody=key;
  if(!musicOn)return;
  clearTimeout(musicTimer);
  playMelody();
}

function toggleMusic(){
  ensureAudio();musicOn=!musicOn;
  const b=document.getElementById('musicBtn');
  if(musicOn){
    b.textContent='🔊 Music';b.classList.add('on');playMelody();
  }else{
    b.textContent='🔇 Music';b.classList.remove('on');clearTimeout(musicTimer);
  }
}
document.getElementById('musicBtn').onclick=toggleMusic;

function blip(f,d=.1,type='sine',v=.13,delay=0){
  if(!actx)return;const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(v,t+.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.03);
}

/* ================================================================
   MCQ
   ================================================================ */
function renderMCQ(c,a){
  let idx=0,score=0;const total=a.questions.length;
  function draw(){
    if(idx>=total)return finish();
    const q=a.questions[idx];
    c.innerHTML=`
      <div class="act-instruction">${a.instruction}</div>
      <div style="font-size:12.5px;color:var(--muted);font-weight:900;margin-bottom:6px;">
        Question ${idx+1} / ${total}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts"></div>
      <div class="feedback" id="fb"></div>`;
    const o=document.getElementById('opts');
    q.opts.forEach((t,i)=>{
      const b=document.createElement('button');
      b.className='opt';b.textContent=t;
      b.onclick=()=>pick(i,b);o.appendChild(b);
    });
    document.getElementById('scorePill').textContent=`Score: ${score} / ${total}`;
  }
  function pick(i,btn){
    const q=a.questions[idx];const all=document.querySelectorAll('.opt');
    all.forEach(x=>x.disabled=true);
    if(i===q.ans){btn.classList.add('correct');score++;sfx.correct();
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct! 🎉</span>';}
    else{btn.classList.add('wrong');all[q.ans].classList.add('correct');sfx.wrong();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Wrong. Green shows the correct answer.</span>';}
    document.getElementById('scorePill').textContent=`Score: ${score} / ${total}`;
    setTimeout(()=>{idx++;draw();},1600);
  }
  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;sfx.win();
    const stars=score===total?3:score>=total*.6?2:1;
    c.innerHTML=`
      <div class="result-box">
        <div class="result-emoji">${stars===3?'🏆':stars===2?'👏':'💪'}</div>
        <h2 style="color:var(--teal-d);">Complete!</h2>
        <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
        <p class="result-msg">You scored <b>${score} / ${total}</b></p>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Lesson</button>
          <button class="btn ghost" onclick="goHome()">🏠 Home</button>
        </div>
      </div>`;
  }
  draw();
}

/* ================================================================
   MATCH (with icons)
   ================================================================ */
function renderMatch(c,a){
  const pairs=a.pairs;
  const left=pairs.map((p,i)=>({text:p.l,key:i,icon:p.li}));
  const right=shuffle(pairs.map((p,i)=>({text:p.r,key:i,icon:p.ri})));
  let sel=null,matched=0,wrongAttempts=0;const total=pairs.length;
  function updatePill(){document.getElementById('scorePill').textContent=`Matched: ${matched} / ${total}`;}
  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div class="match-wrap"><div class="match-col" id="lc"></div><div class="match-col" id="rc"></div></div>
    <div class="feedback" id="fb"></div>`;
  const lc=document.getElementById('lc'),rc=document.getElementById('rc');
  left.forEach(it=>{
    const d=document.createElement('div');d.className='match-item';
    d.innerHTML=`<span class="match-icon">${it.icon||''}</span><span>${it.text}</span>`;
    d.dataset.key=it.key;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#lc .match-item').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');sel={el:d,it};};
    lc.appendChild(d);
  });
  right.forEach(it=>{
    const d=document.createElement('div');d.className='match-item';
    d.innerHTML=`<span class="match-icon">${it.icon||''}</span><span>${it.text}</span>`;
    d.dataset.key=it.key;
    d.onclick=()=>{
      if(d.classList.contains('matched'))return;
      if(!sel){document.getElementById('fb').textContent='Select an item from the left first.';return;}
      if(sel.it.key===it.key){
        sel.el.classList.remove('selected');sel.el.classList.add('matched');d.classList.add('matched');
        matched++;sfx.correct();updatePill();
        document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct match! 👏</span>';
        sel=null;if(matched===total)finish();
      }else{
        d.classList.add('shake');const sl=sel.el;sl.classList.add('shake');
        setTimeout(()=>{d.classList.remove('shake');sl.classList.remove('shake');},450);
        sfx.wrong();wrongAttempts++;
        document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Not a match. Try again.</span>';
        sl.classList.remove('selected');sel=null;
      }
    };
    rc.appendChild(d);
  });
  updatePill();
  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();
      const stars=wrongAttempts===0?3:wrongAttempts<=2?2:1;
      c.innerHTML=`
        <div class="result-box">
          <div class="result-emoji">${stars===3?'🌟':stars===2?'👏':'💪'}</div>
          <h2 style="color:var(--teal-d);">All matched!</h2>
          <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
          <p class="result-msg">Wrong attempts: <b>${wrongAttempts}</b></p>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Lesson</button>
            <button class="btn ghost" onclick="goHome()">🏠 Home</button>
          </div>
        </div>`;
    },900);
  }
}

/* ================================================================
   SYMBOL MATCH (Special for flow charts!)
   ================================================================ */
function renderSymMatch(c,a){
  const triples=a.triples;
  // Build a shuffled symbol column, name column, and meaning column
  const symbolOrder=shuffle(triples.map((t,i)=>({...t,key:i})));
  const nameOrder=shuffle(triples.map((t,i)=>({...t,key:i})));
  const meaningOrder=shuffle(triples.map((t,i)=>({...t,key:i})));

  let selSym=null,selName=null,selMean=null;
  let matchedCount=0;
  const total=triples.length;
  const wrongAttempts=0;

  function updatePill(){
    document.getElementById('scorePill').textContent=`Matched: ${matchedCount} / ${total}`;
  }

  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-weight:900;font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px;">
      <div>SYMBOL</div><div>NAME</div><div>MEANING</div>
    </div>
    <div class="sym-match-wrap">
      <div id="symCol" style="display:grid;gap:10px;"></div>
      <div id="nameCol" style="display:grid;gap:10px;"></div>
      <div id="meanCol" style="display:grid;gap:10px;"></div>
    </div>
    <div class="feedback" id="fb"></div>
  `;

  const symCol=document.getElementById('symCol');
  const nameCol=document.getElementById('nameCol');
  const meanCol=document.getElementById('meanCol');

  symbolOrder.forEach(t=>{
    const d=document.createElement('div');d.className='sym-card';d.dataset.key=t.key;
    d.innerHTML=`<div style="display:flex;justify-content:center;">${SYMBOLS[t.symbol]}</div>`;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#symCol .sym-card').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selSym={el:d,key:t.key};checkTriple();};
    symCol.appendChild(d);
  });

  nameOrder.forEach(t=>{
    const d=document.createElement('div');d.className='sym-card';d.dataset.key=t.key;
    d.innerHTML=`<span style="font-size:13px;">${t.name}</span>`;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#nameCol .sym-card').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selName={el:d,key:t.key};checkTriple();};
    nameCol.appendChild(d);
  });

  meaningOrder.forEach(t=>{
    const d=document.createElement('div');d.className='sym-card';d.dataset.key=t.key;
    d.innerHTML=`<span style="font-size:13px;">${t.meaning}</span>`;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#meanCol .sym-card').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selMean={el:d,key:t.key};checkTriple();};
    meanCol.appendChild(d);
  });

  updatePill();

  function checkTriple(){
    if(selSym&&selName&&selMean){
      const k1=selSym.key,k2=selName.key,k3=selMean.key;
      if(k1===k2 && k2===k3){
        // Correct triple!
        [selSym.el,selName.el,selMean.el].forEach(el=>{
          el.classList.remove('selected');el.classList.add('matched');
        });
        matchedCount++;sfx.correct();
        document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct triple! 🎉</span>';
        selSym=selName=selMean=null;
        updatePill();
        if(matchedCount===total)finish();
      }else{
        // Wrong
        [selSym.el,selName.el,selMean.el].forEach(el=>{
          el.classList.add('shake');
          setTimeout(()=>el.classList.remove('shake'),450);
        });
        sfx.wrong();
        document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Not a correct triple. Try again.</span>';
        setTimeout(()=>{
          [selSym.el,selName.el,selMean.el].forEach(el=>el.classList.remove('selected'));
          selSym=selName=selMean=null;
        },500);
      }
    }
  }

  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();
      c.innerHTML=`
        <div class="result-box">
          <div class="result-emoji">🏆</div>
          <h2 style="color:var(--teal-d);">All Flow Chart Symbols Matched!</h2>
          <div class="stars">⭐⭐⭐</div>
          <p class="result-msg">Great work! You know your flow chart symbols well.</p>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Lesson</button>
            <button class="btn ghost" onclick="goHome()">🏠 Home</button>
          </div>
        </div>`;
    },900);
  }
}

/* ================================================================
   ORDER
   ================================================================ */
function renderOrder(c,a){
  const correct=a.correctOrder.map(x=>typeof x==='string'?x:x.text);
  const icons=a.correctOrder.map(x=>typeof x==='string'?null:x.icon);
  let current=shuffle(a.correctOrder.map((x,i)=>({text:typeof x==='string'?x:x.text,icon:typeof x==='string'?null:x.icon,orig:i})));

  function draw(){
    c.innerHTML=`
      <div class="act-instruction">${a.instruction}</div>
      <div class="order-list" id="ol"></div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn indigo" id="ck">✔ Check</button>
      </div>
      <div class="feedback" id="fb"></div>`;
    const list=document.getElementById('ol');
    current.forEach((it,i)=>{
      const d=document.createElement('div');d.className='order-item';
      d.innerHTML=`
        <div class="num">${i+1}</div>
        <div class="txt">${it.icon?`<span style="font-size:20px;">${it.icon}</span>`:''}<span>${it.text}</span></div>
        <div class="movers">
          <button class="mover" ${i===0?'disabled':''} data-dir="up">▲</button>
          <button class="mover" ${i===current.length-1?'disabled':''} data-dir="down">▼</button>
        </div>`;
      list.appendChild(d);
      d.querySelector('[data-dir="up"]').onclick=()=>swap(i,i-1);
      d.querySelector('[data-dir="down"]').onclick=()=>swap(i,i+1);
    });
    document.getElementById('ck').onclick=check;
  }
  function swap(i,j){
    if(j<0||j>=current.length)return;sfx.click();
    [current[i],current[j]]=[current[j],current[i]];draw();
  }
  function check(){
    let allCorrect=true;
    document.querySelectorAll('.order-item').forEach((el,i)=>{
      if(current[i].text===correct[i])el.classList.add('correct');
      else allCorrect=false;
    });
    if(allCorrect){
      sfx.correct();
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct order! 🎉</span>';
      state.completed[state.currentLesson.id+'-'+a.id]=true;
      setTimeout(()=>{
        sfx.win();
        c.innerHTML=`
          <div class="result-box">
            <div class="result-emoji">✅</div>
            <h2 style="color:var(--teal-d);">Well done!</h2>
            <div class="stars">⭐⭐⭐</div>
            <div class="btn-row">
              <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Lesson</button>
              <button class="btn ghost" onclick="goHome()">🏠 Home</button>
            </div>
          </div>`;
      },1400);
    }else{
      sfx.wrong();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Some steps are wrong. Try again.</span>';
      setTimeout(()=>{document.querySelectorAll('.order-item.correct').forEach(el=>el.classList.remove('correct'));},1400);
    }
  }
  draw();
}

/* ================================================================
   BUCKET
   ================================================================ */
function renderBucket(c,a){
  const allItems=[];a.buckets.forEach((b,bi)=>b.items.forEach(t=>allItems.push({text:t,bucket:bi})));
  const pool=shuffle(allItems.slice());let selected=null,placed=0;const total=allItems.length;
  function updatePill(){document.getElementById('scorePill').textContent=`Score: ${placed} / ${total}`;}
  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div class="bucket-items" id="pool"></div>
    <div class="buckets" id="bks"></div>
    <div class="feedback" id="fb"></div>`;
  const poolEl=document.getElementById('pool');
  pool.forEach((it,i)=>{
    const d=document.createElement('div');d.className='b-item';d.textContent=it.text;
    d.onclick=()=>{
      if(d.classList.contains('placed'))return;sfx.click();
      document.querySelectorAll('.b-item').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selected={el:d,item:it};
    };
    poolEl.appendChild(d);
  });
  const bksEl=document.getElementById('bks');
  a.buckets.forEach((b,bi)=>{
    const d=document.createElement('div');d.className='bucket';d.dataset.bi=bi;
    d.innerHTML=`<div class="bucket-title">${b.name}</div><div class="bucket-contents"></div>`;
    d.onclick=()=>drop(bi,d);bksEl.appendChild(d);
  });
  updatePill();
  function drop(bi,el){
    if(!selected)return;const it=selected.item;
    if(it.bucket===bi){
      el.classList.add('active');setTimeout(()=>el.classList.remove('active'),500);
      const chip=document.createElement('div');chip.className='b-chip';chip.textContent=it.text;
      el.querySelector('.bucket-contents').appendChild(chip);
      selected.el.classList.remove('selected');selected.el.classList.add('placed');
      selected=null;placed++;sfx.correct();
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct bucket!</span>';
      updatePill();
      if(placed===total)finish();
    }else{
      el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),450);sfx.wrong();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Wrong bucket. Try again.</span>';
    }
  }
  function finish(){
    state.completed[state.currentLesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();
      c.innerHTML=`
        <div class="result-box">
          <div class="result-emoji">🗂️</div>
          <h2 style="color:var(--teal-d);">All sorted!</h2>
          <div class="stars">⭐⭐⭐</div>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Lesson</button>
            <button class="btn ghost" onclick="goHome()">🏠 Home</button>
          </div>
        </div>`;
    },900);
  }
}

/* ================================================================
   PICK
   ================================================================ */
function renderPick(c,a){
  const items=shuffle(a.items.slice());const picked=new Set();
  c.innerHTML=`
    <div class="act-instruction">${a.instruction}</div>
    <div class="pick-list" id="pl"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn indigo" id="ck">✔ Check</button>
    </div>
    <div class="feedback" id="fb"></div>`;
  const list=document.getElementById('pl');
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='pick-item';
    d.innerHTML=`<div class="pick-box"></div>${it.icon?`<span class="pick-icon">${it.icon}</span>`:''}<div style="flex:1;">${it.text}</div>`;
    d.onclick=()=>{
      sfx.click();
      if(picked.has(i)){picked.delete(i);d.classList.remove('picked');d.querySelector('.pick-box').textContent='';}
      else{picked.add(i);d.classList.add('picked');d.querySelector('.pick-box').textContent='✓';}
    };
    list.appendChild(d);
  });
  document.getElementById('ck').onclick=()=>{
    let correct=true;
    document.querySelectorAll('.pick-item').forEach((el,i)=>{
      const it=items[i];const wasPicked=picked.has(i);
      if(it.correct&&wasPicked){el.classList.remove('picked');el.classList.add('correct');el.querySelector('.pick-box').textContent='✓';}
      else if(it.correct&&!wasPicked){el.classList.add('correct');el.querySelector('.pick-box').textContent='✓';correct=false;}
      else if(!it.correct&&wasPicked){el.classList.remove('picked');el.classList.add('wrong');el.querySelector('.pick-box').textContent='✘';correct=false;}
    });
    if(correct){
      sfx.correct();
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Perfect! All correct! 🎉</span>';
      state.completed[state.currentLesson.id+'-'+a.id]=true;
      setTimeout(()=>{
        sfx.win();
        c.innerHTML=`
          <div class="result-box">
            <div class="result-emoji">🌟</div>
            <h2 style="color:var(--teal-d);">Excellent!</h2>
            <div class="stars">⭐⭐⭐</div>
            <div class="btn-row">
              <button class="btn" onclick="goLesson(${state.currentLesson.id})">← Lesson</button>
              <button class="btn ghost" onclick="goHome()">🏠 Home</button>
            </div>
          </div>`;
      },1500);
    }else{
      sfx.wrong();
      document.getElementById('fb').innerHTML='<span style="color:var(--coral-d)">✘ Some are wrong. Look at the red/green marks.</span>';
    }
  };
}

/* ================================================================
   UTIL + INIT
   ================================================================ */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
