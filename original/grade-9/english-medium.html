<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 9 ICT Game | Ruwanpura NCoE Batch</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-white:#fef7f7;--card:#ffffff;--ink:#2b1414;--muted:#7c5252;--line:#f0d4d4;
    --maroon:#8b1a1a;--maroon-d:#5c0e0e;--maroon-l:#fce7e7;--maroon-l2:#f5d5d5;
    --red:#c0392b;--red-d:#7f1d1d;--red-l:#fbe5e3;
    --gold:#d4a017;--gold-d:#a07500;--gold-l:#fef3c7;
    --green:#16a34a;--green-d:#15803d;--green-l:#dcfce7;
    --blue:#3b82f6;--blue-d:#1d4ed8;--blue-l:#dbeafe;
    --pink:#e11d48;--pink-d:#9f1239;--pink-l:#ffe4e6;
    --purple:#9966ff;--purple-d:#774dcb;--purple-l:#ede9fe;
    /* Scratch palette */
    --sc-events:#ffbf00;--sc-events-d:#cc9900;
    --sc-control:#ffab19;--sc-control-d:#d18a00;
    --sc-motion:#4c97ff;--sc-motion-d:#3373cc;
    --sc-looks:#9966ff;--sc-looks-d:#774dcb;
    --sc-variables:#ff8c1a;--sc-variables-d:#db6e00;
    --sc-operators:#59c059;--sc-operators-d:#46a046;
    --sc-sensing:#5cb1d6;--sc-sensing-d:#4291b5;
    --sc-pen:#0fbd8c;--sc-pen-d:#0b8c68;
    --sc-sound:#cf63cf;--sc-sound-d:#a13ea1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:linear-gradient(160deg,#fef7f7 0%,#fbe5e3 25%,#fce7e7 55%,#ffffff 100%);
    background-attachment:fixed;color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.6;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  }

  /* BG DECORATIONS */
  .bg-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .float-icon{position:absolute;opacity:.14;animation:floatAround 18s ease-in-out infinite;filter:blur(.3px);}
  @keyframes floatAround{
    0%,100%{transform:translate(0,0) rotate(-8deg) scale(1);}
    25%{transform:translate(30px,-40px) rotate(10deg) scale(1.1);}
    50%{transform:translate(-25px,-20px) rotate(-6deg) scale(.95);}
    75%{transform:translate(20px,30px) rotate(12deg) scale(1.05);}
  }
  .bubble{position:absolute;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(139,26,26,.22), rgba(139,26,26,.04));
    animation:floatBubble 22s ease-in-out infinite;}
  @keyframes floatBubble{0%,100%{transform:translate(0,0);}50%{transform:translate(-40px,-60px);}}

  /* HEADER */
  header{
    background:linear-gradient(90deg,#5c0e0e 0%,#8b1a1a 50%,#a52a2a 100%);
    color:#fff;padding:14px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    border-bottom:4px solid var(--maroon-d);position:sticky;top:0;z-index:50;
    box-shadow:0 4px 20px rgba(139,26,26,.4);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-chip{background:rgba(255,255,255,.22);color:#fff;font-weight:900;font-size:15px;
    padding:7px 15px;border-radius:10px;letter-spacing:.8px;
    border:2px solid rgba(255,255,255,.4);font-family:'Fredoka',sans-serif;}
  .brand-text{font-weight:800;font-size:15px;}
  .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .chip{background:rgba(255,255,255,.15);padding:7px 15px;border-radius:20px;
    font-weight:800;font-size:14px;border:2px solid rgba(255,255,255,.25);}
  .chip.xp{color:#fef3c7;border-color:#fbbf24;background:rgba(251,191,36,.15);}
  .chip.combo{color:#fce7f3;border-color:#ec4899;background:rgba(236,72,153,.2);}
  .chip.combo.hot{animation:pulse .5s infinite alternate;}
  @keyframes pulse{to{transform:scale(1.1);box-shadow:0 0 20px rgba(236,72,153,.75);}}
  .music-btn{background:var(--gold);color:#4a2c00;border:none;font-family:inherit;
    font-weight:900;font-size:14px;padding:8px 16px;border-radius:20px;cursor:pointer;
    transition:.15s;box-shadow:0 3px 0 var(--gold-d);}
  .music-btn.on{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d);}

  main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:22px;position:relative;z-index:1;}
  .screen{display:none;animation:fade .35s;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  h1{font-size:30px;margin:0 0 10px;text-align:center;color:var(--maroon);
    font-family:'Fredoka',sans-serif;font-weight:700;line-height:1.35;}
  h2{font-size:20px;margin:0 0 14px;text-align:center;color:var(--red);font-weight:800;}
  .sub{text-align:center;color:var(--muted);font-size:15px;margin:0 0 22px;line-height:1.6;font-weight:600;}

  .btn{background:var(--maroon);color:#fff;border:none;font-family:inherit;
    font-weight:900;font-size:16px;padding:14px 26px;border-radius:14px;cursor:pointer;
    transition:.15s;box-shadow:0 5px 0 var(--maroon-d);
    display:inline-flex;align-items:center;gap:8px;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--maroon-d);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--maroon-d);}
  .btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d);}
  .btn.green:active{box-shadow:0 2px 0 var(--green-d);}
  .btn.gold{background:var(--gold);color:#4a2c00;box-shadow:0 5px 0 var(--gold-d);}
  .btn.gold:active{box-shadow:0 2px 0 var(--gold-d);}
  .btn.ghost{background:#fff;color:var(--maroon);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);}
  .btn.ghost:active{box-shadow:0 2px 0 var(--line);}
  .btn.small{padding:10px 18px;font-size:14px;border-radius:10px;}
  .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;}

  .home-hero{background:linear-gradient(135deg,#ffffff 0%,#fef7f7 100%);
    border:2px solid var(--line);border-radius:20px;padding:28px 24px;
    text-align:center;margin-bottom:22px;box-shadow:0 8px 30px rgba(139,26,26,.12);
    position:relative;overflow:hidden;}
  .home-hero::before{content:'';position:absolute;top:-60px;right:-60px;
    width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(139,26,26,.14),transparent 70%);}
  .hero-face{font-size:74px;margin-bottom:8px;animation:bob 3s ease-in-out infinite;
    display:inline-block;position:relative;z-index:1;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-10px) rotate(3deg);}}
  .hero-msg{font-weight:800;color:var(--maroon);font-size:17px;line-height:1.7;position:relative;z-index:1;}

  .lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
  .lesson-card{background:#fff;border:2px solid var(--line);border-radius:18px;
    padding:24px 18px;cursor:pointer;text-align:center;transition:.22s;
    position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(139,26,26,.08);}
  .lesson-card::before{content:'';position:absolute;top:-40px;right:-40px;
    width:110px;height:110px;border-radius:50%;opacity:.35;}
  .lesson-card.l1::before{background:#8b1a1a;}
  .lesson-card.l2::before{background:#d4a017;}
  .lesson-card.l3::before{background:#c0392b;}
  .lesson-card.l4::before{background:#16a34a;}
  .lesson-card.l5::before{background:#3b82f6;}
  .lesson-card.l6::before{background:#e11d48;}
  .lesson-card:hover{transform:translateY(-5px);border-color:var(--maroon);
    box-shadow:0 12px 32px rgba(139,26,26,.22);}
  .lesson-card:active{transform:translateY(0);}
  .lesson-card .lc-num{position:absolute;top:12px;left:14px;
    background:var(--maroon-l);color:var(--maroon-d);font-weight:900;font-size:12px;
    padding:4px 12px;border-radius:20px;letter-spacing:.5px;z-index:1;}
  .lesson-card .lc-icon{width:74px;height:74px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-size:36px;margin:6px auto 12px;
    position:relative;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.12);color:#fff;}
  .lesson-card.l1 .lc-icon{background:linear-gradient(135deg,#a52a2a,#8b1a1a);}
  .lesson-card.l2 .lc-icon{background:linear-gradient(135deg,#fbbf24,#d4a017);}
  .lesson-card.l3 .lc-icon{background:linear-gradient(135deg,#e74c3c,#c0392b);}
  .lesson-card.l4 .lc-icon{background:linear-gradient(135deg,#34d399,#16a34a);}
  .lesson-card.l5 .lc-icon{background:linear-gradient(135deg,#60a5fa,#3b82f6);}
  .lesson-card.l6 .lc-icon{background:linear-gradient(135deg,#fb7185,#e11d48);}
  .lesson-card .lc-title{font-weight:800;color:var(--ink);font-size:16px;
    line-height:1.4;margin-bottom:8px;position:relative;z-index:1;}
  .lesson-card .lc-prog{font-size:13px;color:var(--muted);font-weight:700;position:relative;z-index:1;}
  .prog-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px;position:relative;z-index:1;}
  .prog-fill{height:100%;background:linear-gradient(90deg,#8b1a1a,#c0392b);
    width:0%;transition:width .6s;border-radius:4px;}

  .act-list{display:grid;gap:12px;max-width:760px;margin:0 auto;}
  .act-item{background:#fff;border:2px solid var(--line);border-radius:14px;
    padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;
    transition:.18s;box-shadow:0 3px 10px rgba(139,26,26,.06);}
  .act-item:hover{border-color:var(--maroon);transform:translateX(4px);
    box-shadow:0 6px 18px rgba(139,26,26,.18);}
  .act-item.done{border-color:var(--green);background:var(--green-l);}
  .act-item .an{width:46px;height:46px;border-radius:12px;background:var(--gold-l);
    color:var(--gold-d);font-weight:900;font-size:18px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;}
  .act-item.done .an{background:var(--green);color:#fff;}
  .act-item .anm{flex:1;font-weight:800;font-size:15px;}
  .act-item .at{background:var(--maroon-l);color:var(--maroon-d);font-weight:900;
    font-size:11px;padding:5px 12px;border-radius:20px;letter-spacing:.5px;flex-shrink:0;
    text-transform:uppercase;}

  .act-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .score-pill{background:#fff;border:2px solid var(--line);border-radius:20px;
    padding:8px 18px;font-weight:900;color:var(--maroon);font-size:14px;margin-left:auto;
    box-shadow:0 2px 8px rgba(139,26,26,.08);}
  .act-body{background:#fff;border:2px solid var(--line);border-radius:18px;padding:24px;
    box-shadow:0 8px 30px rgba(139,26,26,.1);}
  .instr{background:linear-gradient(135deg,#fce7e7,#f5d5d5);color:var(--maroon-d);
    border-radius:12px;padding:14px 20px;font-weight:800;font-size:15px;line-height:1.7;
    margin-bottom:20px;border-left:5px solid var(--maroon);display:flex;
    gap:10px;align-items:flex-start;}
  .instr::before{content:'💡';font-size:22px;flex-shrink:0;}
  .feedback{margin-top:16px;font-weight:900;font-size:17px;min-height:26px;text-align:center;}

  /* MATCH */
  .match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .match-col{display:grid;gap:11px;align-content:start;}
  .match-item{background:#fff;border:2px solid var(--line);border-radius:13px;
    padding:14px 16px;font-weight:700;font-size:14px;line-height:1.5;cursor:pointer;
    transition:.13s;text-align:center;box-shadow:0 3px 0 var(--line);
    display:flex;align-items:center;justify-content:center;gap:8px;min-height:66px;}
  .match-item:hover{border-color:var(--maroon);}
  .match-item.selected{border-color:var(--maroon);background:var(--maroon-l);color:var(--maroon-d);}
  .match-item.matched{border-color:var(--green);background:var(--green-l);color:var(--green-d);
    pointer-events:none;opacity:.9;}
  .match-item.shake{animation:wrongShake .4s;}
  @keyframes wrongShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  .match-icon{font-size:24px;flex-shrink:0;}

  /* TF */
  .tf-card{background:linear-gradient(135deg,#ffffff,#fef7f7);border:3px solid var(--line);
    border-radius:16px;padding:26px;text-align:center;margin-bottom:16px;}
  .tf-statement{font-size:19px;font-weight:800;line-height:1.6;margin-bottom:22px;color:var(--ink);}
  .tf-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .tf-btn{flex:1;max-width:200px;padding:20px;font-family:inherit;font-weight:900;
    font-size:18px;border-radius:14px;cursor:pointer;border:3px solid;transition:.15s;}
  .tf-true{background:var(--green-l);color:var(--green-d);border-color:var(--green);}
  .tf-true:hover{background:var(--green);color:#fff;transform:translateY(-3px);}
  .tf-false{background:var(--red-l);color:var(--red-d);border-color:var(--red);}
  .tf-false:hover{background:var(--red);color:#fff;transform:translateY(-3px);}
  .tf-btn:disabled{cursor:default;opacity:.55;}

  /* INPUT */
  .input-box{background:linear-gradient(135deg,#ffffff,#fef7f7);border:3px solid var(--line);
    border-radius:16px;padding:28px;text-align:center;}
  .input-q{font-size:22px;font-weight:900;color:var(--ink);margin-bottom:12px;line-height:1.5;}
  .input-hint{font-size:14px;color:var(--muted);margin-bottom:20px;font-weight:700;}
  .input-field{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;
    padding:16px 22px;border:3px solid var(--maroon);border-radius:12px;text-align:center;
    width:320px;max-width:100%;color:var(--maroon-d);letter-spacing:1px;background:#fff;
    transition:.15s;}
  .input-field:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 5px rgba(22,163,74,.15);}

  /* ORDER */
  .order-list{display:grid;gap:11px;}
  .order-item{background:#fff;border:2px solid var(--line);border-radius:13px;
    padding:14px 16px;font-weight:700;font-size:15px;line-height:1.55;
    display:flex;align-items:center;gap:12px;box-shadow:0 3px 0 var(--line);transition:.15s;}
  .order-item:hover{border-color:var(--maroon);}
  .order-item .num{width:38px;height:38px;border-radius:11px;background:var(--gold-l);
    color:var(--gold-d);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:16px;flex-shrink:0;}
  .order-item .txt{flex:1;display:flex;align-items:center;gap:8px;}
  .order-item .movers{display:flex;gap:5px;flex-direction:column;}
  .mover{border:none;background:var(--maroon-l);color:var(--maroon-d);
    width:38px;height:27px;border-radius:8px;font-weight:900;cursor:pointer;
    font-size:13px;line-height:1;transition:.1s;}
  .mover:hover{background:var(--maroon);color:#fff;}
  .mover:disabled{opacity:.3;cursor:default;}
  .order-item.correct{border-color:var(--green);background:var(--green-l);}
  .order-item.correct .num{background:var(--green);color:#fff;}

  /* SCRATCH HUB */
  .struct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;}
  .struct-card{background:#fff;border:3px solid var(--line);border-radius:18px;
    padding:24px 18px;cursor:pointer;text-align:center;transition:.22s;
    position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(139,26,26,.08);}
  .struct-card:hover{transform:translateY(-5px);box-shadow:0 12px 32px rgba(139,26,26,.2);}
  .struct-card.sequence:hover{border-color:#3b82f6;}
  .struct-card.selection:hover{border-color:#d4a017;}
  .struct-card.repetition:hover{border-color:#16a34a;}
  .struct-icon{width:80px;height:80px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-size:38px;margin:6px auto 14px;
    color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.15);}
  .struct-card.sequence .struct-icon{background:linear-gradient(135deg,#60a5fa,#3b82f6);}
  .struct-card.selection .struct-icon{background:linear-gradient(135deg,#fbbf24,#d4a017);}
  .struct-card.repetition .struct-icon{background:linear-gradient(135deg,#34d399,#16a34a);}
  .struct-title{font-weight:900;color:var(--ink);font-size:19px;line-height:1.4;
    margin-bottom:6px;font-family:'Fredoka',sans-serif;}
  .struct-desc{font-size:13px;color:var(--muted);font-weight:700;line-height:1.5;margin-bottom:12px;}
  .struct-prog{font-size:13px;color:var(--muted);font-weight:700;}
  .struct-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px;}
  .struct-fill{height:100%;width:0%;transition:width .6s;border-radius:4px;}
  .struct-card.sequence .struct-fill{background:linear-gradient(90deg,#3b82f6,#60a5fa);}
  .struct-card.selection .struct-fill{background:linear-gradient(90deg,#d4a017,#fbbf24);}
  .struct-card.repetition .struct-fill{background:linear-gradient(90deg,#16a34a,#34d399);}

  /* SCRATCH PUZZLE HEADER */
  .puzzle-header{text-align:center;margin-bottom:20px;padding:16px 22px;
    border-radius:14px;position:relative;}
  .puzzle-header.sequence{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border-left:6px solid #3b82f6;}
  .puzzle-header.selection{background:linear-gradient(135deg,#fef3c7,#fde68a);border-left:6px solid #d4a017;}
  .puzzle-header.repetition{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-left:6px solid #16a34a;}
  .puzzle-title{font-weight:900;font-size:20px;font-family:'Fredoka',sans-serif;margin-bottom:8px;}
  .puzzle-header.sequence .puzzle-title{color:#1d4ed8;}
  .puzzle-header.selection .puzzle-title{color:#a07500;}
  .puzzle-header.repetition .puzzle-title{color:#15803d;}
  .puzzle-desc{font-weight:700;font-size:14px;color:#4b5563;line-height:1.6;}
  .cs-badge{display:inline-block;font-weight:900;font-size:11px;padding:5px 14px;
    border-radius:20px;letter-spacing:1.5px;margin-top:10px;text-transform:uppercase;}
  .cs-badge.sequence{background:#3b82f6;color:#fff;}
  .cs-badge.selection{background:#d4a017;color:#fff;}
  .cs-badge.repetition{background:#16a34a;color:#fff;}

  .scratch-stats{display:flex;justify-content:center;gap:14px;margin:14px 0;flex-wrap:wrap;}
  .scratch-stat{background:#fff;border:2px solid var(--line);border-radius:12px;
    padding:8px 18px;font-weight:800;font-size:13px;color:var(--muted);
    display:flex;align-items:center;gap:6px;}
  .scratch-stat b{color:var(--maroon);font-size:16px;}

  /* SCRATCH WORKSPACE */
  .scratch-workspace{background:linear-gradient(180deg,#f9fafb,#f3f4f6);
    border:2px solid #e5e7eb;border-radius:16px;padding:20px;position:relative;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,191,0,.06), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(76,151,255,.06), transparent 40%);}
  .scratch-stage{background:#fff;border:2px solid #d1d5db;border-radius:12px;
    padding:14px 16px;min-height:130px;margin-bottom:18px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.03);}
  .scratch-stage-title{font-size:12px;font-weight:900;color:#6b7280;
    letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;
    display:flex;align-items:center;gap:8px;padding-bottom:10px;
    border-bottom:2px dashed #e5e7eb;}
  .scratch-stage-title::before{content:'🐱';font-size:16px;}
  .scratch-program{display:flex;flex-direction:column;gap:0;min-height:80px;position:relative;}
  .scratch-program.drop-zone{border:2px dashed transparent;border-radius:10px;
    padding:8px;transition:all .2s;}
  .scratch-program.drop-zone.active{border-color:var(--sc-events);background:rgba(255,191,0,.08);}

  /* SCRATCH BLOCKS */
  .scratch-block{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;
    border-radius:8px;font-family:'JetBrains Mono',monospace;font-weight:700;
    font-size:14px;color:#fff;position:relative;cursor:grab;user-select:none;
    box-shadow:0 3px 0 rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .15s, box-shadow .15s, opacity .2s;
    margin-bottom:5px;max-width:100%;touch-action:none;}
  .scratch-block:hover{transform:translateY(-2px);
    box-shadow:0 5px 0 rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.3);}
  .scratch-block::after{content:'';position:absolute;bottom:-6px;left:18px;
    width:26px;height:6px;background:inherit;border-radius:0 0 4px 4px;}
  .scratch-block.last::after{display:none;}
  .scratch-block.events{background:var(--sc-events);box-shadow:0 3px 0 var(--sc-events-d), inset 0 1px 0 rgba(255,255,255,.3);}

  .scratch-block.operators{background:var(--sc-operators);box-shadow:0 3px 0 var(--sc-operators-d), inset 0 1px 0 rgba(255,255,255,.3);}
  .scratch-block.sensing{background:var(--sc-sensing);box-shadow:0 3px 0 var(--sc-sensing-d), inset 0 1px 0 rgba(255,255,255,.3);}
  .scratch-block.pen{background:var(--sc-pen);box-shadow:0 3px 0 var(--sc-pen-d), inset 0 1px 0 rgba(255,255,255,.3);}
  .scratch-block.sound{background:var(--sc-sound);box-shadow:0 3px 0 var(--sc-sound-d), inset 0 1px 0 rgba(255,255,255,.3);}

  .scratch-c-block{display:flex;flex-direction:column;gap:0;background:var(--sc-control);
    border-radius:8px;box-shadow:0 3px 0 var(--sc-control-d), inset 0 1px 0 rgba(255,255,255,.3);
    margin-bottom:5px;position:relative;max-width:100%;touch-action:none;}
  .scratch-c-block.else-block{background:#ffab19;}
  .scratch-c-header{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:#fff;cursor:grab;}
  .scratch-c-body{background:rgba(255,255,255,.18);padding:8px 8px 8px 16px;margin:0 8px;
    border-radius:8px;min-height:44px;display:flex;flex-direction:column;gap:4px;}
  .scratch-c-footer{padding:12px 18px;font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:14px;color:#fff;cursor:grab;}

  .scratch-pill{background:#fff;color:#1f2d3d;padding:2px 9px;border-radius:10px;
    font-weight:800;font-size:13px;box-shadow:inset 0 1px 2px rgba(0,0,0,.15);display:inline-block;}
  .scratch-pill.green{background:#5cb85c;color:#fff;}
  .scratch-pill.purple{background:#9966ff;color:#fff;}
  .scratch-pill.blue{background:#4c97ff;color:#fff;}
  .scratch-pill.orange{background:#ff8c1a;color:#fff;}
  .scratch-pill.red{background:#e11d48;color:#fff;}

  .scratch-tray{background:linear-gradient(180deg,#fef3c7,#fde68a);
    border:2px dashed var(--sc-events-d);border-radius:12px;
    padding:24px 14px 14px;margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;
    min-height:80px;position:relative;}
  .scratch-tray::before{content:'📦 Blocks Tray — Drag blocks to the Script Area above';
    position:absolute;top:-12px;left:14px;background:var(--sc-events);color:#fff;
    font-size:11px;font-weight:900;padding:4px 12px;border-radius:8px;letter-spacing:.5px;}
  .scratch-tray .scratch-block{margin-bottom:0;}
  .scratch-tray .scratch-block::after{display:none;}
  .scratch-tray .scratch-c-block::after{display:none;}

  .scratch-block.dragging{opacity:.35;}
  .scratch-block.wrong-shake{animation:wrongShake .5s;}
  .scratch-c-block.wrong-shake{animation:wrongShake .5s;}

  .hint-box{background:#fef3c7;border-left:5px solid #fbbf24;border-radius:10px;

  .hint-box::before{content:'💡 ';font-weight:900;}

  /* BUCKET */
  .bucket-items{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;min-height:60px;}

  /* HOTSPOT */

  .hotspot-item:hover{border-color:var(--maroon);transform:translateY(-4px);

  .hotspot-item.correct{background:var(--green-l);border-color:var(--green);pointer-events:none;}
  .hotspot-item.wrong{background:var(--red-l);border-color:var(--red);}
  .hotspot-item .hs-icon{font-size:36px;}
  .hotspot-item .hs-name{font-weight:900;font-size:14px;color:var(--ink);}
  .hotspot-item .hs-desc{font-size:11px;color:var(--muted);font-weight:700;}

  /* PICK */
  .pick-list{display:grid;gap:11px;}
  .pick-item{background:#fff;border:2px solid var(--line);border-radius:13px;
    padding:14px 16px;font-weight:700;font-size:15px;line-height:1.55;
    cursor:pointer;transition:.13s;display:flex;align-items:center;gap:12px;
    box-shadow:0 3px 0 var(--line);}
  .pick-item:hover{border-color:var(--maroon);transform:translateX(4px);}
  .pick-box{width:28px;height:28px;border-radius:9px;border:3px solid var(--line);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:900;transition:all .15s;}
  .pick-item.picked{border-color:var(--maroon);background:var(--maroon-l);}
  .pick-item.picked .pick-box{border-color:var(--maroon);background:var(--maroon);color:#fff;}
  .pick-item.correct{border-color:var(--green);background:var(--green-l);}
  .pick-item.correct .pick-box{border-color:var(--green);background:var(--green);color:#fff;}
  .pick-item.wrong{border-color:var(--red);background:var(--red-l);}
  .pick-item.wrong .pick-box{border-color:var(--red);background:var(--red);color:#fff;}
  .pick-icon{font-size:22px;flex-shrink:0;}

  .result{background:linear-gradient(135deg,#ffffff,#fef7f7);border:2px solid var(--line);
    border-radius:20px;padding:34px 24px;text-align:center;
    box-shadow:0 10px 40px rgba(139,26,26,.15);}
  .result .emoji{font-size:84px;line-height:1;margin-bottom:12px;animation:pop .6s;
    display:inline-block;}
  @keyframes pop{0%{transform:scale(0) rotate(-30deg);}70%{transform:scale(1.2) rotate(10deg);}
    100%{transform:scale(1) rotate(0);}}
  .result h2{font-size:26px;color:var(--maroon);font-family:'Fredoka',sans-serif;}
  .result .score{font-size:36px;font-weight:900;color:var(--red-d);margin:14px 0;
    font-family:'Fredoka',sans-serif;}
  .stars{font-size:48px;letter-spacing:8px;margin:12px 0;}
  .star-on{color:var(--gold);text-shadow:0 0 20px rgba(212,160,23,.8);
    display:inline-block;animation:starPop .5s backwards;}
  .star-off{color:#e5d4d4;}
  @keyframes starPop{from{transform:scale(0) rotate(-180deg);}to{transform:scale(1) rotate(0);}}

  /* FLOAT SCORE & CONFETTI */
  .float-score{position:fixed;font-weight:900;font-size:26px;pointer-events:none;
    animation:floatUp 1s ease-out forwards;z-index:9999;
    text-shadow:0 2px 8px rgba(0,0,0,.25);font-family:'Fredoka',sans-serif;}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.6);}
    40%{transform:translateY(-40px) scale(1.2);}100%{opacity:0;transform:translateY(-90px) scale(1);}}
  .confetti{position:fixed;top:-20px;width:12px;height:12px;
    animation:fall linear forwards;z-index:9998;pointer-events:none;border-radius:3px;}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.15;}}

  /* FOOTER */
  footer{padding:36px 16px 46px;text-align:center;position:relative;z-index:1;
    background:linear-gradient(180deg,transparent,#fce7e7);}
  .footer-badge{display:inline-flex;flex-direction:column;align-items:center;gap:6px;
    padding:30px 60px;border-radius:38px;position:relative;
    background:linear-gradient(135deg,#8b1a1a 0%,#a52a2a 25%,#c0392b 50%,#d4a017 75%,#8b1a1a 100%);
    background-size:280% 280%;
    animation:gradientShift 8s ease infinite, badgePulse 3s ease-in-out infinite;
    box-shadow:0 0 0 6px rgba(255,255,255,.9),0 0 0 12px rgba(139,26,26,.4),
      0 24px 70px rgba(139,26,26,.5),0 0 80px rgba(212,160,23,.4);
    transform:rotate(-1deg);}
  @keyframes gradientShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
  @keyframes badgePulse{0%,100%{transform:rotate(-1deg) scale(1);}50%{transform:rotate(1deg) scale(1.04);}}
  .badge-stars{font-size:22px;letter-spacing:8px;
    animation:twinkle 1.8s ease-in-out infinite alternate;}
  @keyframes twinkle{from{opacity:.7;transform:scale(.95);}to{opacity:1;transform:scale(1.15);}}
  .badge-years{font-size:22px;font-weight:900;letter-spacing:4px;color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,.4);font-family:'Fredoka',sans-serif;}
  .badge-name{font-size:36px;font-weight:900;letter-spacing:2px;color:#fff;line-height:1.05;
    text-shadow:0 4px 16px rgba(0,0,0,.5), 0 0 30px rgba(255,255,255,.4);
    font-family:'Fredoka',sans-serif;}
  .badge-sub{font-size:12px;font-weight:900;letter-spacing:4px;

  .badge-emoji{position:absolute;font-size:30px;animation:floatAround 5s ease-in-out infinite;}
  .badge-emoji.e1{top:-18px;left:-14px;animation-delay:.2s;}
  .badge-emoji.e2{top:-18px;right:-14px;animation-delay:.8s;}
  .badge-emoji.e3{bottom:-16px;left:15%;animation-delay:1.4s;}
  .badge-emoji.e4{bottom:-16px;right:15%;animation-delay:.5s;}

  @media (max-width:640px){
    h1{font-size:22px;} h2{font-size:17px;} .brand-text{display:none;}
    .match-wrap{grid-template-columns:1fr;} .buckets{grid-template-columns:1fr;}

    .act-body{padding:18px;} .scratch-block{font-size:12px;padding:9px 13px;}
    .scratch-c-header,.scratch-c-footer{font-size:12px;padding:9px 13px;}
  }
</style>

<script>
/* ============================================================
   BACKGROUND
   ============================================================ */
function buildBackground(){
  const bg=document.getElementById('bgDecor');
  const icons=['💻','📊','🧮','⚙️','🌐','📡','📋','🔧','📈','🖥️','📱','🖨️','🧠','💾','📶','🎯'];
  const positions=[
    {top:'5%',left:'2%'},{top:'14%',right:'4%'},{top:'28%',left:'3%'},
    {top:'40%',right:'2%'},{top:'54%',left:'4%'},{top:'68%',right:'3%'},
    {top:'80%',left:'3%'},{top:'90%',right:'5%'},{top:'20%',left:'44%'},
    {top:'64%',right:'42%'},{top:'44%',left:'42%'},{top:'94%',left:'38%'}
  ];
  positions.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='float-icon';
    d.textContent=icons[i%icons.length];
    Object.assign(d.style,p);
    d.style.fontSize=(28+Math.random()*20)+'px';
    d.style.animationDelay=(i*.8)+'s';
    d.style.animationDuration=(14+Math.random()*10)+'s';
    bg.appendChild(d);
  });
  const bp=[
    {top:'10%',left:'12%',size:130},{top:'32%',right:'8%',size:95},
    {top:'58%',left:'6%',size:160},{top:'74%',right:'14%',size:110},
    {top:'86%',left:'50%',size:85}
  ];
  bp.forEach((b,i)=>{
    const d=document.createElement('div');
    d.className='bubble';
    d.style.width=b.size+'px';d.style.height=b.size+'px';
    Object.assign(d.style,{top:b.top,left:b.left,right:b.right});
    d.style.animationDelay=(i*2)+'s';
    d.style.animationDuration=(20+Math.random()*10)+'s';
    bg.appendChild(d);
  });
}

/* ============================================================
   AUDIO
   ============================================================ */
let actx=null,musicOn=false,musicTimer=null,musicGain=null,currentMelody='home';
const MELODIES={
  home:{notes:[[330,1],[392,1],[440,1],[392,1],[330,2]],wave:'triangle',tempo:.30,bass:[165,220,165,196]},
  match:{notes:[[440,1],[554,1],[659,1],[880,1],[659,1],[554,1],[440,2]],wave:'sine',tempo:.19,bass:[110,131,110,165]},
  tf:{notes:[[392,1],[494,1],[587,1],[784,1],[587,1],[494,1],[392,2]],wave:'square',tempo:.18,bass:[98,131,98,131]},
  input:{notes:[[523,1],[659,1],[784,1],[1047,1],[784,1],[659,1],[523,2]],wave:'triangle',tempo:.22,bass:[131,165,131,196]},
  order:{notes:[[349,1],[440,1],[554,1],[698,1],[554,1],[440,1],[349,2]],wave:'triangle',tempo:.20,bass:[110,131,110,131]},
  bucket:{notes:[[587,1],[698,1],[880,1],[1175,1],[880,1],[698,1],[587,2]],wave:'sine',tempo:.18,bass:[196,220,196,220]},
  hotspot:{notes:[[262,1],[330,1],[392,1],[523,1],[392,1],[330,1],[262,2]],wave:'square',tempo:.20,bass:[131,131,165,131]},
  pick:{notes:[[659,1],[784,1],[988,1],[1319,1],[988,1],[784,1],[659,2]],wave:'triangle',tempo:.16,bass:[165,196,165,220]},
  scratch:{notes:[[523,1],[587,1],[659,1],[784,1],[880,1],[784,1],[659,2]],wave:'square',tempo:.18,bass:[131,147,131,165]}
};
function ensureAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();
    musicGain=actx.createGain();musicGain.gain.value=.05;musicGain.connect(actx.destination);}
    catch(e){return;}}
  if(actx.state==='suspended')actx.resume();
}
function playMelody(){
  if(!musicOn||!actx)return;
  const m=MELODIES[currentMelody]||MELODIES.home;
  const beat=m.tempo;let t=actx.currentTime+.05;
  m.notes.forEach(([f,d])=>{
    if(f>0){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=m.wave;o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(1,t+.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d*beat*.9);
      o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d*beat);
    }
    t+=d*beat;
  });
  const total=m.notes.reduce((a,n)=>a+n[1],0)*beat;
  const bass=m.bass||[];
  bass.forEach((bf,i)=>{
    const bt=actx.currentTime+.05+(total/bass.length)*i;
    const bo=actx.createOscillator(),bg=actx.createGain();
    bo.type='sine';bo.frequency.value=bf;
    bg.gain.setValueAtTime(0.0001,bt);
    bg.gain.exponentialRampToValueAtTime(.5,bt+.03);
    bg.gain.exponentialRampToValueAtTime(0.0001,bt+beat*2);
    bo.connect(bg);bg.connect(musicGain);bo.start(bt);bo.stop(bt+beat*2+.05);
  });
  musicTimer=setTimeout(playMelody,total*1000+400);
}
function switchMusic(k){currentMelody=k;if(!musicOn)return;clearTimeout(musicTimer);playMelody();}
function toggleMusic(){
  ensureAudio();musicOn=!musicOn;
  const b=document.getElementById('musicBtn');
  if(musicOn){b.textContent='🔊 Music';b.classList.add('on');playMelody();}
  else{b.textContent='🔇 Music';b.classList.remove('on');clearTimeout(musicTimer);}
}
document.getElementById('musicBtn').onclick=toggleMusic;
function blip(f,d=.08,t='sine',v=.13,delay=0){
  if(!actx)return;const tt=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,tt);
  g.gain.exponentialRampToValueAtTime(v,tt+.01);
  g.gain.exponentialRampToValueAtTime(0.0001,tt+d);
  o.connect(g);g.connect(actx.destination);o.start(tt);o.stop(tt+d+.03);
}
const sfx={
  correct(){ensureAudio();[659,784,988,1319].forEach((f,i)=>blip(f,.15,'sine',.18,i*.05));},
  wrong(){ensureAudio();blip(220,.15,'sawtooth',.1,0);blip(160,.2,'sawtooth',.1,.1);},
  click(){ensureAudio();blip(1000,.04,'square',.04);},
  snap(){ensureAudio();blip(700,.06,'square',.15,0);blip(1000,.06,'square',.15,.05);},
  win(){ensureAudio();[523,659,784,1047,1319,1568].forEach((f,i)=>blip(f,.22,'triangle',.15,i*.1));},
  combo(){ensureAudio();[880,1109,1319].forEach((f,i)=>blip(f,.1,'square',.14,i*.04));}
};

/* ============================================================
   STATE
   ============================================================ */
const state={lesson:null,activity:null,completed:{},xp:0,combo:0,comboMax:0,
  scratchStructure:null,scratchPuzzle:null};
function addXP(n){state.xp+=n;document.getElementById('xpVal').textContent=state.xp;}
function addCombo(){
  state.combo++;
  state.comboMax=Math.max(state.comboMax,state.combo);
  document.getElementById('comboVal').textContent=state.combo;
  const chip=document.getElementById('comboChip');
  if(state.combo>=3){chip.classList.add('hot');sfx.combo();}
  else chip.classList.remove('hot');
}
function resetCombo(){state.combo=0;document.getElementById('comboVal').textContent=0;
  document.getElementById('comboChip').classList.remove('hot');}
function floatScore(text,color){
  const d=document.createElement('div');
  d.className='float-score';d.textContent=text;d.style.color=color;
  d.style.left=(window.innerWidth/2-50)+'px';d.style.top=(window.innerHeight/2)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1000);
}
function confetti(n){
  const colors=['#8b1a1a','#c0392b','#d4a017','#16a34a','#3b82f6','#e11d48','#9966ff'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration=(1.8+Math.random()*1.6)+'s';
    c.style.animationDelay=(Math.random()*.4)+'s';
    if(Math.random()>.6)c.style.borderRadius='50%';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4200);
  }
}

/* ============================================================
   LESSONS DATA
   ============================================================ */
const LESSONS=[
{
  id:1,title:'Preparation of Computer Specifications',icon:'💻',cls:'l1',
  activities:[
    {id:'1.1',type:'match',name:'Match User Roles to Tasks',
      instruction:'Match each type of ICT user with their correct responsibility.',
      pairs:[
        {l:'👨‍💻 Programmer',r:'Develops computer programs',li:'👨‍💻',ri:'⌨️'},

function renderScratchPuzzle(){
  const s=state.scratchStructure;
  const p=state.scratchPuzzle;
  if(!s||!p)return renderScratchHub();

  // Flatten expected IDs
  const expected=[];
  function walk(arr){
    arr.forEach(b=>{
      expected.push(b.id);
      if(b.body)walk(b.body);
    });
  }
  walk(p.order);

  // Flatten all blocks
  const flat=[];
  function flatten(arr){
    arr.forEach(b=>{
      flat.push({...b,body:null});
      if(b.body)flatten(b.body);
    });
  }
  flatten(p.order);
  const shuffled=shuffle(flat.slice());

  render(`
    <section class="screen active">
      <div class="act-head">
        <button class="btn ghost small" onclick="openScratchStructure('${s.id}')">← ${s.title.split(' ')[0]}</button>
        <div class="score-pill" id="progressPill">Placed: 0 / ${expected.length}</div>
      </div>

      <div class="puzzle-header ${s.color}">
        <div class="puzzle-title">${p.name}</div>
        <div class="puzzle-desc">${p.description}</div>
        <div class="cs-badge ${s.color}">${s.title.replace(' Programs','').toUpperCase()}</div>
      </div>

      <div class="act-body">
        <div class="hint-box">
          Drag each Scratch block from the tray into the Script Area and arrange them in the correct order to make the program work.
        </div>

        <div class="scratch-stats">
          <div class="scratch-stat">🎯 Blocks: <b>${expected.length}</b></div>
          <div class="scratch-stat">📦 In Tray: <b id="trayCount">${shuffled.length}</b></div>
        </div>

        <div class="scratch-workspace">
          <div class="scratch-stage">
            <div class="scratch-stage-title">Script Area — Build Your Program Here</div>
            <div class="scratch-program drop-zone" id="dropZone">
              <div style="color:#9ca3af;font-size:13px;font-weight:700;padding:20px;text-align:center;">
                ⬇ Drag blocks here in order
              </div>
            </div>
          </div>
          <div class="scratch-tray" id="tray"></div>
        </div>

        <div class="btn-row" style="margin-top:20px;">
          <button class="btn green" id="checkBtn">✔ Check Program</button>
          <button class="btn ghost" id="resetBtn">↺ Reset</button>
        </div>

        <div class="feedback" id="fb"></div>
      </div>
    </section>
  `);

  const tray=document.getElementById('tray');
  const dropZone=document.getElementById('dropZone');

  shuffled.forEach(b=>{
    const wrapper=document.createElement('div');
    wrapper.innerHTML=buildBlockHTML(b,true);
    const el=wrapper.firstElementChild;
    tray.appendChild(el);
  });

  document.querySelectorAll('.scratch-block, .scratch-c-block').forEach(attachDrag);

  dropZone.addEventListener('dragover',e=>{
    e.preventDefault();
    dropZone.classList.add('active');
  });
  dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('active'));
  dropZone.addEventListener('drop',e=>{
    e.preventDefault();
    dropZone.classList.remove('active');
    if(draggedEl){
      const newEl=draggedEl.cloneNode(true);
      newEl.classList.remove('dragging');
      dropZone.appendChild(newEl);
      draggedEl.remove();
      sfx.snap();
      updateCount();
      attachDrag(newEl);
    }
  });

  document.getElementById('checkBtn').onclick=()=>checkScratchProgram(expected);
  document.getElementById('resetBtn').onclick=()=>{sfx.click();renderScratchPuzzle();};

  function updateCount(){
    document.getElementById('trayCount').textContent=tray.children.length;
    const placed=dropZone.querySelectorAll('[data-correct-id]').length;
    document.getElementById('progressPill').textContent=`Placed: ${placed} / ${expected.length}`;
  }
  updateCount();
}

/* ---------- BUILD SCRATCH BLOCK HTML ---------- */
function buildBlockHTML(b, isLast){
  if(b.isC){
    const bodyHTML = (b.body||[]).map((child,i)=>
      buildBlockHTML(child, i === (b.body.length-1))
    ).join('');
    return `
      <div class="scratch-c-block" draggable="true" data-correct-id="${b.id}">
        <div class="scratch-c-header">${b.text}</div>
        <div class="scratch-c-body">${bodyHTML}</div>
        <div class="scratch-c-footer">↺ end</div>
      </div>`;
  }
  if(b.isElse){
    return `<div class="scratch-c-block else-block" draggable="true" data-correct-id="${b.id}">
      <div class="scratch-c-header">else</div>
    </div>`;
  }
  const cls = `scratch-block ${b.type} ${b.isHat?'has-notch':''} ${isLast?'last':''}`;
  return `<div class="${cls}" draggable="true" data-correct-id="${b.id}">${b.text}</div>`;
}

/* ---------- ATTACH DRAG HANDLERS ---------- */
function attachDrag(el){
  el.setAttribute('draggable','true');
  el.addEventListener('dragstart',e=>{
    draggedEl=el;
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
  });
  el.addEventListener('dragend',()=>{
    el.classList.remove('dragging');
    draggedEl=null;
  });
  el.addEventListener('pointerdown',handlePointerDrag);
}

function handlePointerDrag(e){
  if(e.pointerType==='mouse')return;
  if(e.target.closest('button'))return;
  e.preventDefault();

  const el=e.currentTarget;
  const rect=el.getBoundingClientRect();
  const offsetX=e.clientX-rect.left;
  const offsetY=e.clientY-rect.top;

  const ghost=el.cloneNode(true);
  ghost.style.position='fixed';
  ghost.style.left=(e.clientX-offsetX)+'px';
  ghost.style.top=(e.clientY-offsetY)+'px';
  ghost.style.pointerEvents='none';
  ghost.style.zIndex='9999';
  ghost.style.opacity='.9';
  ghost.style.transform='scale(1.04)';
  ghost.style.boxShadow='0 10px 30px rgba(0,0,0,.3)';
  document.body.appendChild(ghost);
  el.style.opacity='.35';

  function onMove(ev){
    ghost.style.left=(ev.clientX-offsetX)+'px';
    ghost.style.top=(ev.clientY-offsetY)+'px';
    const t=document.elementFromPoint(ev.clientX,ev.clientY);
    const dz=document.getElementById('dropZone');
    if(dz)dz.classList.toggle('active',dz.contains(t)||t===dz);
  }
  function onUp(ev){
    window.removeEventListener('pointermove',onMove);
    window.removeEventListener('pointerup',onUp);
    ghost.remove();
    el.style.opacity='';
    const dz=document.getElementById('dropZone');
    if(dz){
      dz.classList.remove('active');
      const t=document.elementFromPoint(ev.clientX,ev.clientY);
      if(dz.contains(t)||t===dz){
        if(!el.parentElement.closest('#dropZone')){
          const newEl=el.cloneNode(true);
          newEl.style.opacity='';
          dz.appendChild(newEl);
          el.remove();
          sfx.snap();
          const tray=document.getElementById('tray');
          document.getElementById('trayCount').textContent=tray.children.length;
          attachDrag(newEl);
          const placed=dz.querySelectorAll('[data-correct-id]').length;
          const p=state.scratchPuzzle;
          const flat=[];function flatWalk(arr){arr.forEach(b=>{flat.push(b.id);if(b.body)flatWalk(b.body);});}
          flatWalk(p.order);
          document.getElementById('progressPill').textContent=`Placed: ${placed} / ${flat.length}`;
        }
      }
    }
  }
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
}

  }

  if(JSON.stringify(placed)===JSON.stringify(expected)){

    floatScore('+'+(25+state.combo*3)+' XP','#16a34a');

    state.completed['sc-'+p.id]=true;
    fb.innerHTML='<span style="color:var(--green-d)">✔ Perfect program! 🎉</span>';
    setTimeout(()=>{
      sfx.win();
      render(`
        <section class="screen active">
          <div class="result">
            <div class="emoji">🏆</div>
            <h2>Excellent Coding!</h2>
            <div class="stars">
              <span class="star-on">⭐</span><span class="star-on" style="animation-delay:.2s">⭐</span><span class="star-on" style="animation-delay:.4s">⭐</span>
            </div>
            <p style="color:var(--muted);font-weight:700;">You built the "${p.name}" program correctly!</p>
            <p style="color:var(--muted);font-weight:700;font-size:14px;">
              Control structure: <b>${s.title.replace(' Programs','')}</b>
            </p>
            <div class="btn-row">
              <button class="btn" onclick="openScratchStructure('${s.id}')">← ${s.title.split(' ')[0]} Menu</button>
              <button class="btn ghost" onclick="renderScratchHub()">🐱 Scratch Builder</button>
              <button class="btn ghost" onclick="goHome()">🏠 Home</button>
            </div>
          </div>
        </section>
      `);
    },1400);
  }else{
    sfx.wrong();resetCombo();
    fb.innerHTML='<span style="color:var(--red-d)">✘ Incorrect order. Blocks shaking below are in the wrong spot.</span>';
    document.querySelectorAll('.wrong-shake').forEach(el=>el.classList.remove('wrong-shake'));

/* ============================================================
   MATCH
   ============================================================ */
function renderMatch(c,a){
  const pairs=a.pairs;
  const left=pairs.map((p,i)=>({text:p.l,key:i,icon:p.li}));
  const right=shuffle(pairs.map((p,i)=>({text:p.r,key:i,icon:p.ri})));
  let sel=null,matched=0,wrongAttempts=0;const total=pairs.length;
  function updatePill(){document.getElementById('scorePill').textContent=`Matched: ${matched} / ${total}`;}
  c.innerHTML=`
    <div class="instr">${a.instruction}</div>
    <div class="match-wrap"><div class="match-col" id="lc"></div><div class="match-col" id="rc"></div></div>
    <div class="feedback" id="fb"></div>`;
  const lc=document.getElementById('lc'),rc=document.getElementById('rc');
  left.forEach(it=>{
    const d=document.createElement('div');d.className='match-item';
    d.innerHTML=`<span class="match-icon">${it.icon||''}</span><span>${it.text}</span>`;
    d.dataset.key=it.key;
    d.onclick=()=>{if(d.classList.contains('matched'))return;sfx.click();
      document.querySelectorAll('#lc .match-item').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');sel={el:d,it};};
    lc.appendChild(d);
  });
  right.forEach(it=>{
    const d=document.createElement('div');d.className='match-item';
    d.innerHTML=`<span class="match-icon">${it.icon||''}</span><span>${it.text}</span>`;
    d.dataset.key=it.key;
    d.onclick=()=>{
      if(d.classList.contains('matched'))return;
      if(!sel){document.getElementById('fb').textContent='Select an item from the left first.';return;}
      if(sel.it.key===it.key){
        sel.el.classList.remove('selected');sel.el.classList.add('matched');d.classList.add('matched');
        matched++;addCombo();sfx.correct();
        floatScore('+'+(10+state.combo*2)+' XP','#16a34a');
        addXP(10+state.combo*2);
        document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct match! 👏</span>';
        sel=null;updatePill();
        if(matched===total)finish();
      }else{
        d.classList.add('shake');const sl=sel.el;sl.classList.add('shake');
        setTimeout(()=>{d.classList.remove('shake');sl.classList.remove('shake');},450);
        sfx.wrong();wrongAttempts++;resetCombo();
        document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Not a match. Try again.</span>';
        sl.classList.remove('selected');sel=null;
      }
    };
    rc.appendChild(d);
  });
  updatePill();
  function finish(){
    state.completed[state.lesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();
      const stars=wrongAttempts===0?3:wrongAttempts<=2?2:1;
      let sh='';for(let i=0;i<3;i++)sh+=`<span class="${i<stars?'star-on':'star-off'}">⭐</span>`;
      if(stars===3)confetti(60);
      c.innerHTML=`
        <div class="result">
          <div class="emoji">${stars===3?'🏆':stars===2?'🎯':'💪'}</div>
          <h2>Level Complete!</h2>
          <div class="stars">${sh}</div>
          <p style="color:var(--muted);font-weight:700;">Wrong attempts: <b>${wrongAttempts}</b></p>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
            <button class="btn ghost" onclick="goHome()">🏠 Home</button>
          </div>
        </div>`;
    },900);
  }
}

/* ============================================================
   TF
   ============================================================ */
function renderTF(c,a){
  let idx=0,correct=0;const total=a.statements.length;
  function draw(){
    if(idx>=total)return finish();
    const st=a.statements[idx];
    c.innerHTML=`
      <div class="instr">${a.instruction}</div>
      <div class="tf-card">
        <div class="tf-statement">${st.s}</div>
        <div class="tf-buttons">
          <button class="tf-btn tf-true" id="btnTrue">✓ TRUE</button>
          <button class="tf-btn tf-false" id="btnFalse">✗ FALSE</button>
        </div>
      </div>
      <div class="feedback" id="fb"></div>`;
    document.getElementById('btnTrue').onclick=()=>pick(true);
    document.getElementById('btnFalse').onclick=()=>pick(false);
    document.getElementById('scorePill').textContent=`Question: ${idx+1} / ${total}`;
  }
  function pick(val){
    const st=a.statements[idx];
    const btnT=document.getElementById('btnTrue');
    const btnF=document.getElementById('btnFalse');
    btnT.disabled=true;btnF.disabled=true;
    const chosen=val?btnT:btnF;
    if(val===st.a){
      chosen.style.background='var(--green)';chosen.style.color='#fff';
      sfx.correct();addCombo();
      floatScore('+'+(10+state.combo*2)+' XP','#16a34a');
      addXP(10+state.combo*2);correct++;
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct!</span>';
    }else{
      chosen.style.background='var(--red)';chosen.style.color='#fff';
      const right=st.a?btnT:btnF;
      right.style.borderColor='var(--green)';right.style.borderWidth='4px';
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Wrong. Correct: '+(st.a?'TRUE':'FALSE')+'.</span>';
    }
    setTimeout(()=>{idx++;draw();},1300);
  }
  function finish(){
    state.completed[state.lesson.id+'-'+a.id]=true;
    sfx.win();
    const stars=correct===total?3:correct>=total*.6?2:1;
    let sh='';for(let i=0;i<3;i++)sh+=`<span class="${i<stars?'star-on':'star-off'}">⭐</span>`;
    if(stars===3)confetti(60);
    c.innerHTML=`
      <div class="result">
        <div class="emoji">${stars===3?'🏆':stars===2?'🎯':'💪'}</div>
        <h2>Complete!</h2>
        <div class="stars">${sh}</div>
        <div class="score">${correct} / ${total}</div>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
          <button class="btn ghost" onclick="goHome()">🏠 Home</button>
        </div>
      </div>`;
  }
  draw();
}

/* ============================================================
   INPUT
   ============================================================ */
function renderInput(c,a){
  let idx=0,correct=0;const total=a.questions.length;
  function draw(){
    if(idx>=total)return finish();
    const q=a.questions[idx];
    c.innerHTML=`
      <div class="instr">${a.instruction}</div>
      <div class="input-box">
        <div class="input-q">${q.q}</div>
        <div class="input-hint">💡 Hint: ${q.hint}</div>
        <input type="text" class="input-field" id="inp" autocomplete="off" spellcheck="false">
      </div>
      <div class="btn-row">
        <button class="btn green" id="subBtn">✔ Submit</button>
      </div>
      <div class="feedback" id="fb"></div>`;
    const inp=document.getElementById('inp');
    inp.focus();
    inp.onkeydown=(e)=>{if(e.key==='Enter')submit();};
    document.getElementById('subBtn').onclick=submit;
    document.getElementById('scorePill').textContent=`Question: ${idx+1} / ${total}`;
  }
  function submit(){
    const q=a.questions[idx];
    const val=document.getElementById('inp').value.trim().toLowerCase().replace(/\s+/g,'');
    const ans=q.ans.toLowerCase().replace(/\s+/g,'');
    if(val===ans){
      sfx.correct();addCombo();
      floatScore('+'+(15+state.combo*3)+' XP','#16a34a');
      addXP(15+state.combo*3);correct++;
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct! 🎉</span>';
      document.getElementById('inp').disabled=true;
      document.getElementById('subBtn').disabled=true;
      setTimeout(()=>{idx++;draw();},1200);
    }else{
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Wrong. Try again.</span>';
      document.getElementById('inp').value='';
      document.getElementById('inp').focus();
    }
  }
  function finish(){
    state.completed[state.lesson.id+'-'+a.id]=true;
    sfx.win();
    const stars=correct===total?3:correct>=total*.6?2:1;
    let sh='';for(let i=0;i<3;i++)sh+=`<span class="${i<stars?'star-on':'star-off'}">⭐</span>`;
    if(stars===3)confetti(60);
    c.innerHTML=`
      <div class="result">
        <div class="emoji">${stars===3?'🏆':stars===2?'🎯':'💪'}</div>
        <h2>Complete!</h2>
        <div class="stars">${sh}</div>
        <div class="score">${correct} / ${total}</div>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
          <button class="btn ghost" onclick="goHome()">🏠 Home</button>
        </div>
      </div>`;
  }
  draw();
}

/* ============================================================
   ORDER
   ============================================================ */
function renderOrder(c,a){
  const correct=a.correctOrder.map(x=>typeof x==='string'?x:x.text);
  let current=shuffle(a.correctOrder.map((x,i)=>({text:typeof x==='string'?x:x.text,icon:typeof x==='string'?null:x.icon,orig:i})));
  function draw(){
    c.innerHTML=`
      <div class="instr">${a.instruction}</div>
      <div class="order-list" id="ol"></div>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn gold" id="ck">✔ Check Order</button>
      </div>
      <div class="feedback" id="fb"></div>`;
    const list=document.getElementById('ol');
    current.forEach((it,i)=>{
      const d=document.createElement('div');d.className='order-item';
      d.innerHTML=`
        <div class="num">${i+1}</div>
        <div class="txt">${it.icon?`<span style="font-size:22px;">${it.icon}</span>`:''}<span>${it.text}</span></div>
        <div class="movers">
          <button class="mover" ${i===0?'disabled':''} data-dir="up">▲</button>
          <button class="mover" ${i===current.length-1?'disabled':''} data-dir="down">▼</button>
        </div>`;
      list.appendChild(d);
      d.querySelector('[data-dir="up"]').onclick=()=>swap(i,i-1);
      d.querySelector('[data-dir="down"]').onclick=()=>swap(i,i+1);
    });
    document.getElementById('ck').onclick=check;
  }
  function swap(i,j){
    if(j<0||j>=current.length)return;sfx.click();
    [current[i],current[j]]=[current[j],current[i]];draw();
  }
  function check(){
    let allCorrect=true;
    document.querySelectorAll('.order-item').forEach((el,i)=>{
      if(current[i].text===correct[i])el.classList.add('correct');
      else allCorrect=false;
    });
    if(allCorrect){
      sfx.correct();addCombo();
      floatScore('+'+(20+state.combo*3)+' XP','#16a34a');
      addXP(20+state.combo*3);
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct order! 🎉</span>';
      state.completed[state.lesson.id+'-'+a.id]=true;
      setTimeout(()=>{
        sfx.win();confetti(60);
        c.innerHTML=`
          <div class="result">
            <div class="emoji">✅</div>
            <h2>Well Done!</h2>
            <div class="stars">
              <span class="star-on">⭐</span><span class="star-on" style="animation-delay:.2s">⭐</span><span class="star-on" style="animation-delay:.4s">⭐</span>
            </div>
            <div class="btn-row">
              <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
              <button class="btn ghost" onclick="goHome()">🏠 Home</button>
            </div>
          </div>`;
      },1400);
    }else{
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Some steps are wrong. Try again.</span>';
      setTimeout(()=>{document.querySelectorAll('.order-item.correct').forEach(el=>el.classList.remove('correct'));},1400);
    }
  }
  draw();
}

/* ============================================================
   BUCKET
   ============================================================ */
function renderBucket(c,a){
  const allItems=[];a.buckets.forEach((b,bi)=>b.items.forEach(t=>allItems.push({text:t,bucket:bi})));
  const pool=shuffle(allItems.slice());let selected=null,placed=0;const total=allItems.length;
  function updatePill(){document.getElementById('scorePill').textContent=`Score: ${placed} / ${total}`;}
  c.innerHTML=`
    <div class="instr">${a.instruction}</div>
    <div class="bucket-items" id="pool"></div>
    <div class="buckets" id="bks"></div>
    <div class="feedback" id="fb"></div>`;
  const poolEl=document.getElementById('pool');
  pool.forEach((it,i)=>{
    const d=document.createElement('div');d.className='b-item';d.textContent=it.text;
    d.onclick=()=>{
      if(d.classList.contains('placed'))return;sfx.click();
      document.querySelectorAll('.b-item').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');selected={el:d,item:it};
    };
    poolEl.appendChild(d);
  });
  const bksEl=document.getElementById('bks');
  a.buckets.forEach((b,bi)=>{
    const d=document.createElement('div');d.className='bucket';d.dataset.bi=bi;
    d.innerHTML=`<div class="bucket-title">${b.name}</div><div class="bucket-contents"></div>`;
    d.onclick=()=>drop(bi,d);bksEl.appendChild(d);
  });
  updatePill();
  function drop(bi,el){
    if(!selected)return;const it=selected.item;
    if(it.bucket===bi){
      el.classList.add('active');setTimeout(()=>el.classList.remove('active'),500);
      const chip=document.createElement('div');chip.className='b-chip';chip.textContent=it.text;
      el.querySelector('.bucket-contents').appendChild(chip);
      selected.el.classList.remove('selected');selected.el.classList.add('placed');
      selected=null;placed++;addCombo();sfx.correct();
      floatScore('+'+(8+state.combo*2)+' XP','#16a34a');
      addXP(8+state.combo*2);
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct bucket!</span>';
      updatePill();
      if(placed===total)finish();
    }else{
      el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),450);sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Wrong bucket. Try again.</span>';
    }
  }
  function finish(){
    state.completed[state.lesson.id+'-'+a.id]=true;
    setTimeout(()=>{
      sfx.win();confetti(60);
      c.innerHTML=`
        <div class="result">
          <div class="emoji">🗂️</div>
          <h2>All Sorted!</h2>
          <div class="stars">
            <span class="star-on">⭐</span><span class="star-on" style="animation-delay:.2s">⭐</span><span class="star-on" style="animation-delay:.4s">⭐</span>
          </div>
          <div class="btn-row">
            <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
            <button class="btn ghost" onclick="goHome()">🏠 Home</button>
          </div>
        </div>`;
    },900);
  }
}

/* ============================================================
   HOTSPOT
   ============================================================ */
function renderHotspot(c,a){
  let idx=0,correct=0;const total=a.rounds.length;
  function optSet(){
    if(a.id==='2.2')return CHART_OPTIONS;
    if(a.id==='4.2')return SENSOR_OPTIONS;
    if(a.id==='6.2')return TERM_OPTIONS;
    return CHART_OPTIONS;
  }
  function draw(){
    if(idx>=total)return finish();
    const r=a.rounds[idx];
    const opts=optSet();
    c.innerHTML=`
      <div class="instr">${a.instruction}</div>
      <div style="font-weight:900;color:var(--maroon-d);font-size:17px;text-align:center;margin-bottom:18px;">
        ${r.q}
      </div>
      <div class="hotspot-grid" id="grid"></div>
      <div class="feedback" id="fb"></div>`;
    const grid=document.getElementById('grid');
    opts.forEach(o=>{
      const d=document.createElement('div');
      d.className='hotspot-item';
      d.innerHTML=`
        <div class="hs-icon">${o.icon}</div>
        <div class="hs-name">${o.name}</div>
        <div class="hs-desc">${o.desc}</div>`;
      d.onclick=()=>pick(o.key,d);
      grid.appendChild(d);
    });
    document.getElementById('scorePill').textContent=`Question: ${idx+1} / ${total}`;
  }
  function pick(key,el){
    const r=a.rounds[idx];
    if(key===r.ans){
      el.classList.add('correct');
      sfx.correct();addCombo();
      floatScore('+'+(12+state.combo*2)+' XP','#16a34a');
      addXP(12+state.combo*2);correct++;
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct!</span>';
      setTimeout(()=>{idx++;draw();},1200);
    }else{
      el.classList.add('wrong');
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Not right. Try again.</span>';
      setTimeout(()=>el.classList.remove('wrong'),600);
    }
  }
  function finish(){
    state.completed[state.lesson.id+'-'+a.id]=true;
    sfx.win();
    const stars=correct===total?3:correct>=total*.6?2:1;
    let sh='';for(let i=0;i<3;i++)sh+=`<span class="${i<stars?'star-on':'star-off'}">⭐</span>`;
    if(stars===3)confetti(60);
    c.innerHTML=`
      <div class="result">
        <div class="emoji">${stars===3?'🏆':stars===2?'🎯':'💪'}</div>
        <h2>Complete!</h2>
        <div class="stars">${sh}</div>
        <div class="score">${correct} / ${total}</div>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
          <button class="btn ghost" onclick="goHome()">🏠 Home</button>
        </div>
      </div>`;
  }
  draw();
}

/* ============================================================
   PICK
   ============================================================ */
function renderPick(c,a){
  const items=shuffle(a.items.slice());const picked=new Set();
  c.innerHTML=`
    <div class="instr">${a.instruction}</div>
    <div class="pick-list" id="pl"></div>
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn gold" id="ck">✔ Check Answers</button>
    </div>
    <div class="feedback" id="fb"></div>`;
  const list=document.getElementById('pl');
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='pick-item';
    d.innerHTML=`<div class="pick-box"></div>${it.icon?`<span class="pick-icon">${it.icon}</span>`:''}<div style="flex:1;">${it.text}</div>`;
    d.onclick=()=>{
      sfx.click();
      if(picked.has(i)){picked.delete(i);d.classList.remove('picked');d.querySelector('.pick-box').textContent='';}
      else{picked.add(i);d.classList.add('picked');d.querySelector('.pick-box').textContent='✓';}
    };
    list.appendChild(d);
  });
  document.getElementById('ck').onclick=()=>{
    let correct=true;
    document.querySelectorAll('.pick-item').forEach((el,i)=>{
      const it=items[i];const wasPicked=picked.has(i);
      if(it.correct&&wasPicked){el.classList.remove('picked');el.classList.add('correct');el.querySelector('.pick-box').textContent='✓';}
      else if(it.correct&&!wasPicked){el.classList.add('correct');el.querySelector('.pick-box').textContent='✓';correct=false;}
      else if(!it.correct&&wasPicked){el.classList.remove('picked');el.classList.add('wrong');el.querySelector('.pick-box').textContent='✘';correct=false;}
    });
    if(correct){
      sfx.correct();addCombo();
      floatScore('+'+(20+state.combo*3)+' XP','#16a34a');
      addXP(20+state.combo*3);
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Perfect! All correct! 🎉</span>';
      state.completed[state.lesson.id+'-'+a.id]=true;
      setTimeout(()=>{
        sfx.win();confetti(60);
        c.innerHTML=`
          <div class="result">
            <div class="emoji">🌟</div>
            <h2>Excellent!</h2>
            <div class="stars">
              <span class="star-on">⭐</span><span class="star-on" style="animation-delay:.2s">⭐</span><span class="star-on" style="animation-delay:.4s">⭐</span>
            </div>
            <div class="btn-row">
              <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
              <button class="btn ghost" onclick="goHome()">🏠 Home</button>
            </div>
          </div>`;
      },1500);
    }else{
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Some are wrong. Check the red/green marks.</span>';
    }
  };
}

/* ============================================================
   UTIL + INIT
   ============================================================ */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
document.addEventListener('pointerdown',ensureAudio,{once:true});
buildBackground();
renderHome();
