<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Adventure - Grade 9</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Comic Sans MS', Tahoma, sans-serif; }
html, body { min-height: 100vh; overflow-x: hidden; }
body { background: #eef0ff; color: #1e1b4b; padding: 15px; transition: background 0.8s; position: relative; font-size: 18px; }

#bgLayer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#bgLayer::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(circle at 20% 30%, rgba(99,102,241,0.35), transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,0.7), transparent 55%);
  animation: bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }

body.theme-cpu #bgLayer { background: linear-gradient(135deg, #eef0ff 0%, #c7d2fe 50%, #ffffff 100%); }
body.theme-cpu #bgLayer::after {
  content: ''; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(99,102,241,0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.15) 1px, transparent 1px);
  background-size: 70px 70px; animation: gridMove 20s linear infinite;
}
@keyframes gridMove { to { background-position: 70px 70px; } }

body.theme-sheet #bgLayer { background: linear-gradient(135deg, #e0e7ff 0%, #a5b4fc 50%, #ffffff 100%); }
body.theme-code #bgLayer { background: linear-gradient(135deg, #dde4ff 0%, #818cf8 60%, #f5f3ff 100%); }
body.theme-micro #bgLayer { background: linear-gradient(135deg, #eef0ff 0%, #b4c0fc 50%, #ffffff 100%); }
body.theme-net #bgLayer { background: linear-gradient(135deg, #e8ebff 0%, #a5b4fc 55%, #ffffff 100%); }
body.theme-society #bgLayer { background: linear-gradient(135deg, #f0eaff 0%, #c7b8ff 50%, #ffffff 100%); }

.bg-emoji { position: absolute; font-size: 4em; opacity: 0.35; animation: floatAround 18s ease-in-out infinite; filter: drop-shadow(0 0 15px currentColor); pointer-events: none; }
@keyframes floatAround {
  0%, 100% { transform: translate(0, 0) rotate(-8deg) scale(1); }
  25% { transform: translate(30px, -40px) rotate(8deg) scale(1.1); }
  50% { transform: translate(-20px, -60px) rotate(-5deg) scale(0.95); }
  75% { transform: translate(40px, -20px) rotate(10deg) scale(1.05); }
}

.particle { position: absolute; border-radius: 50%; background: rgba(99,102,241,0.75); animation: floatUp linear infinite; box-shadow: 0 0 12px currentColor; }
@keyframes floatUp { from { transform: translateY(100vh) scale(0.5); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } to { transform: translateY(-100px) scale(1.3); opacity: 0; } }

.confetti { position: fixed; width: 14px; height: 14px; z-index: 999; pointer-events: none; animation: confettiFall 3s linear forwards; border-radius: 3px; }
@keyframes confettiFall { from { transform: translateY(-30px) rotate(0deg); opacity: 1; } to { transform: translateY(100vh) rotate(1080deg); opacity: 0; } }

.float-score { position: fixed; font-size: 2.5em; font-weight: 900; color: #4f46e5; text-shadow: 0 0 15px #818cf8, 0 0 30px #ffffff, 2px 2px 4px rgba(0,0,0,0.2); pointer-events: none; z-index: 999; animation: floatScore 1.5s ease-out forwards; }
@keyframes floatScore { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { transform: translateY(-30px) scale(1.4); opacity: 1; } 100% { transform: translateY(-150px) scale(1); opacity: 0; } }

.container { max-width: 1000px; margin: 0 auto; position: relative; z-index: 2; }

.header-bar { text-align: center; margin-bottom: 20px; padding: 20px; background: rgba(255,255,255,0.85); border-radius: 25px; backdrop-filter: blur(18px); border: 2px solid rgba(99,102,241,0.55); box-shadow: 0 15px 45px rgba(99,102,241,0.25), 0 8px 20px rgba(0,0,0,0.1); }
h1 { font-size: 2.4em; margin-bottom: 6px; font-weight: 900; background: linear-gradient(90deg, #4f46e5, #818cf8, #4338ca, #6366f1); background-size: 400% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 4s linear infinite; letter-spacing: 1px; filter: drop-shadow(0 2px 4px rgba(99,102,241,0.3)); }
@keyframes shimmer { to { background-position: 400% 0; } }
.subtitle { color: #4f46e5; font-size: 1.05em; font-weight: 600; }

.music-ctrl { position: fixed; top: 15px; right: 15px; z-index: 100; background: rgba(255,255,255,0.9); border-radius: 50px; padding: 8px 12px; border: 2px solid rgba(99,102,241,0.7); display: flex; gap: 8px; align-items: center; backdrop-filter: blur(12px); box-shadow: 0 0 25px rgba(99,102,241,0.4); }
.music-ctrl button { background: rgba(99,102,241,0.25); border: none; color: #4f46e5; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; font-size: 1.4em; transition: all 0.3s; }
.music-ctrl button:hover { background: rgba(99,102,241,0.55); transform: scale(1.12) rotate(10deg); }
.music-ctrl button.muted { color: #999; background: rgba(150,150,150,0.25); }
.music-label { font-size: 0.85em; color: #4f46e5; font-weight: bold; }

.card { background: rgba(255,255,255,0.85); backdrop-filter: blur(18px); border-radius: 28px; padding: 25px; margin-bottom: 20px; border: 2px solid rgba(99,102,241,0.4); box-shadow: 0 20px 50px rgba(99,102,241,0.2), 0 8px 20px rgba(0,0,0,0.08); animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.btn { background: linear-gradient(90deg, #6366f1, #4f46e5); color: #fff; border: none; padding: 16px 34px; font-size: 1.1em; border-radius: 50px; cursor: pointer; font-weight: 900; transition: all 0.3s; margin: 6px; box-shadow: 0 8px 25px rgba(99,102,241,0.5); position: relative; overflow: hidden; }
.btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.6) 50%, transparent 70%); transform: translateX(-100%); transition: transform 0.6s; }
.btn:hover::after { transform: translateX(100%); }
.btn:hover { transform: translateY(-4px) scale(1.06); box-shadow: 0 15px 40px rgba(99,102,241,0.7); }
.btn:active { transform: scale(0.97); }
.btn.small { padding: 11px 22px; font-size: 0.95em; }
.btn.green { background: linear-gradient(90deg, #818cf8, #6366f1); }
.btn.danger { background: linear-gradient(90deg, #4338ca, #3730a3); }

.lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.lesson-card { position: relative; overflow: hidden; background: linear-gradient(135deg, rgba(199,210,254,0.85), rgba(255,255,255,0.95)); border-radius: 22px; padding: 22px; text-align: center; cursor: pointer; border: 2px solid rgba(99,102,241,0.5); transition: all 0.4s; }
.lesson-card::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(99,102,241,0.25), transparent); transition: left 0.7s; }
.lesson-card:hover::before { left: 100%; }
.lesson-card:hover { transform: translateY(-10px) scale(1.04); border-color: #6366f1; box-shadow: 0 20px 45px rgba(99,102,241,0.4); }
.lesson-card .num { font-size: 2.4em; font-weight: 900; color: #4f46e5; text-shadow: 0 2px 4px rgba(99,102,241,0.3); line-height: 1; }
.lesson-card .emoji { font-size: 3.4em; margin: 8px 0; filter: drop-shadow(0 4px 8px rgba(99,102,241,0.4)); animation: bounceSmall 2s ease-in-out infinite alternate; }
@keyframes bounceSmall { from { transform: translateY(0); } to { transform: translateY(-6px); } }
.lesson-card .title { font-size: 1.15em; margin-top: 8px; color: #1e1b4b; font-weight: 900; }
.lesson-card .title-si { font-size: 0.85em; color: #4338ca; margin-top: 4px; font-weight: 600; }
.lesson-card .game-count { font-size: 0.85em; color: #4f46e5; margin-top: 10px; background: rgba(99,102,241,0.15); padding: 5px 14px; border-radius: 20px; display: inline-block; font-weight: bold; border: 1px solid rgba(99,102,241,0.35); }

.game-option { display: flex; align-items: center; gap: 20px; padding: 20px; background: rgba(199,210,254,0.4); border-radius: 20px; margin: 14px 0; cursor: pointer; border-left: 6px solid #6366f1; transition: all 0.3s; position: relative; }
.game-option:hover { background: rgba(165,180,252,0.6); transform: translateX(12px); box-shadow: 0 12px 35px rgba(99,102,241,0.35); }
.game-option .icon { font-size: 3.2em; filter: drop-shadow(0 3px 6px rgba(99,102,241,0.4)); animation: bounceSmall 1.8s ease-in-out infinite alternate; }
.game-option .info .name { font-weight: 900; color: #1e1b4b; font-size: 1.2em; }
.game-option .info .desc { font-size: 0.9em; color: #4338ca; margin-top: 5px; font-weight: 500; }
.game-option .badge { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.6em; opacity: 0.7; }

.scoreboard { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
.score-box { background: rgba(199,210,254,0.6); padding: 12px 22px; border-radius: 15px; border: 2px solid rgba(99,102,241,0.5); text-align: center; min-width: 120px; backdrop-filter: blur(10px); }
.score-box .lbl { font-size: 0.8em; color: #4338ca; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold; }
.score-box .val { font-size: 1.9em; font-weight: 900; color: #4f46e5; text-shadow: 0 2px 4px rgba(99,102,241,0.25); }

.progress-bar { height: 22px; background: rgba(255,255,255,0.85); border-radius: 11px; overflow: hidden; margin: 12px 0; border: 2px solid rgba(99,102,241,0.45); }
.progress-fill { height: 100%; background: linear-gradient(90deg, #818cf8, #6366f1, #4f46e5); width: 0%; transition: width 0.5s; box-shadow: 0 0 18px rgba(99,102,241,0.7); }

.q-text { font-size: 1.4em; margin-bottom: 10px; text-align: center; font-weight: 900; line-height: 1.4; color: #1e1b4b; }
.q-text-si { font-size: 1.05em; color: #4338ca; font-style: italic; margin-bottom: 20px; text-align: center; font-weight: 500; }
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.option-btn { padding: 22px; background: rgba(255,255,255,0.9); border: 3px solid rgba(99,102,241,0.5); border-radius: 18px; color: #1e1b4b; cursor: pointer; font-size: 1.1em; transition: all 0.25s; font-weight: 700; line-height: 1.4; }
.option-btn:hover { background: rgba(199,210,254,0.9); transform: scale(1.04); border-color: #6366f1; }
.option-btn.correct { background: rgba(129,140,248,0.85); border-color: #4f46e5; color: #fff; animation: correctPop 0.5s; }
.option-btn.wrong { background: rgba(67,56,202,0.85); border-color: #3730a3; color: #fff; animation: shake 0.4s; }
@keyframes correctPop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1) rotate(2deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

.feedback { text-align: center; padding: 18px; border-radius: 15px; margin-top: 16px; font-weight: 900; font-size: 1.1em; display: none; animation: fadeIn 0.4s; }
.feedback.show { display: block; }
.feedback.ok { background: rgba(129,140,248,0.4); color: #312e81; border: 2px solid #6366f1; }
.feedback.no { background: rgba(67,56,202,0.35); color: #312e81; border: 2px solid #4338ca; }

.sort-pool, .sort-bins { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 18px 0; }
.sort-item { background: linear-gradient(90deg, #818cf8, #6366f1); color: #fff; padding: 14px 20px; border-radius: 14px; cursor: pointer; font-weight: 900; font-size: 1em; transition: all 0.3s; box-shadow: 0 6px 18px rgba(99,102,241,0.45); }
.sort-item:hover { transform: scale(1.08) translateY(-4px); }
.sort-item.selected { box-shadow: 0 0 0 4px #4f46e5, 0 6px 20px rgba(79,70,229,0.6); transform: scale(1.1); }
.bin { flex: 1; min-width: 180px; background: rgba(255,255,255,0.85); border-radius: 18px; padding: 18px; text-align: center; cursor: pointer; transition: all 0.3s; border: 3px solid transparent; min-height: 140px; }
.bin:hover { border-color: #6366f1; transform: translateY(-4px); }
.bin .bin-title { font-weight: 900; color: #4f46e5; font-size: 1.1em; margin-bottom: 10px; }
.bin .bin-item { background: rgba(199,210,254,0.9); padding: 8px; border-radius: 8px; font-size: 0.9em; margin: 4px 0; font-weight: bold; color: #1e1b4b; }

.memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 620px; margin: 20px auto; }
.mem-card { aspect-ratio: 1; background: linear-gradient(135deg, #818cf8, #4f46e5); border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.95em; text-align: center; padding: 8px; transition: all 0.4s; font-weight: 900; color: #fff; box-shadow: 0 8px 20px rgba(99,102,241,0.4); border: 3px solid rgba(255,255,255,0.4); }
.mem-card:hover { transform: scale(1.06); }
.mem-card.flipped { background: rgba(199,210,254,0.9); border-color: #6366f1; color: #1e1b4b; }
.mem-card.matched { background: linear-gradient(135deg, #a5b4fc, #818cf8); opacity: 0.6; cursor: default; }

.match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin: 20px 0; }
.match-card { background: rgba(255,255,255,0.9); border-radius: 18px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; border: 3px solid rgba(99,102,241,0.5); font-weight: bold; color: #1e1b4b; }
.match-card:hover { border-color: #6366f1; transform: translateY(-6px); box-shadow: 0 12px 28px rgba(99,102,241,0.4); }
.match-card.selected { border-color: #4f46e5; background: rgba(199,210,254,0.9); }
.match-card.matched { border-color: #6366f1; opacity: 0.6; cursor: default; pointer-events: none; }
.match-card .shape { font-size: 2.8em; margin-bottom: 8px; }
.match-card .txt { font-size: 0.95em; color: #4338ca; }

.result { text-align: center; padding: 30px; }
.result .trophy { font-size: 7em; animation: bounce 1s infinite alternate; filter: drop-shadow(0 8px 20px rgba(99,102,241,0.5)); }
@keyframes bounce { from { transform: translateY(0) rotate(-6deg) scale(1); } to { transform: translateY(-22px) rotate(6deg) scale(1.08); } }
.result .score-big { font-size: 3em; color: #4f46e5; margin: 20px 0; text-shadow: 0 2px 8px rgba(99,102,241,0.35); font-weight: 900; }

.hidden { display: none !important; }
.screen-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.screen-header h2 { font-size: 1.5em; color: #4f46e5; text-shadow: 0 2px 6px rgba(99,102,241,0.3); font-weight: 900; }

/* BATCH FOOTER */
.batch-footer { text-align: center; padding: 30px 15px 45px; position: relative; z-index: 2; }
.batch-box { display: inline-block; padding: 16px 40px; border: 3px solid #4f46e5; border-radius: 60px; background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%); backdrop-filter: blur(14px); box-shadow: 0 0 40px rgba(99,102,241,0.5), inset 0 0 25px rgba(199,210,254,0.5); position: relative; overflow: hidden; animation: batchPulse 2.2s ease-in-out infinite alternate; white-space: nowrap; }
@keyframes batchPulse {
  from { box-shadow: 0 0 30px rgba(99,102,241,0.5), inset 0 0 20px rgba(199,210,254,0.4); transform: scale(1); }
  to { box-shadow: 0 0 60px rgba(99,102,241,0.85), inset 0 0 35px rgba(165,180,252,0.6); transform: scale(1.025); }
}
.batch-box::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(99,102,241,0.3), transparent); animation: shine 3.5s ease-in-out infinite; }
@keyframes shine { 0% { left: -100%; } 50%, 100% { left: 100%; } }
.batch-text { font-size: 1.5em; font-weight: 900; letter-spacing: 2px; background: linear-gradient(90deg, #4f46e5, #818cf8, #3730a3, #4f46e5); background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 3s linear infinite; position: relative; z-index: 1; filter: drop-shadow(0 2px 6px rgba(99,102,241,0.4)); display: inline-block; }

@media (max-width: 600px) {
  body { font-size: 16px; }
  h1 { font-size: 1.6em; }
  .options-grid { grid-template-columns: 1fr; }
  .memory-grid { grid-template-columns: repeat(3, 1fr); }
  .lesson-grid { grid-template-columns: 1fr; }
  .q-text { font-size: 1.15em; }
  .batch-text { font-size: 1em; letter-spacing: 1px; }
  .batch-box { padding: 12px 20px; }
}
</style>
</head>
<body class="theme-cpu">

<div id="bgLayer"></div>

<div class="music-ctrl">
  <span class="music-label" id="trackName">💜 Lesson 1</span>
  <button id="musicBtn" title="Toggle Music">🔊</button>
</div>

<div class="container">
  <div class="header-bar">
    <h1>🎓 ICT ADVENTURE 9 💜</h1>
    <p class="subtitle">9 ශ්‍රේණිය · තොරතුරු හා සන්නිවේදන තාක්ෂණය · 18 Games! 🎯</p>
  </div>

  <div id="mainMenu" class="card">
    <h2 style="text-align:center; color:#4f46e5; margin-bottom:25px; text-shadow: 0 2px 8px rgba(99,102,241,0.35); font-size:1.5em;">📚 පාඩමක් තෝරන්න! (Choose a Lesson!)</h2>
    <div class="lesson-grid" id="lessonGrid"></div>
  </div>

  <div id="gameScreen" class="card hidden">
    <div class="screen-header">
      <button class="btn small" onclick="backToLessons()">⬅️ Back</button>

      <button class="btn small" onclick="backToMain()">🏠 Home</button>

<script>
/* ============ AUDIO ============ */
let audioCtx = null, musicPlaying = false, musicTimer = null, currentTheme = 'cpu', melodyIdx = 0;

const themeMusic = {
  cpu:    [523.25,659.25,783.99,659.25,587.33,698.46,880.00,698.46,523.25,392.00,440.00,493.88,523.25,587.33,659.25,0],
  sheet:  [440.00,523.25,587.33,698.46,659.25,587.33,523.25,587.33,440.00,392.00,440.00,523.25,587.33,523.25,440.00,0],
  code:   [523.25,587.33,659.25,783.99,880.00,783.99,659.25,587.33,523.25,440.00,523.25,659.25,783.99,1046.50,880.00,0],
  micro:  [392.00,440.00,523.25,587.33,659.25,587.33,523.25,440.00,392.00,329.63,392.00,440.00,523.25,587.33,659.25,0],
  net:    [659.25,783.99,880.00,1046.50,987.77,880.00,783.99,659.25,587.33,659.25,783.99,880.00,987.77,880.00,783.99,0],
  society:[349.23,440.00,523.25,698.46,659.25,587.33,523.25,440.00,392.00,349.23,392.00,440.00,523.25,587.33,659.25,0]
};
const themeWave = { cpu:'triangle', sheet:'sine', code:'square', micro:'triangle', net:'sine', society:'triangle' };
const themeTempo = { cpu:380, sheet:400, code:300, micro:370, net:340, society:420 };
const themeVol = { cpu:0.045, sheet:0.05, code:0.04, micro:0.045, net:0.045, society:0.04 };
const themeName = { cpu:'💜 Lesson 1', sheet:'📊 Spreadsheets', code:'💻 Programming', micro:'🔧 Microcontrollers', net:'🌐 Networks', society:'🌍 ICT & Society' };

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function playNote(freq, dur, type='sine', vol=0.05) {
  if (!audioCtx || !freq) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function melodyLoop() {
  if (!musicPlaying) return;
  const notes = themeMusic[currentTheme] || themeMusic.cpu;
  const wave = themeWave[currentTheme] || 'triangle';
  const tempo = themeTempo[currentTheme] || 380;
  const vol = themeVol[currentTheme] || 0.045;
  const f = notes[melodyIdx % notes.length];
  if (f) { playNote(f, tempo/1000 * 0.85, wave, vol); playNote(f/2, tempo/1000 * 0.85, 'sine', vol * 0.5); }
  melodyIdx = (melodyIdx + 1) % notes.length;
  musicTimer = setTimeout(melodyLoop, tempo);
}
function setThemeMusic(theme) {
  currentTheme = theme; melodyIdx = 0;
  document.getElementById('trackName').textContent = themeName[theme] || '🎵';
  if (musicTimer) clearTimeout(musicTimer);
  if (musicPlaying) melodyLoop();
}
function toggleMusic() {
  initAudio();
  const btn = document.getElementById('musicBtn');
  if (musicPlaying) { musicPlaying = false; clearTimeout(musicTimer); btn.textContent = '🔇'; btn.classList.add('muted'); }
  else { musicPlaying = true; melodyIdx = 0; melodyLoop(); btn.textContent = '🔊'; btn.classList.remove('muted'); }
}
document.getElementById('musicBtn').onclick = toggleMusic;

/* Generic MC quiz */
function mcQuiz(c, questions, gameId) {
  let i = 0, score = 0;
  function draw() {
    if (i >= questions.length) {
      sfxWin(); confettiBurst();
      const bigEmoji = score === questions.length ? '🏆👑🌟' : score >= questions.length*0.7 ? '🥇🎉⭐' : '🥈💪📚';
      c.innerHTML = `<div class="result">
        <div class="trophy">${bigEmoji.split('').slice(0,3).map(e=>`<span style="display:inline-block;animation: bounce 1s infinite alternate;">${e}</span>`).join('')}</div>
        <div class="score-big">${score}/${questions.length}</div>
        <p style="color:#4338ca;margin-bottom:20px;font-size:1.2em;font-weight:bold;">
          ${score===questions.length?'🌟 PERFECT! විශිෂ්ටයි! 🌟':score>=questions.length*0.7?'🎉 Great job! හොඳයි! 🎉':'💪 Keep learning! නැවත උත්සාහ කරන්න! 💪'}
        </p>
        <button class="btn" onclick="startGame('${gameId}')">🔁 Try Again 🎯</button></div>`;
      return;
    }
    const q = questions[i];
    c.innerHTML = `
      <div class="scoreboard">
        <div class="score-box"><div class="lbl">🎯 Question</div><div class="val">${i+1}/${questions.length}</div></div>
        <div class="score-box"><div class="lbl">⭐ Score</div><div class="val">${score}</div></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${i/questions.length*100}%"></div></div>
      <div class="q-text">❓ ${q.q}</div>
      <div class="q-text-si">💭 ${q.qSi}</div>
      <div class="options-grid" id="opts"></div>
      <div class="feedback" id="fb"></div>`;
    const optsBox = document.getElementById('opts');
    const letters = ['🅰️','🅱️','🅾️','🆎'];
    q.opts.forEach((o, idx) => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.innerHTML = `<span style="font-size:1.2em;">${letters[idx]}</span> ${o}`;
      b.onclick = (e) => {
        if (idx === q.ans) { b.classList.add('correct'); score++; sfxOk(); floatPoints(e.clientX-30, e.clientY-30, '⭐ +1'); }
        else { b.classList.add('wrong'); [...optsBox.children][q.ans].classList.add('correct'); sfxNo(); }
        [...optsBox.children].forEach(x => x.disabled = true);
        const fb = document.getElementById('fb');
        fb.className = 'feedback show ' + (idx===q.ans?'ok':'no');
        fb.innerHTML = idx===q.ans ? '✅ <b>CORRECT!</b> නිවැරදියි! 🎉' : '❌ Answer: <b>' + q.opts[q.ans] + '</b>';
        setTimeout(() => { i++; draw(); }, 1400);
      };
      optsBox.appendChild(b);
    });
  }
  draw();
}

/* Generic sort */
function sortGame(c, items, bins, gameId) {
  let selected = null, placed = 0;
  c.innerHTML = `
    <p class="q-text">🎯 Click an item, then click the correct bin! 📦</p>
    <p class="q-text-si">💫 අයිතමයක් ක්ලික් කර නිවැරදි කොටුව ක්ලික් කරන්න!</p>
    <div class="progress-bar"><div class="progress-fill" id="srtP"></div></div>
    <div class="sort-pool" id="srtPool"></div>
    <div class="sort-bins" id="srtBins"></div>
    <div class="feedback" id="srtFb"></div>`;
  const pool = document.getElementById('srtPool');
  [...items].sort(() => Math.random() - 0.5).forEach(it => {
    const d = document.createElement('div');
    d.className = 'sort-item'; d.textContent = it.name; d.dataset.bin = it.bin;
    d.onclick = () => {
      sfxClick();
      document.querySelectorAll('.sort-item').forEach(x => x.classList.remove('selected'));
      d.classList.add('selected'); selected = d;
    };
    pool.appendChild(d);
  });
  const binsEl = document.getElementById('srtBins');
  bins.forEach(b => {
    const el = document.createElement('div');
    el.className = 'bin'; el.dataset.bin = b.id;
    el.innerHTML = `<div class="bin-title" style="font-size:1.3em;">${b.emoji} ${b.name}</div><div class="bin-items"></div>`;
    el.onclick = () => {
      if (!selected) return;
      if (el.dataset.bin === selected.dataset.bin) {
        sfxCoin();
        const clone = selected.cloneNode(true);
        clone.classList.remove('selected'); clone.classList.add('bin-item'); clone.onclick = null;
        el.querySelector('.bin-items').appendChild(clone);
        selected.remove(); selected = null;
        placed++;
        document.getElementById('srtP').style.width = (placed/items.length*100)+'%';
        if (placed === items.length) {
          document.getElementById('srtFb').className = 'feedback show ok';
          document.getElementById('srtFb').innerHTML = '🎉 <b>ALL SORTED!</b> Excellent! 🌟';
          sfxWin(); confettiBurst();
        }
      } else { sfxNo(); el.style.borderColor = '#4338ca'; setTimeout(() => el.style.borderColor = 'transparent', 400); }
    };
    binsEl.appendChild(el);
  });
}

/* Generic memory match */
function memoryGame(c, pairs, gameId) {
  let deck = [];
  pairs.forEach(p => { deck.push({t:p.a, key:p.key}); deck.push({t:p.b, key:p.key}); });
  deck.sort(() => Math.random() - 0.5);
  let flipped = [], matched = 0, moves = 0, lock = false;
  c.innerHTML = `
    <p class="q-text" style="text-align:center;">🃏 Match the pairs! 🎯 (Moves: <span id="mv" style="color:#4f46e5;">0</span>)</p>
    <div class="memory-grid" id="mg"></div>
    <div class="feedback" id="memFb"></div>`;
  const mg = document.getElementById('mg');
  deck.forEach(card => {
    const el = document.createElement('div');
    el.className = 'mem-card'; el.dataset.key = card.key;
    el.innerHTML = '<div class="back" style="font-size:2em;">❓</div>';
    el.onclick = () => {
      if (lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
      sfxClick();
      el.classList.add('flipped'); el.innerHTML = `<div style="font-size:1.1em;font-weight:900;">${card.t}</div>`;
      flipped.push(el);
      if (flipped.length === 2) {
        moves++; document.getElementById('mv').textContent = moves; lock = true;
        const [a, b] = flipped;
        if (a.dataset.key === b.dataset.key) {
          setTimeout(() => {
            a.classList.add('matched'); b.classList.add('matched');
            matched++; sfxCoin(); flipped = []; lock = false;
            if (matched === pairs.length) {
              document.getElementById('memFb').className = 'feedback show ok';
              document.getElementById('memFb').innerHTML = `🎉 <b>Matched in ${moves} moves!</b> 🌟`;
              sfxWin(); confettiBurst();
            }
          }, 500);
        } else {
          sfxNo();
          setTimeout(() => {
            a.classList.remove('flipped'); a.innerHTML = '<div class="back" style="font-size:2em;">❓</div>';
            b.classList.remove('flipped'); b.innerHTML = '<div class="back" style="font-size:2em;">❓</div>';
            flipped = []; lock = false;
          }, 900);
        }
      }
    };
    mg.appendChild(el);
  });
}
