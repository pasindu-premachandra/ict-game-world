<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 ICT Game | Ruwanpura NCoE Batch</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-purple:#f5f0ff;
    --bg-white:#ffffff;
    --card:#ffffff;
    --ink:#1e293b;
    --muted:#64748b;
    --line:#e9d5ff;
    --navy:#5b21b6;
    --navy-l:#ede9fe;
    --purple:#8b5cf6;
    --purple-d:#6d28d9;
    --purple-l:#f3e8ff;
    --blue:#6366f1;
    --blue-d:#4338ca;
    --green:#10b981;
    --green-d:#047857;
    --green-l:#d1fae5;
    --amber:#f59e0b;
    --amber-d:#b45309;
    --amber-l:#fef3c7;
    --red:#ef4444;
    --red-d:#b91c1c;
    --red-l:#fee2e2;
    --pink:#ec4899;
    --pink-d:#be185d;
    --cyan:#06b6d4;
    --cyan-d:#0e7490;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:linear-gradient(160deg,#faf5ff 0%,#f3e8ff 35%,#ede9fe 65%,#ffffff 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    font-size:16px;line-height:1.6;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden;
    position:relative;
  }

  /* ===== FLOATING BACKGROUND DECORATIONS ===== */
  .bg-decor{
    position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  }
  .float-icon{
    position:absolute;opacity:.13;
    animation:floatAround 18s ease-in-out infinite;
    filter:blur(.3px);
  }
  @keyframes floatAround{
    0%,100%{transform:translate(0,0) rotate(-8deg) scale(1);}
    25%{transform:translate(30px,-40px) rotate(10deg) scale(1.1);}
    50%{transform:translate(-25px,-20px) rotate(-6deg) scale(.95);}
    75%{transform:translate(20px,30px) rotate(12deg) scale(1.05);}
  }
  .bubble{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(139,92,246,.25), rgba(139,92,246,.05));
    animation:floatBubble 22s ease-in-out infinite;
  }
  @keyframes floatBubble{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-40px,-60px);}
  }

  /* ===== HEADER ===== */
  header{
    background:linear-gradient(90deg,#6d28d9 0%,#8b5cf6 50%,#a855f7 100%);
    color:#fff;padding:14px 22px;
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
    border-bottom:4px solid var(--purple-d);
    position:sticky;top:0;z-index:50;
    box-shadow:0 4px 20px rgba(139,92,246,.35);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-chip{
    background:rgba(255,255,255,.22);color:#fff;font-weight:900;font-size:15px;
    padding:7px 15px;border-radius:10px;letter-spacing:.8px;
    border:2px solid rgba(255,255,255,.35);
    font-family:'Fredoka',sans-serif;
  }
  .brand-text{font-weight:800;font-size:15px;}
  .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .chip{
    background:rgba(255,255,255,.15);padding:7px 15px;border-radius:20px;
    font-weight:800;font-size:14px;border:2px solid rgba(255,255,255,.25);
  }
  .chip.xp{color:#fef3c7;border-color:#fbbf24;background:rgba(251,191,36,.15);}
  .chip.combo{color:#fce7f3;border-color:#ec4899;background:rgba(236,72,153,.2);}
  .chip.combo.hot{animation:pulse .5s infinite alternate;}
  @keyframes pulse{to{transform:scale(1.1);box-shadow:0 0 20px rgba(236,72,153,.75);}}
  .music-btn{
    background:var(--amber);color:#78350f;border:none;font-family:inherit;
    font-weight:900;font-size:14px;padding:8px 16px;border-radius:20px;
    cursor:pointer;transition:.15s;box-shadow:0 3px 0 var(--amber-d);
  }
  .music-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--amber-d);}
  .music-btn.on{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d);}

  /* ===== MAIN ===== */
  main{flex:1;width:100%;max-width:1060px;margin:0 auto;padding:22px;position:relative;z-index:1;}
  .screen{display:none;animation:fade .35s;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  h1{font-size:30px;margin:0 0 10px;text-align:center;color:var(--navy);
    font-family:'Fredoka',sans-serif;font-weight:700;line-height:1.35;}
  h2{font-size:20px;margin:0 0 14px;text-align:center;color:var(--purple-d);font-weight:800;}
  .sub{text-align:center;color:var(--muted);font-size:15px;margin:0 0 22px;line-height:1.6;font-weight:600;}

  /* ===== BUTTONS ===== */
  .btn{
    background:var(--purple);color:#fff;border:none;font-family:inherit;
    font-weight:900;font-size:16px;padding:14px 24px;border-radius:14px;
    cursor:pointer;transition:.15s;box-shadow:0 5px 0 var(--purple-d);
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--purple-d);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--purple-d);}
  .btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d);}
  .btn.green:active{box-shadow:0 2px 0 var(--green-d);}
  .btn.amber{background:var(--amber);color:#78350f;box-shadow:0 5px 0 var(--amber-d);}
  .btn.amber:active{box-shadow:0 2px 0 var(--amber-d);}
  .btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);}
  .btn.ghost:active{box-shadow:0 2px 0 var(--line);}
  .btn.small{padding:10px 18px;font-size:14px;border-radius:10px;}

  .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;}

  /* ===== HOME ===== */
  .home-hero{
    background:linear-gradient(135deg,#ffffff 0%,#faf5ff 100%);
    border:2px solid var(--line);border-radius:20px;
    padding:28px 24px;text-align:center;margin-bottom:22px;
    box-shadow:0 8px 30px rgba(139,92,246,.12);
    position:relative;overflow:hidden;
  }
  .home-hero::before{
    content:'';position:absolute;top:-60px;right:-60px;
    width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(139,92,246,.15),transparent 70%);
  }
  .home-hero::after{
    content:'';position:absolute;bottom:-70px;left:-50px;
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(236,72,153,.12),transparent 70%);
  }
  .hero-face{font-size:74px;margin-bottom:8px;animation:bob 3s ease-in-out infinite;
    display:inline-block;position:relative;z-index:1;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-10px) rotate(3deg);}}
  .hero-msg{font-weight:800;color:var(--navy);font-size:17px;line-height:1.7;
    position:relative;z-index:1;}

  .lesson-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;
  }
  .lesson-card{
    background:#fff;border:2px solid var(--line);border-radius:18px;
    padding:24px 18px;cursor:pointer;text-align:center;
    transition:.22s;position:relative;overflow:hidden;
    box-shadow:0 4px 16px rgba(139,92,246,.08);
  }
  .lesson-card::before{
    content:'';position:absolute;top:-40px;right:-40px;
    width:110px;height:110px;border-radius:50%;opacity:.35;
  }
  .lesson-card.l1::before{background:#8b5cf6;}
  .lesson-card.l2::before{background:#ec4899;}
  .lesson-card.l3::before{background:#10b981;}
  .lesson-card.l4::before{background:#f59e0b;}
  .lesson-card.l5::before{background:#ef4444;}
  .lesson-card.l6::before{background:#06b6d4;}
  .lesson-card:hover{transform:translateY(-5px);border-color:var(--purple);
    box-shadow:0 12px 32px rgba(139,92,246,.2);}
  .lesson-card:active{transform:translateY(0);}
  .lesson-card .lc-num{
    position:absolute;top:12px;left:14px;
    background:var(--purple-l);color:var(--purple-d);
    font-weight:900;font-size:12px;padding:4px 12px;border-radius:20px;
    letter-spacing:.5px;z-index:1;
  }
  .lesson-card .lc-icon{
    width:72px;height:72px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:34px;
    margin:6px auto 12px;position:relative;z-index:1;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    color:#fff;
  }
  .lesson-card.l1 .lc-icon{background:linear-gradient(135deg,#a78bfa,#8b5cf6);}
  .lesson-card.l2 .lc-icon{background:linear-gradient(135deg,#f472b6,#ec4899);}
  .lesson-card.l3 .lc-icon{background:linear-gradient(135deg,#34d399,#10b981);}
  .lesson-card.l4 .lc-icon{background:linear-gradient(135deg,#fbbf24,#f59e0b);}
  .lesson-card.l5 .lc-icon{background:linear-gradient(135deg,#f87171,#ef4444);}
  .lesson-card.l6 .lc-icon{background:linear-gradient(135deg,#22d3ee,#06b6d4);}
  .lesson-card .lc-title{font-weight:800;color:var(--ink);font-size:16px;
    line-height:1.4;margin-bottom:8px;position:relative;z-index:1;}
  .lesson-card .lc-prog{font-size:13px;color:var(--muted);font-weight:700;position:relative;z-index:1;}
  .prog-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px;
    position:relative;z-index:1;}
  .prog-fill{height:100%;background:linear-gradient(90deg,#10b981,#34d399);
    width:0%;transition:width .6s;border-radius:4px;}

  /* ===== ACTIVITY LIST ===== */
  .act-list{display:grid;gap:12px;max-width:720px;margin:0 auto;}
  .act-item{
    background:#fff;border:2px solid var(--line);border-radius:14px;
    padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;
    transition:.18s;box-shadow:0 3px 10px rgba(139,92,246,.06);
  }
  .act-item:hover{border-color:var(--purple);transform:translateX(4px);
    box-shadow:0 6px 18px rgba(139,92,246,.15);}
  .act-item.done{border-color:var(--green);background:var(--green-l);}
  .act-item .an{
    width:46px;height:46px;border-radius:12px;background:var(--amber-l);
    color:var(--amber-d);font-weight:900;font-size:18px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .act-item.done .an{background:var(--green);color:#fff;}
  .act-item .anm{flex:1;font-weight:800;font-size:15px;}
  .act-item .at{
    background:var(--purple-l);color:var(--purple-d);font-weight:900;
    font-size:11px;padding:5px 12px;border-radius:20px;letter-spacing:.5px;flex-shrink:0;
    text-transform:uppercase;
  }

  /* ===== ACTIVITY VIEW ===== */
  .act-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .score-pill{
    background:#fff;border:2px solid var(--line);border-radius:20px;
    padding:8px 18px;font-weight:900;color:var(--navy);font-size:14px;margin-left:auto;
    box-shadow:0 2px 8px rgba(139,92,246,.08);
  }
  .act-body{background:#fff;border:2px solid var(--line);border-radius:18px;padding:24px;
    box-shadow:0 8px 30px rgba(139,92,246,.1);}
  .instr{
    background:linear-gradient(135deg,#f3e8ff,#ede9fe);
    color:var(--purple-d);border-radius:12px;
    padding:14px 20px;font-weight:800;font-size:15px;line-height:1.6;
    margin-bottom:20px;border-left:5px solid var(--purple);
    display:flex;gap:10px;align-items:flex-start;
  }
  .instr::before{content:'💡';font-size:22px;flex-shrink:0;}
  .feedback{margin-top:16px;font-weight:900;font-size:17px;min-height:26px;text-align:center;}

  /* ===== ACTIVITY TYPE: BITS TOGGLE ===== */
  .bits-wrap{text-align:center;margin:16px 0;}
  .target-box{
    display:inline-block;
    background:linear-gradient(135deg,#8b5cf6,#6d28d9);
    color:#fff;padding:14px 32px;border-radius:14px;
    font-weight:900;font-size:28px;letter-spacing:3px;margin-bottom:20px;
    box-shadow:0 6px 20px rgba(139,92,246,.4);
    font-family:'Fredoka',monospace;
  }
  .bits-row{
    display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0;
  }
  .bit-cell{
    width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .bit-val{font-size:12px;font-weight:900;color:var(--purple-d);}
  .bit-btn{
    width:58px;height:58px;border-radius:12px;border:3px solid var(--line);
    background:#fff;color:var(--muted);font-size:22px;font-weight:900;
    cursor:pointer;transition:.15s;font-family:'Fredoka',monospace;
    box-shadow:0 3px 0 var(--line);
  }
  .bit-btn:hover{border-color:var(--purple);}
  .bit-btn.on{
    background:linear-gradient(135deg,#10b981,#34d399);color:#fff;
    border-color:var(--green-d);
    box-shadow:0 3px 0 var(--green-d), 0 0 15px rgba(16,185,129,.5);
  }
  .bit-btn:active{transform:scale(.95);}
  .current-sum{
    display:inline-block;
    background:linear-gradient(135deg,#fef3c7,#fde68a);
    color:var(--amber-d);padding:12px 26px;border-radius:12px;
    font-weight:900;font-size:20px;margin-top:10px;
    box-shadow:0 3px 10px rgba(245,158,11,.3);
  }

  /* ===== ACTIVITY TYPE: TF ===== */
  .tf-card{
    background:linear-gradient(135deg,#ffffff,#faf5ff);
    border:3px solid var(--line);border-radius:16px;
    padding:26px;text-align:center;margin-bottom:16px;
    box-shadow:0 4px 16px rgba(139,92,246,.08);
  }
  .tf-statement{font-size:20px;font-weight:800;line-height:1.6;
    margin-bottom:22px;color:var(--ink);}
  .tf-buttons{display:flex;gap:16px;justify-content:center;}
  .tf-btn{
    flex:1;max-width:180px;padding:20px;font-family:inherit;
    font-weight:900;font-size:19px;border-radius:14px;cursor:pointer;
    border:3px solid;transition:.15s;
  }
  .tf-true{background:var(--green-l);color:var(--green-d);border-color:var(--green);}
  .tf-true:hover{background:var(--green);color:#fff;transform:translateY(-3px);
    box-shadow:0 6px 18px rgba(16,185,129,.4);}
  .tf-false{background:var(--red-l);color:var(--red-d);border-color:var(--red);}
  .tf-false:hover{background:var(--red);color:#fff;transform:translateY(-3px);
    box-shadow:0 6px 18px rgba(239,68,68,.4);}
  .tf-btn:disabled{cursor:default;opacity:.55;}

  /* ===== ACTIVITY TYPE: INPUT ===== */
  .input-box{
    background:linear-gradient(135deg,#ffffff,#faf5ff);
    border:3px solid var(--line);border-radius:16px;
    padding:28px;text-align:center;
  }
  .input-q{font-size:24px;font-weight:900;color:var(--ink);
    margin-bottom:12px;line-height:1.5;font-family:'Fredoka',sans-serif;}
  .input-hint{font-size:14px;color:var(--muted);margin-bottom:20px;font-weight:700;}
  .input-field{
    font-family:'Courier New',monospace;font-size:28px;font-weight:900;
    padding:16px 22px;border:3px solid var(--purple);border-radius:12px;
    text-align:center;width:280px;max-width:100%;color:var(--purple-d);
    letter-spacing:3px;background:#fff;transition:.15s;
  }
  .input-field:focus{outline:none;border-color:var(--green);
    box-shadow:0 0 0 5px rgba(16,185,129,.15);}

  /* ===== ACTIVITY TYPE: TRACE ===== */
  .trace-code{
    background:linear-gradient(135deg,#1e1b4b,#312e81);
    color:#e0e7ff;border-radius:14px;padding:20px;
    font-family:'Courier New',monospace;font-size:15px;line-height:1.75;
    margin-bottom:18px;overflow-x:auto;
    box-shadow:0 8px 24px rgba(30,27,75,.35);
    border-left:5px solid var(--purple);
  }
  .trace-options{display:grid;gap:11px;}
  .trace-opt{
    background:#fff;border:2px solid var(--line);border-radius:11px;
    padding:14px 20px;font-family:'Courier New',monospace;font-size:15px;
    font-weight:800;cursor:pointer;text-align:left;transition:.13s;
    color:var(--ink);
  }
  .trace-opt:hover{border-color:var(--purple);transform:translateX(4px);}
  .trace-opt.correct{background:var(--green-l);border-color:var(--green);
    color:var(--green-d);}
  .trace-opt.wrong{background:var(--red-l);border-color:var(--red);
    color:var(--red-d);}
  .trace-opt:disabled{cursor:default;}

  /* ===== ACTIVITY TYPE: GATE ===== */
  .gate-lab{
    background:linear-gradient(135deg,#ffffff,#faf5ff);
    border:2px solid var(--line);border-radius:16px;
    padding:26px;text-align:center;
  }
  .gate-inputs{display:flex;gap:24px;justify-content:center;margin-bottom:22px;flex-wrap:wrap;}
  .gate-input-toggle{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .gate-input-toggle .lbl{font-weight:900;font-size:13px;color:var(--purple-d);
    letter-spacing:1.5px;}
  .gate-btn{
    width:64px;height:64px;border-radius:50%;border:3px solid var(--line);
    background:#fff;color:var(--muted);font-size:26px;font-weight:900;
    cursor:default;font-family:'Fredoka',monospace;
    display:flex;align-items:center;justify-content:center;
  }
  .gate-btn.on{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff;
    border-color:var(--red-d);box-shadow:0 0 20px rgba(239,68,68,.5);}
  .gate-diagram{
    display:flex;align-items:center;justify-content:center;gap:18px;
    margin:24px 0;font-family:'Fredoka',monospace;font-size:18px;font-weight:900;
    flex-wrap:wrap;
  }
  .gate-shape{
    padding:14px 28px;border-radius:12px;font-weight:900;font-size:20px;
    background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;
    box-shadow:0 5px 15px rgba(139,92,246,.4);
    font-family:'Fredoka',sans-serif;
  }
  .gate-output{
    width:64px;height:64px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-size:26px;font-weight:900;
    background:var(--line);color:var(--muted);border:3px solid var(--line);
    transition:.3s;
  }
  .gate-output.on{background:linear-gradient(135deg,#10b981,#34d399);color:#fff;
    border-color:var(--green-d);box-shadow:0 0 20px rgba(16,185,129,.6);}
  .gate-choices{display:flex;gap:16px;justify-content:center;margin-top:18px;}
  .gate-choice{
    padding:14px 34px;font-family:'Fredoka',sans-serif;font-weight:900;font-size:20px;
    border-radius:12px;cursor:pointer;border:3px solid var(--line);
    background:#fff;color:var(--ink);transition:.15s;
  }
  .gate-choice:hover{border-color:var(--purple);transform:translateY(-3px);
    box-shadow:0 6px 18px rgba(139,92,246,.25);}
  .gate-choice.correct{background:var(--green-l);border-color:var(--green);color:var(--green-d);}
  .gate-choice.wrong{background:var(--red-l);border-color:var(--red);color:var(--red-d);}
  .gate-choice:disabled{cursor:default;opacity:.55;}

  /* ===== ACTIVITY TYPE: HOTSPOT ===== */
  .hotspot-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:14px;margin-top:12px;
  }
  .hotspot-item{
    background:linear-gradient(135deg,#ffffff,#faf5ff);
    border:3px solid var(--line);border-radius:14px;
    padding:18px 12px;cursor:pointer;transition:.18s;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    text-align:center;
  }
  .hotspot-item:hover{border-color:var(--purple);transform:translateY(-4px);
    box-shadow:0 8px 22px rgba(139,92,246,.2);}
  .hotspot-item.correct{background:var(--green-l);border-color:var(--green);
    pointer-events:none;}
  .hotspot-item.wrong{background:var(--red-l);border-color:var(--red);}
  .hotspot-item .hs-icon{font-size:38px;}
  .hotspot-item .hs-name{font-weight:900;font-size:14px;color:var(--ink);}
  .hotspot-item .hs-desc{font-size:11px;color:var(--muted);font-weight:700;}

  /* ===== ACTIVITY TYPE: QUERY ===== */
  .query-build{
    background:linear-gradient(135deg,#ffffff,#faf5ff);
    border:2px solid var(--line);border-radius:16px;padding:24px;
  }
  .query-slot{
    background:#f8fafc;border:3px dashed var(--line);border-radius:12px;
    padding:20px;min-height:64px;display:flex;flex-wrap:wrap;gap:9px;
    align-items:center;justify-content:center;margin-bottom:16px;
    transition:.2s;
  }
  .query-slot.active{border-color:var(--purple);background:var(--purple-l);}
  .query-tile{
    background:#fff;border:2px solid var(--line);border-radius:9px;
    padding:9px 15px;font-weight:800;font-size:14px;cursor:pointer;

/* ============================================================

let actx=null,musicOn=false,musicTimer=null,musicGain=null,currentMelody='home';
const MELODIES={
  home:{notes:[[330,1],[392,1],[440,1],[392,1],[330,2]],
    wave:'triangle',tempo:.30,bass:[165,220,165,196]},
  bits:{notes:[[523,1],[659,1],[784,1],[1047,1],[784,1],[659,1],[523,2]],

    wave:'triangle',tempo:.20,bass:[110,131,110,165]}
};
function ensureAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();
    musicGain=actx.createGain();musicGain.gain.value=.05;musicGain.connect(actx.destination);}
    catch(e){return;}}
  if(actx.state==='suspended')actx.resume();
}
function playMelody(){
  if(!musicOn||!actx)return;
  const m=MELODIES[currentMelody]||MELODIES.home;
  const beat=m.tempo;let t=actx.currentTime+.05;
  m.notes.forEach(([f,d])=>{
    if(f>0){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=m.wave;o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(1,t+.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d*beat*.9);
      o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d*beat);
    }
    t+=d*beat;
  });
  const total=m.notes.reduce((a,n)=>a+n[1],0)*beat;
  const bass=m.bass||[];
  bass.forEach((bf,i)=>{
    const bt=actx.currentTime+.05+(total/bass.length)*i;
    const bo=actx.createOscillator(),bg=actx.createGain();
    bo.type='sine';bo.frequency.value=bf;
    bg.gain.setValueAtTime(0.0001,bt);
    bg.gain.exponentialRampToValueAtTime(.5,bt+.03);
    bg.gain.exponentialRampToValueAtTime(0.0001,bt+beat*2);
    bo.connect(bg);bg.connect(musicGain);bo.start(bt);bo.stop(bt+beat*2+.05);
  });
  musicTimer=setTimeout(playMelody,total*1000+400);
}
function switchMusic(k){currentMelody=k;if(!musicOn)return;clearTimeout(musicTimer);playMelody();}
function toggleMusic(){
  ensureAudio();musicOn=!musicOn;
  const b=document.getElementById('musicBtn');
  if(musicOn){b.textContent='🔊 Music';b.classList.add('on');playMelody();}
  else{b.textContent='🔇 Music';b.classList.remove('on');clearTimeout(musicTimer);}
}
document.getElementById('musicBtn').onclick=toggleMusic;
function blip(f,d=.08,t='sine',v=.13,delay=0){
  if(!actx)return;const tt=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,tt);
  g.gain.exponentialRampToValueAtTime(v,tt+.01);
  g.gain.exponentialRampToValueAtTime(0.0001,tt+d);
  o.connect(g);g.connect(actx.destination);o.start(tt);o.stop(tt+d+.03);
}
const sfx={
  correct(){ensureAudio();[659,784,988,1319].forEach((f,i)=>blip(f,.15,'sine',.18,i*.05));},
  wrong(){ensureAudio();blip(220,.15,'sawtooth',.1,0);blip(160,.2,'sawtooth',.1,.1);},
  click(){ensureAudio();blip(1000,.04,'square',.04);},
  win(){ensureAudio();[523,659,784,1047,1319,1568].forEach((f,i)=>blip(f,.22,'triangle',.15,i*.1));},
  combo(){ensureAudio();[880,1109,1319].forEach((f,i)=>blip(f,.1,'square',.14,i*.04));}
};

function addCombo(){

}

function floatScore(text,color){

function confetti(n){
  const colors=['#8b5cf6','#ec4899','#fbbf24','#10b981','#06b6d4','#f59e0b'];
  for(let i=0;i<n;i++){

    if(Math.random()>.6)c.style.borderRadius='50%';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4200);
  }
}

/* ============================================================

   ============================================================ */
function renderHome(){
  let cards='';
  LESSONS.forEach(l=>{

    <section class="screen active">
      <div class="home-hero">
        <div class="hero-face">🤖</div>
        <div class="hero-msg">Welcome to the Grade 8 ICT Arcade! 🎮<br>

/* ============================================================
   BITS
   ============================================================ */
function renderBits(c,a){
  let idx=0,correct=0;
  const total=a.targets.length;
  function draw(){
    if(idx>=total)return finish();
    const target=a.targets[idx];
    c.innerHTML=`
      <div class="instr">${a.instruction}</div>
      <div class="bits-wrap">
        <div class="target-box">🎯 TARGET: ${target}</div>
        <div class="bits-row" id="bitsRow"></div>
        <div class="current-sum" id="currSum">Current Sum: 0</div>
      </div>
      <div class="btn-row">
        <button class="btn green" id="checkBtn">✔ Check Answer</button>
      </div>
      <div class="feedback" id="fb"></div>
    `;
    const row=document.getElementById('bitsRow');
    const placeValues=[128,64,32,16,8,4,2,1];
    placeValues.forEach((pv,i)=>{
      const cell=document.createElement('div');cell.className='bit-cell';
      cell.innerHTML=`
        <div class="bit-val">${pv}</div>
        <button class="bit-btn" data-idx="${i}" data-pv="${pv}">0</button>
      `;
      row.appendChild(cell);
    });
    row.querySelectorAll('.bit-btn').forEach(btn=>{
      btn.onclick=()=>{
        sfx.click();
        const on=btn.classList.toggle('on');
        btn.textContent=on?'1':'0';
        updateSum();
      };
    });
    document.getElementById('checkBtn').onclick=check;
    document.getElementById('scorePill').textContent=`Question: ${idx+1} / ${total}`;
  }
  function updateSum(){
    let sum=0;
    document.querySelectorAll('.bit-btn').forEach(b=>{
      if(b.classList.contains('on'))sum+=parseInt(b.dataset.pv);
    });
    document.getElementById('currSum').textContent='Current Sum: '+sum;
  }
  function check(){
    const target=a.targets[idx];
    let sum=0;
    document.querySelectorAll('.bit-btn').forEach(b=>{
      if(b.classList.contains('on'))sum+=parseInt(b.dataset.pv);
    });
    if(sum===target){
      sfx.correct();addCombo();
      floatScore('+'+(15+state.combo*3)+' XP','#10b981');
      addXP(15+state.combo*3);
      correct++;
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct! 🎉</span>';
      setTimeout(()=>{idx++;draw();},1200);
    }else{
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Sum is '+sum+', but target is '+target+'. Try again.</span>';
    }
  }
  function finish(){
    state.completed[state.lesson.id+'-'+a.id]=true;
    sfx.win();confetti(60);
    const stars=correct===total?3:correct>=total*.6?2:1;
    let starHTML='';
    for(let i=0;i<3;i++)starHTML+=`<span class="${i<stars?'star-on':'star-off'}">⭐</span>`;
    c.innerHTML=`
      <div class="result">
        <div class="emoji">${stars===3?'🏆':stars===2?'🎯':'💪'}</div>
        <h2>Level Complete!</h2>
        <div class="stars">${starHTML}</div>
        <div class="score">${correct} / ${total}</div>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
          <button class="btn ghost" onclick="goHome()">🏠 Home</button>
        </div>
      </div>`;
  }
  draw();
}

   TF
   ============================================================ */
function renderTF(c,a){
  let idx=0,correct=0;const total=a.statements.length;
  function draw(){
    if(idx>=total)return finish();
    const st=a.statements[idx];
    c.innerHTML=`
      <div class="instr">${a.instruction}</div>
      <div class="tf-card">
        <div class="tf-statement">${st.s}</div>
        <div class="tf-buttons">
          <button class="tf-btn tf-true" id="btnTrue">✓ TRUE</button>
          <button class="tf-btn tf-false" id="btnFalse">✗ FALSE</button>
        </div>
      </div>
      <div class="feedback" id="fb"></div>
    `;
    document.getElementById('btnTrue').onclick=()=>pick(true);
    document.getElementById('btnFalse').onclick=()=>pick(false);
    document.getElementById('scorePill').textContent=`Question: ${idx+1} / ${total}`;
  }
  function pick(val){
    const st=a.statements[idx];
    const btnT=document.getElementById('btnTrue');
    const btnF=document.getElementById('btnFalse');
    btnT.disabled=true;btnF.disabled=true;
    const chosen=val?btnT:btnF;
    if(val===st.a){
      chosen.style.background='var(--green)';chosen.style.color='#fff';
      sfx.correct();addCombo();
      floatScore('+'+(10+state.combo*2)+' XP','#10b981');
      addXP(10+state.combo*2);
      correct++;
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct!</span>';
    }else{
      chosen.style.background='var(--red)';chosen.style.color='#fff';
      const right=st.a?btnT:btnF;
      right.style.borderColor='var(--green)';right.style.borderWidth='4px';
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Wrong. Correct: '+(st.a?'TRUE':'FALSE')+'.</span>';
    }
    setTimeout(()=>{idx++;draw();},1300);
  }
  function finish(){
    state.completed[state.lesson.id+'-'+a.id]=true;
    sfx.win();
    const stars=correct===total?3:correct>=total*.6?2:1;
    let starHTML='';
    for(let i=0;i<3;i++)starHTML+=`<span class="${i<stars?'star-on':'star-off'}">⭐</span>`;
    if(stars===3)confetti(60);
    c.innerHTML=`
      <div class="result">
        <div class="emoji">${stars===3?'🏆':stars===2?'🎯':'💪'}</div>
        <h2>Complete!</h2>
        <div class="stars">${starHTML}</div>
        <div class="score">${correct} / ${total}</div>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
          <button class="btn ghost" onclick="goHome()">🏠 Home</button>
        </div>
      </div>`;
  }
  draw();
}

      <div class="instr">${a.instruction}</div>

    }else{
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Wrong. Try again.</span>';
      document.getElementById('inp').value='';
      document.getElementById('inp').focus();

/* ============================================================
   GATE
   ============================================================ */
function renderGate(c,a){
  let idx=0,correct=0;const total=a.rounds.length;
  function gateFormula(gate,a,b){
    if(gate==='AND')return `${a} . ${b}`;
    if(gate==='OR')return `${a} + ${b}`;
    if(gate==='NOT')return `NOT ${a}`;
  }
  function draw(){
    if(idx>=total)return finish();
    const r=a.rounds[idx];
    c.innerHTML=`
      <div class="instr">${a.instruction}</div>
      <div class="gate-lab">
        <div style="font-weight:900;color:var(--purple-d);font-size:19px;margin-bottom:18px;font-family:'Fredoka',sans-serif;">
          ⚡ ${r.gate} GATE — What is the output?
        </div>
        <div class="gate-inputs">
          <div class="gate-input-toggle">
            <div class="lbl">INPUT A</div>
            <div class="gate-btn ${r.a===1?'on':''}">${r.a}</div>
          </div>
          ${r.b!==null?`
          <div class="gate-input-toggle">
            <div class="lbl">INPUT B</div>
            <div class="gate-btn ${r.b===1?'on':''}">${r.b}</div>
          </div>`:''}
        </div>
        <div class="gate-diagram">
          <div class="gate-shape">${r.gate}</div>
          <div style="font-size:28px;color:var(--purple);">→</div>
          <div class="gate-output" id="gOut">?</div>
        </div>
        <div style="font-family:'Fredoka',monospace;font-weight:900;font-size:18px;color:var(--muted);">
          ${gateFormula(r.gate,r.a,r.b===null?'':r.b)}
        </div>
        <div class="gate-choices">
          <button class="gate-choice" id="ch0">0</button>
          <button class="gate-choice" id="ch1">1</button>
        </div>
      </div>
      <div class="feedback" id="fb"></div>
    `;
    document.getElementById('ch0').onclick=()=>pick('0');
    document.getElementById('ch1').onclick=()=>pick('1');
    document.getElementById('scorePill').textContent=`Round: ${idx+1} / ${total}`;
  }
  function pick(v){
    const r=a.rounds[idx];
    document.getElementById('ch0').disabled=true;
    document.getElementById('ch1').disabled=true;
    const out=document.getElementById('gOut');
    out.textContent=v;
    if(v===r.correct){
      out.classList.add('on');
      sfx.correct();addCombo();
      floatScore('+'+(12+state.combo*2)+' XP','#10b981');
      addXP(12+state.combo*2);
      correct++;
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct!</span>';
    }else{
      out.style.background='var(--red)';out.style.color='#fff';out.style.borderColor='var(--red-d)';
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Wrong. Correct output is '+r.correct+'.</span>';
    }
    setTimeout(()=>{idx++;draw();},1400);
  }
  function finish(){
    state.completed[state.lesson.id+'-'+a.id]=true;
    sfx.win();
    const stars=correct===total?3:correct>=total*.6?2:1;
    let starHTML='';
    for(let i=0;i<3;i++)starHTML+=`<span class="${i<stars?'star-on':'star-off'}">⭐</span>`;
    if(stars===3)confetti(60);
    c.innerHTML=`
      <div class="result">
        <div class="emoji">${stars===3?'🏆':stars===2?'🎯':'💪'}</div>
        <h2>Complete!</h2>
        <div class="stars">${starHTML}</div>
        <div class="score">${correct} / ${total}</div>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
          <button class="btn ghost" onclick="goHome()">🏠 Home</button>
        </div>
      </div>`;
  }
  draw();
}

/* ============================================================
   HOTSPOT
   ============================================================ */
function renderHotspot(c,a){
  let idx=0,correct=0;const total=a.rounds.length;
  function optSet(){
    if(a.id==='2.1')return PORT_OPTIONS;
    if(a.id==='3.1')return TOOL_OPTIONS;
    if(a.id==='6.2')return HTML_OPTIONS;
    return PORT_OPTIONS;
  }
  function draw(){
    if(idx>=total)return finish();
    const r=a.rounds[idx];
    const opts=optSet();
    c.innerHTML=`
      <div class="instr">${a.instruction}</div>
      <div style="font-weight:900;color:var(--purple-d);font-size:18px;text-align:center;margin-bottom:18px;">
        ${r.q}
      </div>
      <div class="hotspot-grid" id="grid"></div>
      <div class="feedback" id="fb"></div>
    `;
    const grid=document.getElementById('grid');
    opts.forEach(o=>{
      const d=document.createElement('div');
      d.className='hotspot-item';
      d.innerHTML=`
        <div class="hs-icon">${o.icon}</div>
        <div class="hs-name">${o.name}</div>
        <div class="hs-desc">${o.desc}</div>
      `;
      d.onclick=()=>pick(o.key,d);
      grid.appendChild(d);
    });
    document.getElementById('scorePill').textContent=`Question: ${idx+1} / ${total}`;
  }
  function pick(key,el){
    const r=a.rounds[idx];
    if(key===r.ans){
      el.classList.add('correct');
      sfx.correct();addCombo();
      floatScore('+'+(12+state.combo*2)+' XP','#10b981');
      addXP(12+state.combo*2);
      correct++;
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Correct!</span>';
      setTimeout(()=>{idx++;draw();},1200);
    }else{
      el.classList.add('wrong');
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ That\'s not right. Try again.</span>';
      setTimeout(()=>el.classList.remove('wrong'),600);
    }
  }
  function finish(){
    state.completed[state.lesson.id+'-'+a.id]=true;
    sfx.win();
    const stars=correct===total?3:correct>=total*.6?2:1;
    let starHTML='';
    for(let i=0;i<3;i++)starHTML+=`<span class="${i<stars?'star-on':'star-off'}">⭐</span>`;
    if(stars===3)confetti(60);
    c.innerHTML=`
      <div class="result">
        <div class="emoji">${stars===3?'🏆':stars===2?'🎯':'💪'}</div>
        <h2>Complete!</h2>
        <div class="stars">${starHTML}</div>
        <div class="score">${correct} / ${total}</div>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
          <button class="btn ghost" onclick="goHome()">🏠 Home</button>
        </div>
      </div>`;
  }
  draw();
}

/* ============================================================
   QUERY
   ============================================================ */
function renderQuery(c,a){
  let idx=0,correct=0;const total=a.rounds.length;
  let placed=[];
  function draw(){
    if(idx>=total)return finish();
    const r=a.rounds[idx];
    placed=[];
    c.innerHTML=`
      <div class="instr">${a.instruction}</div>
      <div class="query-build">
        <div style="font-weight:900;color:var(--purple-d);font-size:17px;margin-bottom:12px;text-align:center;">
          🎯 Task: ${r.q}
        </div>
        <div class="query-slot" id="slot">
          <span style="color:var(--muted);font-weight:700;">Click tiles below to add them here...</span>
        </div>
        <div class="query-pool" id="pool"></div>
      </div>
      <div class="btn-row">
        <button class="btn green" id="checkBtn">✔ Check</button>
        <button class="btn ghost small" id="clearBtn">↺ Clear</button>
      </div>
      <div class="feedback" id="fb"></div>
    `;
    const pool=document.getElementById('pool');
    r.pool.forEach((p,i)=>{
      const t=document.createElement('div');
      t.className='query-tile';t.textContent=p;
      t.onclick=()=>{
        if(t.classList.contains('used'))return;
        sfx.click();
        t.classList.add('used');
        placed.push({text:p,el:t});
        renderSlot();
      };
      pool.appendChild(t);
    });
    document.getElementById('checkBtn').onclick=check;
    document.getElementById('clearBtn').onclick=()=>{
      placed.forEach(p=>p.el.classList.remove('used'));
      placed=[];
      renderSlot();
    };
    document.getElementById('scorePill').textContent=`Task: ${idx+1} / ${total}`;
  }
  function renderSlot(){
    const slot=document.getElementById('slot');
    if(placed.length===0){
      slot.innerHTML='<span style="color:var(--muted);font-weight:700;">Click tiles below to add them here...</span>';
      return;
    }
    slot.innerHTML='';
    placed.forEach(p=>{
      const t=document.createElement('div');
      t.className='query-tile placed';t.textContent=p.text;
      t.onclick=()=>{
        sfx.click();
        p.el.classList.remove('used');
        placed=placed.filter(x=>x!==p);
        renderSlot();
      };
      slot.appendChild(t);
    });
  }
  function check(){
    const r=a.rounds[idx];
    const userTexts=placed.map(p=>p.text);
    const correctTexts=r.correct;
    if(userTexts.length===correctTexts.length &&
       userTexts.every(t=>correctTexts.includes(t)) &&
       correctTexts.every(t=>userTexts.includes(t))){
      sfx.correct();addCombo();
      floatScore('+'+(15+state.combo*3)+' XP','#10b981');
      addXP(15+state.combo*3);
      correct++;
      document.getElementById('fb').innerHTML='<span style="color:var(--green-d)">✔ Perfect search query! 🎉</span>';
      setTimeout(()=>{idx++;draw();},1400);
    }else{
      sfx.wrong();resetCombo();
      document.getElementById('fb').innerHTML='<span style="color:var(--red-d)">✘ Not quite. Try again. (Tip: use keywords, not full sentences.)</span>';
    }
  }
  function finish(){
    state.completed[state.lesson.id+'-'+a.id]=true;
    sfx.win();
    const stars=correct===total?3:correct>=total*.6?2:1;
    let starHTML='';
    for(let i=0;i<3;i++)starHTML+=`<span class="${i<stars?'star-on':'star-off'}">⭐</span>`;
    if(stars===3)confetti(60);
    c.innerHTML=`
      <div class="result">
        <div class="emoji">${stars===3?'🏆':stars===2?'🎯':'💪'}</div>
        <h2>Complete!</h2>
        <div class="stars">${starHTML}</div>
        <div class="score">${correct} / ${total}</div>
        <div class="btn-row">
          <button class="btn" onclick="goLesson(${state.lesson.id})">← Level</button>
          <button class="btn ghost" onclick="goHome()">🏠 Home</button>
        </div>
      </div>`;
  }
  draw();
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('pointerdown',ensureAudio,{once:true});
buildBackground();
renderHome();
</script>
